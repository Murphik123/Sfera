<!DOCTYPE html>
<html lang="tm">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFERA - Marketplace</title>
    
    <!-- Единое подключение глобальных стилей -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/glass.css">
    <link rel="stylesheet" href="css/ui.css">

    <!-- Уникальные стили маркетплейса (без переопределения шапки) -->
    <style>
        .marketplace-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .market-header-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
            padding-bottom: 1rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted, #a0aec0);
            font-size: 1.1rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .tab-btn.active {
            color: var(--accent-color, #00f2fe);
            border-bottom: 2px solid var(--accent-color, #00f2fe);
            font-weight: 600;
        }

        /* Сетка товаров */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 1.25rem;
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: var(--radius-sm, 8px);
            margin-bottom: 1rem;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent-color, #00f2fe);
            margin: 0.5rem 0;
        }

        /* Виджет корзины */
        .cart-drawer {
            margin-top: 2rem;
            padding: 1.5rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <!-- Фоновый холст для частиц -->
    <canvas id="particles-canvas"></canvas>

    <!-- Шапка (Header) -->
    <header class="header glass-panel">
        <a href="index.html" class="back-link" id="backLink" data-i18n="btn_back">← Yza</a>
        
        <div class="header-right">
            <div class="user-info">
                <div class="user-avatar">S</div>
                <span id="user-name">User</span>
            </div>

            <!-- Селектор языков -->
            <div class="lang-selector">
                <button class="lang-btn" data-lang="tm">TM</button>
                <button class="lang-btn" data-lang="ru">RU</button>
                <button class="lang-btn" data-lang="en">EN</button>
            </div>

            <button class="logout-btn" id="logoutBtn" data-i18n="nav_logout">Çykmak</button>
        </div>
    </header>

    <!-- Основной контент Маркетплейса -->
    <main class="marketplace-container">
        <div class="market-header-tabs">
            <button class="tab-btn active" onclick="switchTab('catalog')" data-i18n="nav_marketplace">Katalog</button>
            <button class="tab-btn" onclick="switchTab('cart')"><span data-i18n="cart_title">Sebet</span> (<span id="cart-count">0</span>)</button>
        </div>

        <!-- Секция каталога -->
        <section id="section-catalog">
            <div class="products-grid" id="products-container"></div>
        </section>

        <!-- Секция корзины -->
        <section id="section-cart" class="glass-panel cart-drawer" style="display: none;">
            <h2 data-i18n="cart_title">Sebet</h2>
            <div id="cart-items"></div>
            <hr style="margin: 1rem 0; border-color: rgba(255,255,255,0.1);">
            <h3>Jemi: <span id="cart-total">0</span> TMT</h3>
        </section>
    </main>

    <!-- Подключение скриптов в верной последовательности -->
    <script src="js/i18n.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/main.js"></script>

    <!-- Локальный скрипт логики Маркетплейса -->
    <script>
        // 1. Инициализация локального состояния
        const state = {
            products: [
                { id: 1, name: "Smartfon Sfera X", price: 2500, img: "https://via.placeholder.com/260x180" },
                { id: 2, name: "Noutbuk Sfera Pro", price: 8900, img: "https://via.placeholder.com/260x180" },
                { id: 3, name: "Qulaqlyk Wireless", price: 450, img: "https://via.placeholder.com/260x180" }
            ],
            cart: []
        };

        // 2. Объявление функций рендеринга до вызова
        function renderProducts() {
            const container = document.getElementById('products-container');
            if (!container) return;
            
            container.innerHTML = state.products.map(p => `
                <div class="product-card glass-panel">
                    <img src="${p.img}" alt="${p.name}" class="product-img">
                    <h3>${p.name}</h3>
                    <div class="product-price">${p.price} TMT</div>
                    <button class="btn-glass" onclick="addToCart(${p.id})" data-i18n="btn_add_to_cart">Sebede goşmak</button>
                </div>
            `).join('');
            
            if (window.i18n) window.i18n.init();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const countEl = document.getElementById('cart-count');
            if (!container) return;

            let total = 0;
            let count = 0;

            container.innerHTML = state.cart.map(item => {
                total += item.price * item.quantity;
                count += item.quantity;
                return `
                    <div class="cart-item">
                        <div>
                            <strong>${item.name}</strong> (${item.quantity} sany)
                        </div>
                        <div>${item.price * item.quantity} TMT</div>
                    </div>
                `;
            }).join('') || '<p>Sebet boş</p>';

            if (totalEl) totalEl.textContent = total;
            if (countEl) countEl.textContent = count;
        }

        function addToCart(id) {
            const product = state.products.find(p => p.id === id);
            if (!product) return;

            const existing = state.cart.find(c => c.id === id);
            if (existing) {
                existing.quantity++;
            } else {
                state.cart.push({ ...product, quantity: 1 });
            }

            renderCart();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('section-catalog').style.display = tab === 'catalog' ? 'block' : 'none';
            document.getElementById('section-cart').style.display = tab === 'cart' ? 'block' : 'none';
        }

        // 3. Фолбэк генерации частиц (если particles.js не сработал)
        function ensureParticlesFallback() {
            const canvas = document.getElementById('particles-canvas');
            if (canvas && (!window.Particles || typeof window.Particles.init !== 'function')) {
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                for (let i = 0; i < 30; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // 4. Запуск при готовности DOM
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            renderCart();
            ensureParticlesFallback();
        });
    </script>
</body>
</html>
