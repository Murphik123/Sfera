<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>СФЕРА — Resmiýetler</title>

    <!-- Общий CSS -->
    <link rel="stylesheet" href="/css/style.css" />
    <!-- Chart.js для круговой диаграммы -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        /* ===== СПЕЦИФИЧНЫЕ СТИЛИ ДЛЯ ДОКУМЕНТОВ ===== */
        .doc-page {
            padding: 140px 7% 60px;
            min-height: 100vh;
        }
        .doc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .doc-header h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #b4d7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .doc-header .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #008cff);
            color: white;
            box-shadow: 0 10px 30px rgba(0,212,255,.25);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0,212,255,.4);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,.2);
            color: white;
        }
        .btn-outline:hover {
            background: rgba(255,255,255,.05);
            border-color: #00d4ff;
        }
        .btn-success {
            background: linear-gradient(135deg, #00ffa3, #00b894);
            color: #08131d;
        }
        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0,255,170,.3);
        }
        .btn-danger {
            background: rgba(200,0,0,.15);
            border: 1px solid rgba(200,0,0,.3);
            color: #ff6b6b;
        }
        .btn-danger:hover {
            background: rgba(200,0,0,.25);
        }

        .doc-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,.05);
            padding-bottom: 4px;
        }
        .doc-tabs button {
            background: transparent;
            border: none;
            color: #9fb5c8;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: .3s;
            border-bottom: 3px solid transparent;
        }
        .doc-tabs button.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
        }
        .doc-tabs button:hover {
            color: white;
        }

        .tab-content {
            display: none;
            animation: fadeUp .4s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Карточки документов */
        .docs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 16px;
        }
        .doc-item {
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 16px;
            padding: 18px;
            backdrop-filter: blur(10px);
            transition: .3s;
            position: relative;
        }
        .doc-item:hover {
            border-color: #00d4ff;
            transform: translateY(-4px);
        }
        .doc-item .doc-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .doc-item .doc-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .doc-item .doc-type {
            font-size: 13px;
            color: #bdd0df;
        }
        .doc-item .doc-status {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }
        .status-verified { background: rgba(0,255,170,.15); color: #00ffa3; }
        .status-pending { background: rgba(255,193,7,.15); color: #ffc107; }
        .status-invalid { background: rgba(255,0,0,.15); color: #ff6b6b; }
        .status-manual { background: rgba(0,212,255,.15); color: #00d4ff; }

        .doc-item .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,0,0,.1);
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            transition: .2s;
        }
        .doc-item .delete-btn:hover {
            background: rgba(255,0,0,.2);
        }

        .upload-area {
            border: 2px dashed rgba(255,255,255,.2);
            border-radius: 18px;
            padding: 40px;
            text-align: center;
            color: #bdd0df;
            transition: .3s;
            cursor: pointer;
            margin: 16px 0;
        }
        .upload-area:hover {
            border-color: #00d4ff;
            background: rgba(0,212,255,.05);
        }
        .upload-area input {
            display: none;
        }
        .upload-area .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .verification-result {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 16px;
            display: none;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.08);
        }
        .verification-result.active {
            display: block;
        }
        .verification-result .row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,.05);
        }
        .verification-result .row:last-child {
            border-bottom: none;
        }
        .verification-result .label {
            color: #9fb5c8;
        }
        .verification-result .value {
            color: white;
            font-weight: 500;
        }

        .sign-form {
            max-width: 500px;
            margin: 0 auto;
        }
        .sign-form .form-group {
            margin-bottom: 16px;
        }
        .sign-form .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #dbe9ff;
            margin-bottom: 6px;
        }
        .sign-form .form-group input,
        .sign-form .form-group select,
        .sign-form .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.05);
            color: white;
            font-size: 15px;
            transition: .3s;
            outline: none;
        }
        .sign-form .form-group input:focus,
        .sign-form .form-group select:focus,
        .sign-form .form-group textarea:focus {
            border-color: #00d4ff;
        }
        .sign-form .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #bdd0df;
        }
        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
        }
        .filter-bar select {
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.05);
            color: white;
            font-size: 14px;
            outline: none;
        }
        .filter-bar select:focus {
            border-color: #00d4ff;
        }
        .filter-bar input {
            flex: 1;
            min-width: 150px;
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.05);
            color: white;
            font-size: 14px;
            outline: none;
        }
        .filter-bar input:focus {
            border-color: #00d4ff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-item {
            background: rgba(255,255,255,.04);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }
        .stat-item .number {
            font-size: 32px;
            font-weight: 700;
        }
        .stat-item .label {
            font-size: 13px;
            color: #9fb5c8;
        }

        .chart-container {
            background: rgba(255,255,255,.04);
            border-radius: 16px;
            padding: 16px;
            margin: 16px 0;
            max-width: 300px;
            max-height: 300px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Тосты */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(13,28,41,.95);
            border: 1px solid rgba(0,212,255,.3);
            border-radius: 16px;
            padding: 16px 24px;
            color: white;
            font-weight: 500;
            box-shadow: 0 20px 40px rgba(0,0,0,.4);
            z-index: 2000;
            animation: slideUp 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .toast.success { border-left: 4px solid #00ffa3; }
        .toast.error { border-left: 4px solid #ff6b6b; }
        .toast.info { border-left: 4px solid #00d4ff; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .doc-tabs button { padding: 10px 14px; font-size: 13px; }
            .docs-grid { grid-template-columns: 1fr; }
            .filter-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>

    <div id="particles"></div>

    <!-- ШАПКА (единая) -->
    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00ffa3"/>
                                <stop offset="50%" stop-color="#00d4ff"/>
                                <stop offset="100%" stop-color="#1f6bff"/>
                            </linearGradient>
                            <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
                                <feGaussianBlur stdDeviation="4" result="blur"/>
                                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                            </filter>
                        </defs>
                        <circle cx="50" cy="50" r="28" fill="url(#logoGrad)" opacity="0.15" filter="url(#logoGlow)"/>
                        <g filter="url(#logoGlow)">
                            <circle cx="50" cy="50" r="40" stroke="url(#logoGrad)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.4"/>
                            <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
                            <circle cx="48" cy="48" r="3.5" fill="#ffffff" filter="url(#logoGlow)"/>
                        </g>
                    </svg>
                </div>
                <div class="logo-text">
                    <h2>SFERA</h2>
                    <p id="logoSubtitle" data-i18n="logo_subtitle">Milli Sanly Platforma</p>
                </div>
            </a>

            <div class="header-right">
                <span class="user-info">👤 <strong id="username">User</strong></span>
                <button class="lang" id="langBtn">RU</button>
                <button class="logout-btn" id="logoutBtn" data-i18n="logout">🚪 Çykmak</button>
                <a href="#" id="backLink" class="btn-switch" style="display:inline-block; padding:8px 16px; background:transparent; border:1px solid rgba(255,255,255,.15); color:white; border-radius:12px; text-decoration:none;" data-i18n="back">← Yza</a>
            </div>
        </div>
    </header>

    <section class="doc-page">
        <div class="container">
            <div class="doc-header">
                <h1 data-i18n="page_title">📄 Resmiýetler</h1>
                <div class="actions">
                    <button class="btn btn-outline" id="refreshBtn" data-i18n="refresh">⟳ Täzele</button>
                </div>
            </div>

            <!-- Вкладки -->
            <div class="doc-tabs">
                <button class="active" data-tab="storage" data-i18n="tab_storage">Ammar</button>
                <button data-tab="verify" data-i18n="tab_verify">Barlag</button>
                <button data-tab="sign" data-i18n="tab_sign">Gol çekmek</button>
                <button data-tab="reports" data-i18n="tab_reports">Hasabat</button>
            </div>

            <!-- ============================================ -->
            <!-- ВКЛАДКА ХРАНИЛИЩЕ -->
            <div class="tab-content active" id="tab-storage">
                <div class="filter-bar">
                    <input type="text" id="docSearch" placeholder="Gözleg..." data-i18n-placeholder="search_placeholder" />
                    <select id="statusFilter" data-i18n="filter_status">
                        <option value="all" data-i18n="all_status">Ähli status</option>
                        <option value="verified" data-i18n="status_verified">Tassyklandy</option>
                        <option value="pending" data-i18n="status_pending">Garaşýan</option>
                        <option value="invalid" data-i18n="status_invalid">Nädogry</option>
                        <option value="manual" data-i18n="status_manual">El bilen</option>
                    </select>
                    <button class="btn btn-primary" id="uploadDocBtn" data-i18n="upload_doc">+ Ýüklemek</button>
                </div>
                <div class="docs-grid" id="docsGrid"></div>
            </div>

            <!-- ============================================ -->
            <!-- ВКЛАДКА ПРОВЕРКА -->
            <div class="tab-content" id="tab-verify">
                <div class="upload-area" id="verifyUploadArea">
                    <div class="icon">📤</div>
                    <p data-i18n="upload_hint">Faýly bu ýere süýşüriň ýa-da basyň (PDF, JPG, PNG, DOC)</p>
                    <input type="file" id="verifyFileInput" accept=".pdf,.jpg,.png,.jpeg,.doc,.docx" />
                </div>
                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:12px;">
                    <button class="btn btn-primary" id="verifyBtn" data-i18n="start_verify">Barlamak</button>
                    <button class="btn btn-outline" id="clearVerifyBtn" data-i18n="clear">Arassala</button>
                </div>
                <div class="verification-result" id="verificationResult">
                    <h4 data-i18n="verify_result">Barlag netijesi</h4>
                    <div class="row"><span class="label" data-i18n="doc_name">Resmiýet ady</span><span class="value" id="vDocName">-</span></div>
                    <div class="row"><span class="label" data-i18n="doc_type">Görnüşi</span><span class="value" id="vDocType">-</span></div>
                    <div class="row"><span class="label" data-i18n="doc_series">Seriýa</span><span class="value" id="vDocSeries">-</span></div>
                    <div class="row"><span class="label" data-i18n="doc_number">Nomär</span><span class="value" id="vDocNumber">-</span></div>
                    <div class="row"><span class="label" data-i18n="doc_authority">Berjiň</span><span class="value" id="vDocAuthority">-</span></div>
                    <div class="row"><span class="label" data-i18n="doc_issue_date">Beriş senesi</span><span class="value" id="vDocIssue">-</span></div>
                    <div class="row"><span class="label" data-i18n="doc_expiry_date">Güýji gutarýar</span><span class="value" id="vDocExpiry">-</span></div>
                    <div class="row"><span class="label" data-i18n="doc_status">Status</span><span class="value" id="vDocStatus">-</span></div>
                </div>
            </div>

            <!-- ============================================ -->
            <!-- ВКЛАДКА ПОДПИСАНИЕ -->
            <div class="tab-content" id="tab-sign">
                <div class="sign-form">
                    <form id="signForm">
                        <div class="form-group">
                            <label for="signDoc" data-i18n="select_doc">Resmiýet saýla</label>
                            <select id="signDoc" required></select>
                        </div>
                        <div class="form-group">
                            <label for="signType" data-i18n="sign_type">Gol çekmegiň görnüşi</label>
                            <select id="signType">
                                <option value="simple" data-i18n="simple_sign">Ýönekeý</option>
                                <option value="e-signature" data-i18n="esign_sign">Elektron sanly gol</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="signComment" data-i18n="comment">Düşündiriş</label>
                            <textarea id="signComment" placeholder="..."></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-success" id="signBtn" data-i18n="sign_doc">Gol çek</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- ============================================ -->
            <!-- ВКЛАДКА ОТЧЁТЫ -->
            <div class="tab-content" id="tab-reports">
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="number" style="color:#00d4ff;" id="totalDocs">0</div>
                        <div class="label" data-i18n="total_docs">Jemi dokumentler</div>
                    </div>
                    <div class="stat-item">
                        <div class="number" style="color:#00ffa3;" id="verifiedDocs">0</div>
                        <div class="label" data-i18n="verified_docs">Tassyklandy</div>
                    </div>
                    <div class="stat-item">
                        <div class="number" style="color:#ffc107;" id="pendingDocs">0</div>
                        <div class="label" data-i18n="pending_docs">Garaşýan</div>
                    </div>
                    <div class="stat-item">
                        <div class="number" style="color:#ff6b6b;" id="invalidDocs">0</div>
                        <div class="label" data-i18n="invalid_docs">Nädogry</div>
                    </div>
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:20px; align-items:center;">
                    <div style="flex:1; min-width:200px;">
                        <div class="chart-container">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                    <div style="flex:1; min-width:200px;">
                        <h4 data-i18n="recent_activity">Iň soňky işjeňlik</h4>
                        <ul id="recentActivity" style="list-style:none; padding:0; margin:0;"></ul>
                    </div>
                </div>
                <div style="margin-top:20px;">
                    <button class="btn btn-outline" id="exportReportBtn" data-i18n="export_report">📊 Hasabat göçürip al (PDF)</button>
                </div>
            </div>

        </div>
    </section>

                status_verified: "Tassyklandy",

            en: {

                upload_hint: "Drag & drop or click to select file (PDF, JPG, PNG, DOC)",
                start_verify: "Verify",
                clear: "Clear",

                doc_name: "Document name",

                doc_issue_date: "Issue date",

                recent_activity: "Recent activity",
                export_report: "📊 Export report (PDF)",
                status_verified: "Verified",
                status_pending: "Pending",
                status_invalid: "Invalid",
                status_manual: "Manual check required",
                search_placeholder: "Search...",
                filter_status: "Status:",
                all_status: "All statuses",
                delete_confirm: "Are you sure you want to delete this document?",
                doc_deleted: "Document deleted.",
                no_docs: "No documents",
                sign_success: "Document signed!",
                verify_success: "Verification complete!"
            }
        };

        // ============================================================
        // УСТАНОВКА ЯЗЫКА
        // ============================================================
        let currentLang = localStorage.getItem('lang') || 'ru';

        function setLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    if (el.tagName === 'INPUT' && el.getAttribute('placeholder')) {
                        el.placeholder = translations[lang][key];
                    } else if (el.tagName === 'SELECT' && el.querySelectorAll('option').length) {
                        // обновим опции отдельно
                    } else {
                        el.textContent = translations[lang][key];
                    }
                }
            });
            // Обновляем опции select
            document.querySelectorAll('select option[data-i18n]').forEach(opt => {
                const key = opt.getAttribute('data-i18n');
                if (translations[lang][key]) opt.textContent = translations[lang][key];
            });
            document.getElementById('langBtn').textContent = lang.toUpperCase();
            localStorage.setItem('lang', lang);
            updateUI();
        }

        function updateUI() {
            // Обновляем вкладки
            document.querySelectorAll('.doc-tabs button').forEach(btn => {
                const key = btn.dataset.i18n;
                if (translations[currentLang][key]) btn.textContent = translations[currentLang][key];
            });
            // Перерисовать всё
            renderDocuments();
            updateStats();
            renderActivity();
            populateSignSelect();
            renderChart();
        }

        document.getElementById('langBtn').addEventListener('click', function() {
            const cycle = ['ru', 'tm', 'en'];
            let idx = cycle.indexOf(currentLang);
            idx = (idx + 1) % cycle.length;
            setLanguage(cycle[idx]);
        });

        // ============================================================
        // АВТОРИЗАЦИЯ И НАВИГАЦИЯ
        // ============================================================
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        const user = JSON.parse(localStorage.getItem('user') || '{"username":"User","role":"user"}');
        document.getElementById('username').textContent = user.username || 'User';

        const backLink = document.getElementById('backLink');
        if (user.role === 'admin') {
            backLink.href = 'admin-dashboard.html';
        } else {
            backLink.href = 'user-dashboard.html';
        }

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });

        // ============================================================
        // ДАННЫЕ (localStorage)
        // ============================================================
        const DOCS_KEY = 'documents_docs';
        const ACTIVITY_KEY = 'documents_activity';

        let documents = [];
        let recentActivity = [];

        function loadData() {
            const storedDocs = localStorage.getItem(DOCS_KEY);
            if (storedDocs) {
                try { documents = JSON.parse(storedDocs); } catch(e) { documents = []; }
            }
            if (!documents || documents.length === 0) {
                documents = [
                    { id: 'd1', name: 'Pasport', type: 'Şahsyýet', status: 'verified', issueDate: '2020-05-12', expiryDate: '2030-05-12', icon: '🪪', series: 'AA', number: '1234567', authority: 'MIA' },
                    { id: 'd2', name: 'Sürüjilik şahadatnamasy', type: 'Sürüjilik', status: 'pending', issueDate: '2021-03-01', expiryDate: '2026-03-01', icon: '🚗', series: 'BB', number: '7654321', authority: 'GAI' },
                    { id: 'd3', name: 'Diplom', type: 'Bilim', status: 'manual', issueDate: '2019-06-20', expiryDate: '—', icon: '🎓', series: 'CC', number: '9876543', authority: 'Education Min' },
                    { id: 'd4', name: 'Welaýat şahadatnamasy', type: 'Başga', status: 'invalid', issueDate: '2022-01-15', expiryDate: '2027-01-15', icon: '📄', series: 'DD', number: '3456789', authority: 'Local Admin' }
                ];
                saveDocs();
            }

            const storedActivity = localStorage.getItem(ACTIVITY_KEY);
            if (storedActivity) {
                try { recentActivity = JSON.parse(storedActivity); } catch(e) { recentActivity = []; }
            }
            if (!recentActivity || recentActivity.length === 0) {
                recentActivity = [
                    { text: 'Pasport tassyklandy', date: new Date(Date.now() - 3600000 * 2).toISOString() },
                    { text: 'Sürüjilik şahadatnamasy iberildi', date: new Date(Date.now() - 3600000 * 5).toISOString() },
                    { text: 'Diplom el bilen barlaga iberildi', date: new Date(Date.now() - 3600000 * 24).toISOString() }
                ];
                saveActivity();
            }
        }

        function saveDocs() {
            localStorage.setItem(DOCS_KEY, JSON.stringify(documents));
        }

        function saveActivity() {
            localStorage.setItem(ACTIVITY_KEY, JSON.stringify(recentActivity));
        }

        // ============================================================
        // ОТОБРАЖЕНИЕ ДОКУМЕНТОВ (с фильтрацией и поиском)
        // ============================================================
        function renderDocuments() {
            const container = document.getElementById('docsGrid');
            const search = document.getElementById('docSearch').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            let filtered = documents;
            if (search) filtered = filtered.filter(d => d.name.toLowerCase().includes(search) || d.type.toLowerCase().includes(search));
            if (statusFilter !== 'all') filtered = filtered.filter(d => d.status === statusFilter);

            if (!filtered.length) {
                container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p data-i18n="no_docs">Dokument ýok</p></div>`;
                return;
            }
            const lang = currentLang;
            const statusMap = {
                verified: translations[lang].status_verified || 'Tassyklandy',
                pending: translations[lang].status_pending || 'Garaşýan',
                invalid: translations[lang].status_invalid || 'Nädogry',
                manual: translations[lang].status_manual || 'El bilen barlag'
            };
            container.innerHTML = filtered.map(d => `
                <div class="doc-item" data-id="${d.id}">
                    <div class="doc-icon">${d.icon || '📄'}</div>
                    <div class="doc-name">${d.name}</div>
                    <div class="doc-type">${d.type}</div>
                    <span class="doc-status status-${d.status}">${statusMap[d.status] || d.status}</span>
                    <button class="delete-btn" data-id="${d.id}" data-i18n="delete_btn">✕</button>
                </div>
            `).join('');

            // Обработчики удаления
            container.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    if (confirm(translations[currentLang].delete_confirm)) {
                        deleteDocument(id);
                    }
                });
            });
        }

        function deleteDocument(id) {
            documents = documents.filter(d => d.id !== id);
            saveDocs();
            recentActivity.unshift({ text: translations[currentLang].doc_deleted, date: new Date().toISOString() });
            saveActivity();
            renderDocuments();
            updateStats();
            renderActivity();
            populateSignSelect();
            renderChart();
            showToast(translations[currentLang].doc_deleted, 'info');
        }

        // Обработчики поиска и фильтра
        document.getElementById('docSearch').addEventListener('input', renderDocuments);
        document.getElementById('statusFilter').addEventListener('change', renderDocuments);

        // ============================================================
        // СТАТИСТИКА
        // ============================================================
        function updateStats() {
            const total = documents.length;
            const verified = documents.filter(d => d.status === 'verified').length;
            const pending = documents.filter(d => d.status === 'pending' || d.status === 'manual').length;
            const invalid = documents.filter(d => d.status === 'invalid').length;
            document.getElementById('totalDocs').textContent = total;
            document.getElementById('verifiedDocs').textContent = verified;
            document.getElementById('pendingDocs').textContent = pending;
            document.getElementById('invalidDocs').textContent = invalid;
        }

        // ============================================================
        // АКТИВНОСТЬ
        // ============================================================
        function renderActivity() {
            const container = document.getElementById('recentActivity');
            if (!recentActivity.length) {
                container.innerHTML = '<div class="empty-state"><p>Hiç hili işjeňlik ýok</p></div>';
                return;
            }
            const sorted = [...recentActivity].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
            container.innerHTML = sorted.map(a => `
                <li style="padding:8px 0; border-bottom:1px solid rgba(255,255,255,.04); display:flex; justify-content:space-between;">
                    <span>${a.text}</span>
                    <span style="color:#9fb5c8; font-size:12px;">${new Date(a.date).toLocaleString()}</span>
                </li>
            `).join('');
        }

        // ============================================================
        // КРУГОВАЯ ДИАГРАММА
        // ============================================================
        let chart = null;

        function renderChart() {
            const ctx = document.getElementById('statusChart').getContext('2d');
            if (chart) chart.destroy();
            const verified = documents.filter(d => d.status === 'verified').length;
            const pending = documents.filter(d => d.status === 'pending' || d.status === 'manual').length;
            const invalid = documents.filter(d => d.status === 'invalid').length;
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: [
                        translations[currentLang].status_verified || 'Tassyklandy',
                        translations[currentLang].status_pending || 'Garaşýan',
                        translations[currentLang].status_invalid || 'Nädogry'
                    ],
                    datasets: [{
                        data: [verified, pending, invalid],
                        backgroundColor: ['#00ffa3', '#ffc107', '#ff6b6b'],
                        borderColor: 'transparent'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { labels: { color: '#bdd0df' } }
                    }
                }
            });
        }

        // ============================================================
        // ЗАГРУЗКА ДОКУМЕНТА ДЛЯ ПРОВЕРКИ
        // ============================================================
        const verifyUploadArea = document.getElementById('verifyUploadArea');
        const verifyFileInput = document.getElementById('verifyFileInput');
        let selectedVerifyFile = null;

        verifyUploadArea.addEventListener('click', () => verifyFileInput.click());
        verifyUploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            verifyUploadArea.style.borderColor = '#00d4ff';
        });
        verifyUploadArea.addEventListener('dragleave', () => {
            verifyUploadArea.style.borderColor = 'rgba(255,255,255,.2)';
        });
        verifyUploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            verifyUploadArea.style.borderColor = 'rgba(255,255,255,.2)';
            if (e.dataTransfer.files.length) {
                verifyFileInput.files = e.dataTransfer.files;
                handleVerifyFile(e.dataTransfer.files[0]);
            }
        });
        verifyFileInput.addEventListener('change', function() {
            if (this.files.length) handleVerifyFile(this.files[0]);
        });

        function handleVerifyFile(file) {
            selectedVerifyFile = file;
            verifyUploadArea.querySelector('p').textContent = file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
            document.getElementById('verificationResult').classList.remove('active');
        }

        document.getElementById('clearVerifyBtn').addEventListener('click', function() {
            selectedVerifyFile = null;
            verifyFileInput.value = '';
            verifyUploadArea.querySelector('p').textContent = translations[currentLang].upload_hint;
            document.getElementById('verificationResult').classList.remove('active');
        });

        // ============================================================
        // ЗАПУСК ПРОВЕРКИ (имитация)
        // ============================================================
        document.getElementById('verifyBtn').addEventListener('click', function() {
            if (!selectedVerifyFile) {
                showToast(translations[currentLang].upload_hint, 'error');
                return;
            }
            const resultDiv = document.getElementById('verificationResult');
            resultDiv.classList.add('active');

            // Случайные данные для имитации
            const statuses = ['verified', 'pending', 'invalid', 'manual'];
            const status = statuses[Math.floor(Math.random() * statuses.length)];
            const statusMap = {
                verified: translations[currentLang].status_verified,
                pending: translations[currentLang].status_pending,
                invalid: translations[currentLang].status_invalid,
                manual: translations[currentLang].status_manual
            };
            const issue = new Date(Date.now() - Math.random() * 365 * 24 * 3600000 * 5).toISOString().slice(0,10);
            const expiry = new Date(Date.now() + Math.random() * 365 * 24 * 3600000 * 5).toISOString().slice(0,10);
            const series = 'XX' + Math.floor(10 + Math.random() * 90);
            const number = Math.floor(100000 + Math.random() * 900000).toString();
            const authorities = ['MIA', 'GAI', 'Education Min', 'Local Admin', 'Health Min', 'Economy Min'];
            const authority = authorities[Math.floor(Math.random() * authorities.length)];

            document.getElementById('vDocName').textContent = selectedVerifyFile.name;
            document.getElementById('vDocType').textContent = selectedVerifyFile.type || 'PDF';
            document.getElementById('vDocSeries').textContent = series;
            document.getElementById('vDocNumber').textContent = number;
            document.getElementById('vDocAuthority').textContent = authority;
            document.getElementById('vDocIssue').textContent = issue;
            document.getElementById('vDocExpiry').textContent = status === 'invalid' ? '—' : expiry;
            document.getElementById('vDocStatus').textContent = statusMap[status] || status;

            // Добавляем в хранилище, если статус не invalid
            if (status !== 'invalid') {
                const icon = status === 'verified' ? '✅' : '⏳';
                documents.push({
                    id: 'd' + Date.now(),
                    name: selectedVerifyFile.name,
                    type: selectedVerifyFile.type || 'PDF',
                    status: status,
                    issueDate: issue,
                    expiryDate: status === 'invalid' ? '—' : expiry,
                    icon: icon,
                    series: series,
                    number: number,
                    authority: authority
                });
                saveDocs();
                const msg = status === 'verified' ? translations[currentLang].verify_success : translations[currentLang].status_pending;
                recentActivity.unshift({ text: `${selectedVerifyFile.name} — ${msg}`, date: new Date().toISOString() });
                saveActivity();
            } else {
                recentActivity.unshift({ text: `${selectedVerifyFile.name} — ${translations[currentLang].status_invalid}`, date: new Date().toISOString() });
                saveActivity();
            }
            renderDocuments();
            updateStats();
            renderActivity();
            populateSignSelect();
            renderChart();
            showToast(translations[currentLang].verify_success, 'success');
        });

        // ============================================================
        // ПОДПИСАНИЕ ДОКУМЕНТОВ
        // ============================================================
        function populateSignSelect() {
            const select = document.getElementById('signDoc');
            const verifiedDocs = documents.filter(d => d.status === 'verified');
            select.innerHTML = verifiedDocs.length ? verifiedDocs.map(d => `<option value="${d.id}">${d.name}</option>`).join('') :
                `<option value="">${translations[currentLang].no_docs || 'Dokument ýok'}</option>`;
        }

        document.getElementById('signForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const docId = document.getElementById('signDoc').value;
            const signType = document.getElementById('signType').value;
            const comment = document.getElementById('signComment').value.trim();
            if (!docId) {
                showToast(translations[currentLang].select_doc, 'error');
                return;
            }
            const doc = documents.find(d => d.id === docId);
            if (!doc) return;
            recentActivity.unshift({
                text: `${doc.name} ${translations[currentLang].sign_doc} (${signType === 'simple' ? translations[currentLang].simple_sign : translations[currentLang].esign_sign})`,
                date: new Date().toISOString()
            });
            saveActivity();
            renderActivity();
            showToast(translations[currentLang].sign_success, 'success');
            this.reset();
            populateSignSelect();
        });

        // ============================================================
        // ЗАГРУЗКА ДОКУМЕНТА В ХРАНИЛИЩЕ
        // ============================================================
        document.getElementById('uploadDocBtn').addEventListener('click', function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.pdf,.jpg,.png,.jpeg,.doc,.docx';
            input.onchange = function() {
                if (this.files.length) {
                    const file = this.files[0];
                    documents.push({
                        id: 'd' + Date.now(),
                        name: file.name,
                        type: file.type || 'PDF',
                        status: 'pending',
                        issueDate: new Date().toISOString().slice(0,10),
                        expiryDate: '—',
                        icon: '📄',
                        series: '—',
                        number: '—',
                        authority: '—'
                    });
                    saveDocs();
                    recentActivity.unshift({ text: `${file.name} ${translations[currentLang].upload_doc}`, date: new Date().toISOString() });
                    saveActivity();
                    renderDocuments();
                    updateStats();
                    renderActivity();
                    populateSignSelect();
                    renderChart();
                    showToast('Resmiýet ýüklendi!', 'success');
                }
            };
            input.click();
        });

        // ============================================================
        // ЭКСПОРТ ОТЧЁТА (заглушка)
        // ============================================================
        document.getElementById('exportReportBtn').addEventListener('click', function() {
            showToast('📊 Hasabat göçürilýär... (PDF) — imitasiýa', 'info');
        });

        // ============================================================
        // ОБНОВЛЕНИЕ (кнопка refresh)
        // ============================================================
        document.getElementById('refreshBtn').addEventListener('click', function() {
            renderDocuments();
            updateStats();
            renderActivity();
            populateSignSelect();
            renderChart();
            showToast('Täzelendi!', 'success');
        });

        // ============================================================
        // УВЕДОМЛЕНИЯ (TOAST)
        // ============================================================
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // ============================================================
        // ЧАСТИЦЫ
        // ============================================================
        const particles = document.getElementById('particles');
        if (particles && particles.children.length === 0) {
            for (let i = 0; i < 60; i++) {
                const p = document.createElement('span');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDuration = (6 + Math.random() * 12) + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                particles.appendChild(p);
            }
        }

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        loadData();
        setLanguage(currentLang);
        renderDocuments();
        updateStats();
        renderActivity();
        populateSignSelect();
        renderChart();
        console.log('✅ Documents module with chart, filters, delete and storage loaded');
    </script>
</body>
</html>
