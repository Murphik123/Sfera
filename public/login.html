<!DOCTYPE html>
<html lang="tm">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SFERA — Giriş</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />

    <style>
        /* ===== ОРИГИНАЛЬНЫЕ СТИЛИ (без изменений) ===== */
        .hint-box {
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(255,255,255,0.1);
            padding: var(--space-3);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: var(--space-4);
            line-height: 1.6;
        }
        .toggle-password {
            position: absolute;
            right: var(--space-3);
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            opacity: 0.6;
            transition: opacity var(--transition);
            font-size: 1.2rem;
            user-select: none;
        }
        .toggle-password:hover {
            opacity: 1;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap .input {
            padding-right: 44px;
        }
    </style>
</head>
<body class="auth-page">
    <!-- ===== ЧАСТИЦЫ (ОРИГИНАЛ) ===== -->
    <div id="particles"></div>

    <div class="lang-switch-top">
        <button class="lang-btn" id="langBtn">TM</button>
    </div>

    <!-- ===== СТЕКЛЯННАЯ КАРТОЧКА (ОРИГИНАЛ) ===== -->
    <div class="auth-container">
        <div class="auth-header">
            <!-- ОРИГИНАЛЬНЫЙ ЛОГОТИП -->
            <a href="/" class="logo-sfera" style="justify-content:center;">
                <div class="logo-icon">
                    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00ffa3"/>
                                <stop offset="50%" stop-color="#00d4ff"/>
                                <stop offset="100%" stop-color="#1f6bff"/>
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="28" fill="url(#logoGrad)" opacity="0.15"/>
                        <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" stroke="url(#logoGrad)" stroke-width="3"/>
                        <circle cx="48" cy="48" r="3.5" fill="#ffffff"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <h2>SFERA</h2>
                    <p style="display:none;">Milli Platforma</p>
                </div>
            </a>
            <h1 class="auth-title" data-i18n="login_title">Giriş</h1>
            <p class="auth-subtitle" data-i18n="login_subtitle">Platforma girmek üçin hasabyňyzy ulanyň</p>
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label data-i18n="login_email_label">Email adres</label>
                <div class="input-wrap">
                    <input type="email" id="email" class="input" placeholder="admin@dtm.tm" required />
                </div>
            </div>
            <div class="form-group">
                <label data-i18n="login_password_label">Parol</label>
                <div class="input-wrap">
                    <input type="password" id="password" class="input" value="99363645817" required />
                    <span class="toggle-password" id="togglePassword">👁️</span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn" data-i18n="login_button" style="width:100%;">Girmek</button>
        </form>

        <div class="hint-box">
            🔑 <strong>Админ доступ:</strong> admin@dtm.tm / 99363645817<br />
            💡 Или войдите под любым созданным аккаунтом.
        </div>

        <div class="auth-footer">
            <span data-i18n="login_no_account">Hasabyňyz ýokmy?</span>
            <a href="/register.html" data-i18n="login_register_link">Hasap dörediň</a>
        </div>
    </div>

    <!-- ===== СКРИПТЫ (ЧАСТИЦЫ + API) ===== -->
    <script src="/js/particles.js"></script>
    <script type="module">
        import { authApi } from '/js/api.js';
        import { initI18n, cycleLanguage } from '/js/i18n.js';

        // ЛОКАЛИЗАЦИЯ
        await initI18n();
        document.getElementById('langBtn')?.addEventListener('click', cycleLanguage);

        // ЛОГИКА ВХОДА (через API)
        const form = document.getElementById('loginForm');
        const messageEl = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                showMessage('Nädogry email ýa-da parol', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Girilýär...';

            try {
                const data = await authApi.login(email, password);
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                showMessage('Giriş başaryldy!', 'success');
                setTimeout(() => {
                    const role = data.user.role;
                    window.location.href = (role === 'admin') ? '/admin.html' : '/user-dashboard.html';
                }, 800);
            } catch (error) {
                showMessage(error.message || 'Nädogry email ýa-da parol', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Girmek';
            }
        });

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            messageEl.style.display = 'block';
            setTimeout(() => { messageEl.style.display = 'none'; }, 4000);
        }

        document.getElementById('togglePassword').addEventListener('click', function() {
            const p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
            this.textContent = p.type === 'password' ? '👁️' : '🙈';
        });
    </script>
</body>
</html>
