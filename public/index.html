<!DOCTYPE html>
<html lang="tm">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFERA - Вход</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #060913;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Частицы заднего фона */
        #particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.4);
            animation: float 8s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Фоновые неоновые пятна */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            z-index: 1;
            pointer-events: none;
        }

        .glow-1 {
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, #00ffa3, #00d4ff);
        }

        .glow-2 {
            bottom: -10%;
            right: -10%;
            background: radial-gradient(circle, #1f6bff, #7928ca);
        }

        /* Стекловидная карточка (Glassmorphism) */
        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: rgba(13, 19, 33, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            margin: 20px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-wrap {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            color: inherit;
            margin-bottom: 24px;
            cursor: pointer;
            user-select: none;
        }

        /* CSS Спиральная воронка в 3D */
        .funnel-container {
            width: 50px;
            height: 50px;
            position: relative;
            perspective: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .funnel-stage {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(70deg) rotateY(-10deg);
            animation: spinFunnel 4s linear infinite;
        }

        @keyframes spinFunnel {
            0% { transform: rotateX(70deg) rotateY(-10deg) rotateZ(0deg); }
            100% { transform: rotateX(70deg) rotateY(-10deg) rotateZ(360deg); }
        }

        /* Витки воронки */
        .funnel-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            border: 2px dashed #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            transform-style: preserve-3d;
        }

        .ring-1 {
            width: 48px;
            height: 48px;
            margin-top: -24px;
            margin-left: -24px;
            transform: translateZ(24px);
            border-color: #00ffa3;
            box-shadow: 0 0 12px rgba(0, 255, 163, 0.6);
        }

        .ring-2 {
            width: 36px;
            height: 36px;
            margin-top: -18px;
            margin-left: -18px;
            transform: translateZ(14px);
            border-color: #00d4ff;
        }

        .ring-3 {
            width: 24px;
            height: 24px;
            margin-top: -12px;
            margin-left: -12px;
            transform: translateZ(4px);
            border-color: #1f6bff;
        }

        .ring-4 {
            width: 12px;
            height: 12px;
            margin-top: -6px;
            margin-left: -6px;
            transform: translateZ(-6px);
            border-color: #7928ca;
        }

        /* Центральная нижняя точка воронки */
        .funnel-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            margin-top: -2.5px;
            margin-left: -2.5px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff, 0 0 20px #00ffa3;
            transform: translateZ(-16px);
        }

        .logo-text {
            text-align: left;
        }

        .logo-text h2 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00ffa3, #00d4ff, #1f6bff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .auth-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Элементы формы */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
        }

        .input-wrap {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.25);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .toggle-password:hover {
            opacity: 1;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff, #1f6bff);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 212, 255, 0.5);
        }

        .hint-box {
            margin-top: 24px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .auth-footer a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 500;
            margin-left: 5px;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .message.error {
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid rgba(255, 77, 77, 0.3);
            color: #ff6b6b;
            display: block;
        }
    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div id="particles"></div>

    <div class="auth-container">
        <div class="auth-header">
            <a href="#" class="logo-wrap" id="langToggle">
                <!-- Воронка-спираль вместо плоского круга -->
                <div class="funnel-container">
                    <div class="funnel-stage">
                        <div class="funnel-ring ring-1"></div>
                        <div class="funnel-ring ring-2"></div>
                        <div class="funnel-ring ring-3"></div>
                        <div class="funnel-ring ring-4"></div>
                        <div class="funnel-tip"></div>
                    </div>
                </div>
                <div class="logo-text">
                    <h2>SFERA</h2>
                    <p id="logoSubtitle">Milli Sanly Platforma</p>
                </div>
            </a>
            <h1 class="auth-title" data-i18n="title">Вход</h1>
            <p class="auth-subtitle" data-i18n="subtitle">Войдите в свою учётную запись</p>
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email" data-i18n="email">Email</label>
                <div class="input-wrap">
                    <input type="email" id="email" class="form-input" placeholder="admin@dtm.tm" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password" data-i18n="password">Пароль</label>
                <div class="input-wrap">
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    <span class="toggle-password" id="togglePassword">👁️</span>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="loginBtn" data-i18n="button">Войти</button>
        </form>

        <div class="hint-box">
            🔑 <strong>Админ:</strong> admin@dtm.tm / 99363645817<br>
            👤 <strong>Пользователь:</strong> (любой email) / 99363645817
        </div>

        <div class="auth-footer">
            <span data-i18n="no_account">Нет аккаунта?</span>
            <a href="register.html" data-i18n="register">Зарегистрироваться</a>
        </div>
    </div>

    <script>
        // Генерация фоновых частиц
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.width = Math.random() * 4 + 2 + 'px';
            p.style.height = p.style.width;
            p.style.animationDelay = Math.random() * 8 + 's';
            p.style.animationDuration = Math.random() * 5 + 5 + 's';
            particlesContainer.appendChild(p);
        }

        // Логика переключения видимости пароля
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        });

        // Переключатель языков по клику на логотип
        const langs = ['ru', 'tm', 'en'];
        let currentLangIdx = 0;

        const translations = {
            ru: {
                title: 'Вход',
                subtitle: 'Войдите в свою учётную запись',
                email: 'Email',
                password: 'Пароль',
                button: 'Войти',
                no_account: 'Нет аккаунта?',
                register: 'Зарегистрироваться',
                subtitle_logo: 'Milli Sanly Platforma'
            },
            tm: {
                title: 'Giriş',
                subtitle: 'Hesabyňyza giriň',
                email: 'E-poçta',
                password: 'Aşarsöz',
                button: 'Girmek',
                no_account: 'Hesabyňyz ýokmy?',
                register: 'Ýazylmak',
                subtitle_logo: 'Milli Sanly Platforma'
            },
            en: {
                title: 'Sign In',
                subtitle: 'Sign in to your account',
                email: 'Email',
                password: 'Password',
                button: 'Sign In',
                no_account: "Don't have an account?",
                register: 'Register',
                subtitle_logo: 'National Digital Platform'
            }
        };

        document.getElementById('langToggle').addEventListener('click', (e) => {
            e.preventDefault();
            currentLangIdx = (currentLangIdx + 1) % langs.length;
            const lang = langs[currentLangIdx];
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            document.getElementById('logoSubtitle').textContent = translations[lang].subtitle_logo;
        });
    </script>
</body>
</html>
