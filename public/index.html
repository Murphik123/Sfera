<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFERA — Цифровая Платформа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Главный контейнер мессенджера -->
    <div id="messengerContainer" class="messenger-container">
        <!-- Боковая панель (Список чатов) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Чаты</h2>
            </div>
            <div id="usersList" class="users-list">
                <!-- Список пользователей загружается динамически -->
            </div>
        </aside>

        <!-- Основная область чата -->
        <main class="chat-area">
            <div id="chatHeader" class="chat-header">
                <span id="chatTitle">Выберите чат</span>
                <div class="chat-actions">
                    <button id="audioCallBtn" class="btn-icon" style="display:none;">📞</button>
                    <button id="videoCallBtn" class="btn-icon" style="display:none;">📹</button>
                </div>
            </div>

            <div id="messagesContainer" class="messages-container">
                <!-- Сообщения -->
            </div>

            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Напишите сообщение..." disabled>
                <button id="sendBtn" class="btn-send" disabled>Отправить</button>
            </div>
        </main>
    </div>

    <!-- Модальное окно звонка (WebRTC UI) -->
    <div id="callModal" class="call-modal" style="display: none;">
        <div class="call-content">
            <h3 id="callStatusText">Звонок...</h3>
            <div class="video-container">
                <video id="localVideo" autoplay playsinline muted></video>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
            <div class="call-actions">
                <button id="acceptCallBtn" class="btn-call-accept" style="display: none;">Ответить</button>
                <button id="rejectCallBtn" class="btn-call-reject">Сбросить</button>
            </div>
        </div>
    </div>

    <!-- 1. Библиотека Socket.io (Перед скриптом) -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- 2. Главный клиентский скрипт -->
    <script src="script.js"></script>
</body>
</html>
