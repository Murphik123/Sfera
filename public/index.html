<!DOCTYPE html>
<html lang="tm">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFERA - Milli Sanly Platforma</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #060913;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Частицы заднего фона */
        #particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.4);
            animation: float 8s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Фоновые неоновые пятна */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            z-index: 1;
            pointer-events: none;
        }

        .glow-1 {
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, #00ffa3, #00d4ff);
        }

        .glow-2 {
            bottom: -10%;
            right: -10%;
            background: radial-gradient(circle, #1f6bff, #7928ca);
        }

        /* Тот самый оригинальный стекловидный контейнер */
        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: rgba(13, 19, 33, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            margin: 20px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-wrap {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
            margin-bottom: 20px;
            cursor: pointer;
            user-select: none;
        }

        .logo-svg {
            width: 44px;
            height: 44px;
        }

        .logo-text {
            text-align: left;
        }

        .logo-text h2 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00ffa3, #00d4ff, #1f6bff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Навигационные ссылки в стиле оригинальных кнопок формы */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .menu-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .menu-link:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.25);
            transform: translateY(-2px);
        }

        .menu-link .arrow {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            transition: color 0.3s, transform 0.3s;
        }

        .menu-link:hover .arrow {
            color: #00d4ff;
            transform: translateX(3px);
        }

        /* Главная кнопка Входа */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff, #1f6bff);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 212, 255, 0.5);
        }

        .auth-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .auth-footer a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 500;
            margin-left: 5px;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div id="particles"></div>

    <div class="auth-container">
        <!-- Обычная шапка с вашим SVG-логотипом -->
        <div class="auth-header">
            <a href="index.html" class="logo-wrap" id="langToggle">
                <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00ffa3" />
                            <stop offset="50%" stop-color="#00d4ff" />
                            <stop offset="100%" stop-color="#1f6bff" />
                        </linearGradient>
                        <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur stdDeviation="4" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <circle cx="50" cy="50" r="28" fill="url(#logoGrad)" opacity="0.15" filter="url(#logoGlow)" />
                    <g filter="url(#logoGlow)">
                        <circle cx="50" cy="50" r="40" stroke="url(#logoGrad)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.4" />
                        <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6" />
                        <circle cx="48" cy="48" r="3.5" fill="#ffffff" filter="url(#logoGlow)" />
                    </g>
                </svg>
                <div class="logo-text">
                    <h2>SFERA</h2>
                    <p id="logoSubtitle">Milli Sanly Platforma</p>
                </div>
            </a>
            <h1 class="auth-title" id="pageTitle">SFERA</h1>
            <p class="auth-subtitle" id="pageSubtitle">Единая цифровая платформа</p>
        </div>

        <!-- Навигационные модули внутри карточки -->
        <div class="menu-list">
            <a href="marketplace.html" class="menu-link">
                <span>🛒 Marketplace</span>
                <span class="arrow">➔</span>
            </a>
            <a href="exchange.html" class="menu-link">
                <span>💱 Exchange</span>
                <span class="arrow">➔</span>
            </a>
            <a href="bank.html" class="menu-link">
                <span>🏦 Bank</span>
                <span class="arrow">➔</span>
            </a>
            <a href="docs.html" class="menu-link">
                <span>📄 Docs</span>
                <span class="arrow">➔</span>
            </a>
            <a href="messenger.html" class="menu-link">
                <span>💬 Messenger</span>
                <span class="arrow">➔</span>
            </a>
        </div>

        <!-- Кнопка перехода на авторизацию -->
        <a href="login.html" class="btn-submit">Войти в систему</a>

        <div class="auth-footer">
            <span>© 2026 SFERA Platform</span>
        </div>
    </div>

    <script>
        // Частицы заднего фона
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.width = Math.random() * 4 + 2 + 'px';
            p.style.height = p.style.width;
            p.style.animationDelay = Math.random() * 8 + 's';
            p.style.animationDuration = Math.random() * 5 + 5 + 's';
            particlesContainer.appendChild(p);
        }
    </script>
</body>
</html>
