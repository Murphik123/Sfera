<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SFERA</title>

  <!-- Design system styles -->
  <link rel="stylesheet" href="/css/_design-vars.css">
  <link rel="stylesheet" href="/css/glass-utils.css">
  <link rel="stylesheet" href="/css/particles.css">
  <link rel="stylesheet" href="/css/sphere.css">

  <!-- Meta for translation management -->
  <meta name="supported-langs" content="tm,ru,en">
  <meta name="default-lang" content="en">

  <!-- Existing app CSS (if any) -->
  <!-- <link rel="stylesheet" href="/css/app.css"> -->
</head>
<body>
  <div id="app" class="spotlight" data-current-lang="en">
    <header class="glass" style="padding:12px 20px; display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:12px;">
        <a href="/" aria-label="SFERA home" style="display:inline-flex; align-items:center; gap:10px; text-decoration:none; color:inherit;">
          <div style="width:40px; height:40px; border-radius:8px; background:linear-gradient(135deg,var(--primary),var(--secondary)); box-shadow:0 6px 18px rgba(0,0,0,0.35);"></div>
          <strong style="font-size:1.05rem;">SFERA</strong>
        </a>
      </div>

      <!-- Language switcher (non-destructive) -->
      <nav id="lang-switch" aria-label="Language switch" style="display:flex; gap:8px;">
        <button class="glass hover-lift" data-lang="tm" aria-pressed="false" title="Türkmençe">TM</button>
        <button class="glass hover-lift" data-lang="ru" aria-pressed="false" title="Русский">RU</button>
        <button class="glass hover-lift" data-lang="en" aria-pressed="true" title="English">EN</button>
      </nav>
    </header>

    <main style="padding:28px; min-height:70vh; position:relative; z-index:2;">
      <section style="display:flex; gap:28px; align-items:center; justify-content:center; flex-wrap:wrap;">
        <div style="max-width:720px;">
          <h1 data-i18n="home.title" style="margin:0 0 12px 0; font-size:2rem;">Добро пожаловать в SFERA</h1>
          <p data-i18n="home.subtitle" style="margin:0 0 18px 0; color:var(--muted);">
            Универсальная платформа. Интерфейс с эффектом glassmorphism и лёгкими анимациями.
          </p>
          <div style="display:flex; gap:12px;">
            <a class="bg-accent glass hover-lift" href="#" data-i18n="home.cta.start" style="padding:10px 16px; border-radius:12px; text-decoration:none;">Начать</a>
            <a class="glass hover-lift" href="#" data-i18n="home.cta.docs" style="padding:10px 16px; border-radius:12px; text-decoration:none;">Документация</a>
          </div>
        </div>

        <!-- Sphere component inline include -->
        <div aria-hidden="true">
          <div class="sphere-wrap glass-strong hover-lift" aria-hidden="true" style="width:360px;height:360px;display:flex;align-items:center;justify-content:center;">
            <svg class="rings" viewBox="-200 -200 400 400" width="320" height="320" preserveAspectRatio="xMidYMid meet" style="position:absolute; inset:0; margin:auto;">
              <defs>
                <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#1f6bff"/></linearGradient>
                <linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#00ffa3"/><stop offset="1" stop-color="#00d4ff"/></linearGradient>
              </defs>
              <g class="rings-group" transform="rotate(0)">
                <circle class="ring ring-1" r="80" stroke="url(#g1)" stroke-width="1.6" fill="none" stroke-dasharray="1 6"></circle>
                <circle class="ring ring-2" r="110" stroke="url(#g2)" stroke-width="1.2" fill="none" stroke-dasharray="1 6"></circle>
              </g>
            </svg>
            <div class="core" style="position:relative; z-index:2; width:var(--core-size); height:var(--core-size); border-radius:50%;"></div>
          </div>
        </div>
      </section>

      <section id="page-content" style="margin-top:28px;">
        <article data-i18n-key="home.intro">
          <h2 data-i18n="home.features.title">Функции</h2>
          <p data-i18n="home.features.desc">Здесь будет краткое описание возможностей платформы.</p>
        </article>
      </section>
    </main>

    <footer class="glass" style="padding:14px 20px; display:flex; justify-content:space-between; align-items:center;">
      <small style="color:var(--muted)">© SFERA — Все права защищены</small>
      <div style="display:flex; gap:10px;">
        <a href="#" class="glass" style="padding:6px 10px; border-radius:8px; text-decoration:none;">Support</a>
        <a href="#" class="glass" style="padding:6px 10px; border-radius:8px; text-decoration:none;">Privacy</a>
      </div>
    </footer>
  </div>

  <!-- Constellation canvas -->
  <canvas id="constellation" style="position:fixed; inset:0; z-index:0; pointer-events:none;"></canvas>

  <!-- Visual assets -->
  <script src="/js/particles-init.js" defer></script>
  <script src="/js/spotlight.js" defer></script>

  <!-- Constellation module -->
  <script type="module" defer>
    import initConstellation from '/js/constellation.js';
    document.addEventListener('DOMContentLoaded', ()=> {
      const c = document.getElementById('constellation');
      if(c) initConstellation(c);
    });

    // Language switcher wiring that emits an event and calls optional global hook.
    (function(){
      try {
        const switcher = document.getElementById('lang-switch');
        if(!switcher) return;
        function setPressed(btn){
          switcher.querySelectorAll('button[data-lang]').forEach(b => b.setAttribute('aria-pressed','false'));
          btn.setAttribute('aria-pressed','true');
        }
        switcher.addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-lang]');
          if(!btn) return;
          const lang = btn.getAttribute('data-lang');
          setPressed(btn);
          // update attribute for other scripts
          document.getElementById('app').setAttribute('data-current-lang', lang);
          // emit event for external i18n loader
          window.dispatchEvent(new CustomEvent('sfera:langchange', { detail: { lang } }));
          // optional synchronous hook for legacy loaders
          if(typeof window.SFERA_onLangChange === 'function'){
            try { window.SFERA_onLangChange(lang); } catch(e){ console.error(e); }
          }
        });
      } catch(e){ console.error('lang switch init error', e); }
    })();
  </script>

  <!-- Placeholder: include your i18n loader here. It should listen to 'sfera:langchange' or implement window.SFERA_onLangChange -->
  <!-- Example: <script src="/js/i18n-loader.js" defer></script> -->

  <!-- Mobile performance hint -->
  <script defer>
    (function(){
      try {
        if(window.matchMedia && window.matchMedia('(max-width: 768px)').matches){
          document.documentElement.style.setProperty('--particle-min-duration', '8s');
          document.documentElement.style.setProperty('--particle-max-duration', '20s');
          // optional flag for particles-init.js
          window.__SFERA_REDUCE_PARTICLES = true;
        }
      } catch(e){}
    })();
  </script>
</body>
</html>
