<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="page_title">СФЕРА — Messenger</title>

    <!-- Подключение общих стилей и эффектов -->
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/glassmorphism.css" />
    <link rel="stylesheet" href="/css/effects.css" />

    <style>
        :root {
            color-scheme: light;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            color: #16304b;
            background:
                radial-gradient(circle at top left, rgba(0,212,255,0.16), transparent 30%),
                radial-gradient(circle at bottom right, rgba(0,255,170,0.14), transparent 24%),
                linear-gradient(135deg, #f7fbff 0%, #edf6ff 44%, #fdfefe 100%);
            overflow-x: hidden;
        }

        #particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #00ffa3);
            opacity: 0.45;
            animation: drift linear infinite;
        }

        @keyframes drift {
            0% { transform: translateY(0); opacity: 0; }
            20% { opacity: 0.65; }
            80% { opacity: 0.65; }
            100% { transform: translateY(-120vh); opacity: 0; }
        }

        .messenger-page {
            padding: 120px 0 60px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .messenger-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 200px);
            min-height: 500px;
            border-radius: 28px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255,255,255,0.78), rgba(234,244,255,0.70));
            border: 1px solid rgba(255,255,255,0.92);
            backdrop-filter: blur(26px) saturate(180%);
            -webkit-backdrop-filter: blur(26px) saturate(180%);
            box-shadow: 0 24px 70px rgba(19, 53, 86, 0.14);
            position: relative;
        }

        .messenger-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.55), rgba(255,255,255,0.18));
            pointer-events: none;
        }

        .messenger-container.light-theme {
            background: linear-gradient(135deg, rgba(255,255,255,0.86), rgba(240,247,255,0.76));
            border-color: rgba(255,255,255,0.95);
        }

        .messenger-sidebar {
            width: 330px;
            min-width: 280px;
            background: rgba(255,255,255,0.56);
            border-right: 1px solid rgba(255,255,255,0.75);
            display: flex;
            flex-direction: column;
            transition: background .25s ease;
            position: relative;
            z-index: 1;
        }

        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(145, 178, 209, 0.22);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .sidebar-header .left-group { display: flex; align-items: center; gap: 10px; }
        .sidebar-header h2 { font-size: 18px; font-weight: 700; color: #17324d; margin: 0; }
        .sidebar-header .theme-toggle {
            background: rgba(255,255,255,0.66);
            border: 1px solid rgba(255,255,255,0.82);
            color: #17324d;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: .2s;
        }

        .sidebar-header .theme-toggle:hover { background: rgba(255,255,255,0.9); }
        .sidebar-header .dropdown-tabs { position: relative; display: inline-block; }
        .sidebar-header .dropdown-tabs .dropbtn {
            background: rgba(255,255,255,0.68);
            border: 1px solid rgba(255,255,255,0.85);
            color: #17324d;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sidebar-header .dropdown-tabs .dropbtn:hover { background: rgba(255,255,255,0.9); }
        .sidebar-header .dropdown-tabs .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 14px;
            min-width: 150px;
            box-shadow: 0 16px 36px rgba(19, 53, 86, 0.12);
            z-index: 100;
            padding: 6px 0;
            margin-top: 6px;
        }
        .sidebar-header .dropdown-tabs .dropdown-content button {
            background: transparent;
            border: none;
            color: #45657d;
            padding: 10px 16px;
            width: 100%;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }
        .sidebar-header .dropdown-tabs .dropdown-content button:hover { background: rgba(255,255,255,0.75); color: #17324d; }
        .sidebar-header .dropdown-tabs .dropdown-content button.active { color: #0b6fe4; background: rgba(0,212,255,.08); }
        .sidebar-header .dropdown-tabs.show .dropdown-content { display: block; }

        .sidebar-search { padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap; }
        .sidebar-search input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 14px;
            border: 1px solid rgba(145, 178, 209, 0.26);
            background: rgba(255,255,255,0.7);
            color: #17324d;
            font-size: 14px;
            outline: none;
            transition: .3s;
            min-width: 120px;
        }
        .sidebar-search input:focus { border-color: #00d4ff; box-shadow: 0 0 0 3px rgba(0,212,255,.12); }
        .sidebar-search input::placeholder { color: #6f869b; }
        .sidebar-search .create-group-btn {
            padding: 10px 16px;
            background: linear-gradient(135deg, rgba(0,212,255,.16), rgba(255,255,255,.8));
            border: 1px solid rgba(0,212,255,.2);
            border-radius: 14px;
            color: #0b6fe4;
            cursor: pointer;
            font-weight: 700;
            transition: .2s;
            white-space: nowrap;
        }
        .sidebar-search .create-group-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(0,212,255,.14); }

        .dialogs-list, .news-feed { flex: 1; overflow-y: auto; padding: 8px 0; }
        .dialog-item { display: flex; align-items: center; padding: 12px 20px; cursor: pointer; transition: .2s; border-left: 3px solid transparent; gap: 12px; }
        .dialog-item:hover { background: rgba(255,255,255,.55); }
        .dialog-item.active { background: rgba(0,212,255,.1); border-left-color: #00d4ff; }
        .dialog-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0,212,255,.2), rgba(255,255,255,.76));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #0b6fe4;
            flex-shrink: 0;
            position: relative;
        }
        .dialog-avatar.group { background: linear-gradient(135deg, rgba(255,200,0,.2), rgba(255,255,255,.76)); color: #ba7b00; }
        .dialog-avatar .online-dot { width: 10px; height: 10px; border-radius: 50%; background: #00ffa3; border: 2px solid #f2f7ff; position: absolute; bottom: 0; right: 0; }
        .dialog-info { flex: 1; min-width: 0; }
        .dialog-info .name { font-weight: 700; font-size: 15px; color: #17324d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dialog-info .last-msg { font-size: 13px; color: #5f7a92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dialog-time { font-size: 11px; color: #86a0b7; flex-shrink: 0; }
        .unread-badge { background: linear-gradient(135deg, #00d4ff, #39b7ff); color: #f7fcff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; min-width: 20px; text-align: center; }

        .news-item { padding: 16px 20px; border-bottom: 1px solid rgba(145, 178, 209, 0.16); cursor: pointer; transition: .15s; }
        .news-item:hover { background: rgba(255,255,255,.45); }
        .news-item .title { font-weight: 700; font-size: 16px; margin-bottom: 4px; color: #17324d; }
        .news-item .summary { font-size: 14px; color: #5f7a92; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .news-item .meta { font-size: 12px; color: #6f869b; margin-top: 6px; display: flex; gap: 12px; }
        .news-item .image-placeholder { margin-top: 8px; background: rgba(255,255,255,.6); border-radius: 12px; padding: 20px; text-align: center; font-size: 40px; color: #6f869b; }

        .messenger-chat { flex: 1; display: flex; flex-direction: column; background: rgba(255,255,255,0.34); position: relative; z-index: 1; }
        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(145, 178, 209, 0.22);
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255,255,255,0.6);
            min-height: 70px;
            flex-wrap: wrap;
        }
        .chat-header .back-btn { display: none; background: transparent; border: none; color: #17324d; font-size: 20px; cursor: pointer; }
        .chat-header .chat-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0,212,255,.2), rgba(255,255,255,.8));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #0b6fe4;
        }
        .chat-header .chat-name { font-weight: 700; font-size: 18px; color: #17324d; }
        .chat-header .chat-status { font-size: 13px; color: #5f7a92; }
        .chat-header .chat-actions { margin-left: auto; display: flex; gap: 6px; }
        .chat-header .chat-actions button { width: 34px; height: 34px; font-size: 15px; border-radius: 50%; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.8); color: #5f7a92; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; justify-content: center; }
        .chat-header .chat-actions button:hover { background: rgba(255,255,255,0.92); border-color: rgba(0,212,255,.2); color: #0b6fe4; }

        .chat-messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(180deg, rgba(255,255,255,0.16), transparent); }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-wrap: break-word; position: relative; box-shadow: 0 12px 24px rgba(19, 53, 86, 0.08); }
        .message.sent { align-self: flex-end; background: linear-gradient(135deg, #00d4ff, #008cff); color: white; border-bottom-right-radius: 6px; }
        .message.received { align-self: flex-start; background: rgba(255,255,255,0.8); color: #17324d; border-bottom-left-radius: 6px; }
        .message .msg-time { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 4px; text-align: right; }
        .message.received .msg-time { color: #7a91a7; }
        .message .msg-username { font-size: 12px; font-weight: 700; color: #0b6fe4; margin-bottom: 4px; }
        .message .file-attachment { display: inline-block; background: rgba(255,255,255,0.65); padding: 6px 12px; border-radius: 8px; margin-top: 6px; font-size: 13px; }
        .message .file-attachment a { color: #0b6fe4; text-decoration: none; }

        .typing-indicator { align-self: flex-start; font-size: 14px; color: #5f7a92; padding: 8px 16px; background: rgba(255,255,255,0.72); border-radius: 18px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        .chat-input-area { padding: 16px 24px; border-top: 1px solid rgba(145, 178, 209, 0.22); display: flex; gap: 10px; background: rgba(255,255,255,0.62); align-items: center; flex-wrap: wrap; }
        .chat-input-area .input-group { flex: 1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 200px; }
        .chat-input-area .input-group input { flex: 1; padding: 12px 18px; border-radius: 24px; border: 1px solid rgba(145, 178, 209, 0.24); background: rgba(255,255,255,0.75); color: #17324d; font-size: 15px; outline: none; transition: .3s; min-width: 120px; }
        .chat-input-area .input-group input:focus { border-color: #00d4ff; box-shadow: 0 0 0 3px rgba(0,212,255,.1); }
        .chat-input-area .input-group input::placeholder { color: #6f869b; }
        .chat-input-area .input-group .emoji-btn, .chat-input-area .input-group .file-btn { background: transparent; border: none; font-size: 22px; cursor: pointer; transition: .2s; padding: 4px 6px; color: #5f7a92; }
        .chat-input-area .input-group .emoji-btn:hover, .chat-input-area .input-group .file-btn:hover { color: #0b6fe4; }
        .chat-input-area .call-buttons { display: flex; gap: 6px; }
        .chat-input-area .call-buttons button { width: 38px; height: 38px; font-size: 18px; border-radius: 50%; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.8); color: #17324d; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; justify-content: center; }
        .chat-input-area .call-buttons button:hover { background: rgba(255,255,255,0.92); border-color: rgba(0,212,255,.2); }
        .chat-input-area .send-btn { padding: 12px 24px; border: none; border-radius: 24px; background: linear-gradient(135deg, #00d4ff, #008cff); color: white; font-weight: 700; cursor: pointer; transition: .3s; box-shadow: 0 12px 24px rgba(0,140,255,.18); }
        .chat-input-area .send-btn:hover { transform: scale(1.01); box-shadow: 0 16px 28px rgba(0,140,255,.24); }
        .chat-input-area .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .emoji-picker {
            display: none;
            position: absolute;
            bottom: 76px;
            left: 20px;
            background: rgba(255,255,255,0.92);
            border: 1px solid rgba(255,255,255,0.92);
            border-radius: 16px;
            padding: 16px;
            width: 280px;
            max-height: 200px;
            overflow-y: auto;
            backdrop-filter: blur(18px);
            z-index: 200;
            box-shadow: 0 18px 40px rgba(19, 53, 86, 0.12);
        }
        .emoji-picker.active { display: block; }
        .emoji-picker .emoji-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .emoji-picker .emoji-grid button { background: transparent; border: none; font-size: 24px; cursor: pointer; padding: 4px; transition: .15s; border-radius: 8px; }
        .emoji-picker .emoji-grid button:hover { background: rgba(0,212,255,.12); }

        .group-modal, .call-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(13,28,41,.24);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }
        .group-modal.active, .call-modal.active { display: flex; }

        .group-modal .modal-box, .call-modal .modal-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(236,246,255,0.86));
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 24px;
            padding: 30px 35px;
            max-width: 420px;
            width: 95%;
            box-shadow: 0 24px 60px rgba(19, 53, 86, 0.16);
            position: relative;
            text-align: center;
        }
        .group-modal .modal-box::before, .call-modal .modal-box::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d4ff, #00ffa3, transparent);
        }
        .group-modal .modal-box h2, .call-modal .modal-box h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #17324d;
        }
        .group-modal .modal-box .form-group { margin-bottom: 16px; text-align: left; }
        .group-modal .modal-box .form-group label { display: block; font-size: 14px; color: #45657d; margin-bottom: 4px; }
        .group-modal .modal-box .form-group input, .group-modal .modal-box .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(145, 178, 209, 0.24);
            background: rgba(255,255,255,0.72);
            color: #17324d;
            font-size: 15px;
            outline: none;
            transition: .3s;
            box-sizing: border-box;
        }
        .group-modal .modal-box .form-group input:focus, .group-modal .modal-box .form-group select:focus { border-color: #00d4ff; box-shadow: 0 0 0 3px rgba(0,212,255,.12); }
        .group-modal .modal-box .form-group select option { background: #f7fbff; color: #17324d; }
        .group-modal .modal-box .form-actions, .call-actions { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
        .group-modal .modal-box .form-actions button, .call-actions button { padding: 12px 28px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: .3s; }
        .group-modal .modal-box .form-actions .btn-create { background: linear-gradient(135deg, #00d4ff, #008cff); color: white; box-shadow: 0 14px 28px rgba(0,140,255,.18); }
        .group-modal .modal-box .form-actions .btn-create:hover { transform: translateY(-1px); box-shadow: 0 16px 30px rgba(0,140,255,.24); }
        .group-modal .modal-box .form-actions .btn-cancel, .btn-end-call { background: rgba(255, 77, 77, 0.14); border: 1px solid rgba(255, 77, 77, 0.25); color: #be3d3d; }
        .btn-end-call:hover { background: rgba(255, 77, 77, 0.22); color: #8e2f2f; }

        .call-avatar { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, rgba(0,212,255,.2), rgba(255,255,255,.85)); color: #0b6fe4; font-size: 36px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; border: 2px solid rgba(0,212,255,.28); animation: pulse 2s infinite; }
        .call-status { color: #5f7a92; font-size: 14px; margin-top: 4px; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .empty-chat { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #5f7a92; text-align: center; padding: 40px; }
        .empty-chat .icon { font-size: 60px; margin-bottom: 20px; opacity: 0.6; }
        .empty-chat h3 { font-size: 22px; color: #17324d; margin-bottom: 8px; }

        .empty-state { text-align: center; padding: 30px 20px; color: #5f7a92; }
        .empty-state .icon { font-size: 40px; margin-bottom: 10px; }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.92);
            border-radius: 16px;
            padding: 14px 24px;
            color: #17324d;
            font-weight: 600;
            box-shadow: 0 18px 40px rgba(19, 53, 86, 0.12);
            z-index: 2000;
            animation: slideUp 0.3s ease;
        }
        .toast.success { border-left: 4px solid #00ffa3; }
        .toast.error { border-left: 4px solid #ff6b6b; }
        .toast.info { border-left: 4px solid #00d4ff; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        header {
            background: rgba(255,255,255,0.62) !important;
            backdrop-filter: blur(22px) saturate(180%) !important;
            border-bottom: 1px solid rgba(255,255,255,0.8) !important;
            box-shadow: 0 8px 30px rgba(19, 53, 86, 0.08) !important;
        }
        .header-right .lang, .header-right .logout-btn, .header-right .btn-switch {
            background: rgba(255,255,255,0.74) !important;
            border: 1px solid rgba(255,255,255,0.9) !important;
            color: #17324d !important;
            backdrop-filter: blur(6px) !important;
            transition: all .3s !important;
        }
        .header-right .lang:hover, .header-right .logout-btn:hover, .header-right .btn-switch:hover {
            background: rgba(255,255,255,0.96) !important;
            border-color: rgba(0,212,255,.2) !important;
            color: #0b6fe4 !important;
        }

        @media (max-width: 992px) { .messenger-sidebar { width: 260px; min-width: 220px; } }
        @media (max-width: 768px) {
            .messenger-container { flex-direction: column; height: auto; min-height: 600px; }
            .messenger-sidebar { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid rgba(145,178,209,.22); max-height: 300px; }
            .chat-header .back-btn { display: block; }
            .message { max-width: 90%; }
            .chat-input-area { flex-wrap: wrap; justify-content: center; }
            .chat-input-area .input-group input { min-width: 100%; }
            .emoji-picker { left: 10px; width: 250px; }
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs><linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00ffa3"/><stop offset="50%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#1f6bff"/></linearGradient></defs>
                        <circle cx="50" cy="50" r="28" fill="url(#logoGrad)" opacity="0.15"/>
                        <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" stroke="url(#logoGrad)" stroke-width="3"/>
                        <circle cx="48" cy="48" r="3.5" fill="#ffffff"/>
                    </svg>
                </div>
            </a>
            <div class="header-right">
                <span class="user-info">👤 <strong id="username" data-i18n="username_default">User</strong></span>
                <button class="lang" id="langBtn">RU</button>
                <button class="logout-btn" id="logoutBtn" data-i18n="logout">🚪 Çykmak</button>

        // Реестр пользователей для поиска
        const globalUsersRegistry = [
            { id: '1', name: 'Сердар Аннаев', lastMsg: 'Привет, как успехи?', time: '10:42', unread: 2, online: true },
            { id: '2', name: 'Мая Гараева', lastMsg: 'Документы отправлены', time: 'Вчера', unread: 0, online: false },

            { id: '5', name: 'Гуля Оразова', lastMsg: 'Проект готов.', time: '09:15', unread: 0, online: false }
        ];

        // State
        let currentLang = localStorage.getItem('lang') || 'tm';
        if (!['tm', 'ru', 'en'].includes(currentLang)) currentLang = 'tm';
        let activeTab = 'chats';
        let activeDialogId = null;
        let messagesData = {};
        let dialogsData = [];

        const emojis = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧','😮','😲','🥱','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕','🤑','🤠','😈','👿','👹','👺','🤡','💩','👻','💀','☠️','👽','👾','🤖','🎃','😺','😸','😹','😻','😼','😽','🙀','😿','😾','👋','🤚','🖐','✋','🖖','👌','🤏','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','🖕','👇','☝️','👍','👎','✊','👊','🤛','🤜','👏','🙌','👐','🤲','🤝','🙏','✍️','💅','🤳','💪'];

        // DOM elements
        const langBtn = document.getElementById('langBtn');
        const themeToggle = document.getElementById('themeToggle');
        const messengerContainer = document.getElementById('messengerContainer');
        const searchInput = document.getElementById('searchInput');
        const createGroupBtn = document.getElementById('createGroupBtn');
        const groupModal = document.getElementById('groupModal');
        const cancelGroupBtn = document.getElementById('cancelGroupBtn');
        const groupForm = document.getElementById('groupForm');
        const dialogsList = document.getElementById('dialogsList');
        const newsFeed = document.getElementById('newsFeed');
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const emojiBtn = document.getElementById('emojiBtn');
        const emojiPicker = document.getElementById('emojiPicker');
        const emojiGrid = document.getElementById('emojiGrid');
        const fileBtn = document.getElementById('fileBtn');
        const fileInput = document.getElementById('fileInput');
        const exportChatBtn = document.getElementById('exportChatBtn');
        const backBtn = document.getElementById('backBtn');
        const dropbtn = document.getElementById('dropbtn');
        const tabsDropdown = document.getElementById('tabsDropdown');
        const dropdownContent = document.getElementById('dropdownContent');

        // Элементы вызовов
        const audioCallBtn = document.getElementById('audioCallBtn');
        const videoCallBtn = document.getElementById('videoCallBtn');
        const callModal = document.getElementById('callModal');
        const endCallBtn = document.getElementById('endCallBtn');
        const callTargetName = document.getElementById('callTargetName');
        const callStatusText = document.getElementById('callStatusText');

        // Init Emojis
        emojis.forEach(e => {
            const btn = document.createElement('button');
            btn.textContent = e;
            btn.addEventListener('click', () => {
                messageInput.value += e;
                emojiPicker.classList.remove('active');
            });
            emojiGrid.appendChild(btn);
        });

        // Toggle Emoji Picker
        emojiBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            emojiPicker.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
                emojiPicker.classList.remove('active');
            }
            if (!tabsDropdown.contains(e.target)) {
                tabsDropdown.classList.remove('show');
            }
        });

        // Переключение языка и загрузка словаря из папки языков
        langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'ru' ? 'tm' : (currentLang === 'tm' ? 'en' : 'ru');
            localStorage.setItem('lang', currentLang);
            langBtn.textContent = currentLang.toUpperCase();
            applyLanguage();
        });

        function applyLanguage() {
            const dict = (window.translations && window.translations[currentLang]) ? window.translations[currentLang] : translations[currentLang];
            document.documentElement.lang = currentLang;
            langBtn.textContent = currentLang.toUpperCase();
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict && dict[key]) el.textContent = dict[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (dict && dict[key]) el.placeholder = dict[key];
            });
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                if (dict && dict[key]) el.title = dict[key];
            });
        }

        applyLanguage();

        // Theme Toggle
        themeToggle.addEventListener('click', () => {
            messengerContainer.classList.toggle('light-theme');
            themeToggle.textContent = messengerContainer.classList.contains('light-theme') ? '☀️' : '🌙';
        });

        // Dropdown tabs
        dropbtn.addEventListener('click', () => tabsDropdown.classList.toggle('show'));

        dropdownContent.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                dropdownContent.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeTab = btn.getAttribute('data-tab');
                document.getElementById('currentTabLabel').textContent = btn.textContent;
                tabsDropdown.classList.remove('show');
                
                if (activeTab === 'chats') {
                    dialogsList.style.display = 'block';
                    newsFeed.style.display = 'none';
                } else if (activeTab === 'news') {
                    dialogsList.style.display = 'none';
                    newsFeed.style.display = 'block';
                    renderNews();
                } else if (activeTab === 'assistant') {
                    openAssistant();
                }
            });
        });

        // Поиск пользователей / Диалогов
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                renderDialogs(dialogsData);
                return;
            }

            // Ищем в глобальном реестре и среди существующих диалогов
            const filtered = globalUsersRegistry.filter(u => u.name.toLowerCase().includes(query));

            if (filtered.length === 0) {
                dialogsList.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>${translations[currentLang].user_not_found}</p></div>`;
            } else {
                renderDialogs(filtered);
            }
        });

        // Group Modal
        createGroupBtn.addEventListener('click', () => {
            groupModal.classList.add('active');
            const select = document.getElementById('groupMembers');
            select.innerHTML = '';
            dialogsData.forEach(d => {
                if (!d.isGroup && d.id !== 'assistant') {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.name;
                    select.appendChild(opt);
                }
            });
        });

        cancelGroupBtn.addEventListener('click', () => groupModal.classList.remove('active'));

        groupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('groupName').value.trim();
            if (!name) return;

            const newGroup = {
                id: 'group_' + Date.now(),
                name: name,
                lastMsg: 'Группа создана',
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                unread: 0,
                isGroup: true
            };

            dialogsData.unshift(newGroup);
            messagesData[newGroup.id] = [];
            renderDialogs();
            groupModal.classList.remove('active');
            groupForm.reset();
            showToast('Группа создана!', 'success');
        });

        // Логика звонков
        function startCall(type) {
            const dialog = dialogsData.find(d => d.id === activeDialogId);
            if (!dialog) {
                showToast(translations[currentLang].select_chat, 'error');
                return;
            }
            callTargetName.textContent = dialog.name;
            callStatusText.textContent = type === 'audio' ? 'Аудиовызов...' : 'Видеовызов...';
            callModal.classList.add('active');
        }

        audioCallBtn.addEventListener('click', () => startCall('audio'));
        videoCallBtn.addEventListener('click', () => startCall('video'));
        endCallBtn.addEventListener('click', () => callModal.classList.remove('active'));

        // File attachment dummy trigger
        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0 && activeDialogId) {
                Array.from(fileInput.files).forEach(f => {
                    sendMessage(`📎 Файл: ${f.name}`);
                });
                fileInput.value = '';
            }
        });

        // Export Chat
        exportChatBtn.addEventListener('click', () => {
            if (!activeDialogId || !messagesData[activeDialogId] || messagesData[activeDialogId].length === 0) {
                showToast(translations[currentLang].no_export, 'error');
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(messagesData[activeDialogId], null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `chat_export_${activeDialogId}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast(translations[currentLang].export_success, 'success');
        });

        // Toast Helper
        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Init Mock Data
        function initMockData() {
            dialogsData = [...globalUsersRegistry.slice(0, 3)];

            messagesData = {
                '1': [{ sender: 'Сердар Аннаев', text: 'Привет, как успехи?', time: '10:42', type: 'received' }],
                '2': [{ sender: 'Мая Гараева', text: 'Документы отправлены', time: 'Вчера', type: 'received' }],
                '3': [{ sender: 'Разработчики Sfera', text: 'Обновление готово!', time: 'Пн', type: 'received' }]
            };

            renderDialogs();
        }

        function renderDialogs(listToRender = dialogsData) {
            dialogsList.innerHTML = '';
            listToRender.forEach(d => {
                const item = document.createElement('div');
                item.className = `dialog-item ${activeDialogId === d.id ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="dialog-avatar ${d.isGroup ? 'group' : ''}">
                        ${d.isGroup ? '👥' : d.name.charAt(0)}
                        ${d.online ? '<div class="online-dot"></div>' : ''}
                    </div>
                    <div class="dialog-info">
                        <div class="name">${d.name}</div>
                        <div class="last-msg">${d.lastMsg}</div>
                    </div>
                    <div class="dialog-time">${d.time}</div>
                    ${d.unread > 0 ? `<div class="unread-badge">${d.unread}</div>` : ''}
                `;
                item.addEventListener('click', () => {
                    if (!dialogsData.some(x => x.id === d.id)) {
                        dialogsData.push(d);
                    }
                    selectDialog(d.id);
                });
                dialogsList.appendChild(item);
            });
        }

        function selectDialog(id) {
            activeDialogId = id;
            const dialog = dialogsData.find(d => d.id === id) || globalUsersRegistry.find(u => u.id === id);
            if (dialog) dialog.unread = 0;
            renderDialogs();
            renderChat();
        }

        function renderChat() {
            const dialog = dialogsData.find(d => d.id === activeDialogId) || globalUsersRegistry.find(u => u.id === activeDialogId);
            if (!dialog) return;

            document.getElementById('chatName').textContent = dialog.name;
            document.getElementById('chatAvatar').textContent = dialog.isGroup ? '👥' : dialog.name.charAt(0);
            document.getElementById('chatStatus').textContent = dialog.online ? translations[currentLang].online : translations[currentLang].offline;

            chatMessages.innerHTML = '';
            const msgs = messagesData[activeDialogId] || [];
            msgs.forEach(m => {
                const msgEl = document.createElement('div');
                msgEl.className = `message ${m.type}`;
                msgEl.innerHTML = `
                    ${m.type === 'received' && dialog.isGroup ? `<div class="msg-username">${m.sender}</div>` : ''}
                    <div>${m.text}</div>
                    <div class="msg-time">${m.time}</div>
                `;
                chatMessages.appendChild(msgEl);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage(text) {
            if (!activeDialogId || !text.trim()) return;
            const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            if (!messagesData[activeDialogId]) messagesData[activeDialogId] = [];
            messagesData[activeDialogId].push({ sender: 'Я', text: text, time: now, type: 'sent' });

            const d = dialogsData.find(x => x.id === activeDialogId);
            if (d) {
                d.lastMsg = text;
                d.time = now;
            }

            renderDialogs();
            renderChat();
            messageInput.value = '';
        }

        sendBtn.addEventListener('click', () => sendMessage(messageInput.value));
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage(messageInput.value);
        });

        function renderNews() {
            newsFeed.innerHTML = `
                <div class="news-item">
                    <div class="title" data-i18n="news_title_1">${translations[currentLang].news_title_1}</div>
                    <div class="summary" data-i18n="news_summary_1">${translations[currentLang].news_summary_1}</div>
                    <div class="meta"><span>📅 Today</span><span>👁 1,230</span></div>
                </div>
                <div class="news-item">
                    <div class="title" data-i18n="news_title_2">${translations[currentLang].news_title_2}</div>
                    <div class="summary" data-i18n="news_summary_2">${translations[currentLang].news_summary_2}</div>
                    <div class="meta"><span>📅 Yesterday</span><span>👁 3,410</span></div>
                </div>
            `;
        }

        function openAssistant() {
            let ast = dialogsData.find(d => d.id === 'assistant');
            if (!ast) {
                ast = {
                    id: 'assistant',
                    name: translations[currentLang].assistant_name,
                    lastMsg: translations[currentLang].assistant_hello,
                    time: 'NOW',
                    unread: 0,
                    online: true
                };
                dialogsData.unshift(ast);
                messagesData['assistant'] = [
                    { sender: ast.name, text: translations[currentLang].assistant_hello, time: 'NOW', type: 'received' }
                ];
            }
            dialogsList.style.display = 'block';
            newsFeed.style.display = 'none';
            selectDialog('assistant');
        }

        // Init App
        initMockData();
        applyLanguage();
    </script>
    <script src="/js/script.js"></script>
    <script src="js/auth-check.js"></script>
</body>
</html>
