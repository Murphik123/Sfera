<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>СФЕРА — Messenger</title>

    <link rel="stylesheet" href="/css/style.css" />
    <!-- Socket.io клиент для бэкенда -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
        /* ===== СПЕЦИФИЧНЫЕ СТИЛИ ДЛЯ МЕССЕНДЖЕРА ===== */
        .messenger-page { padding: 140px 0 60px; min-height: 100vh; display: flex; flex-direction: column; }
        .messenger-container { display: flex; flex: 1; height: calc(100vh - 200px); min-height: 500px; border-radius: 24px; overflow: hidden; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(12px); transition: background 0.3s, border-color 0.3s; }
        .messenger-container.light-theme { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); }
        .messenger-container.light-theme .messenger-sidebar { background: rgba(255,255,255,.15); }
        .messenger-container.light-theme .dialog-item:hover { background: rgba(255,255,255,.2); }
        .messenger-container.light-theme .message.received { background: rgba(255,255,255,.15); color: #000; }
        .messenger-container.light-theme .message.sent { background: linear-gradient(135deg, #00aaff, #0066cc); }
        .messenger-container.light-theme .chat-header { background: rgba(255,255,255,.1); }
        .messenger-container.light-theme .chat-input-area { background: rgba(255,255,255,.05); }
        .messenger-container.light-theme .dialog-info .name,
        .messenger-container.light-theme .chat-name { color: #000; }
        .messenger-container.light-theme .dialog-info .last-msg,
        .messenger-container.light-theme .chat-status { color: #555; }

        .messenger-sidebar { width: 320px; min-width: 280px; background: rgba(0,0,0,.2); border-right: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; transition: background 0.3s; }
        .sidebar-header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .sidebar-header .left-group { display: flex; align-items: center; gap: 10px; }
        .sidebar-header h2 { font-size: 18px; font-weight: 700; }
        .sidebar-header .theme-toggle { background: transparent; border: 1px solid rgba(255,255,255,.2); color: white; padding: 4px 10px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: .2s; }
        .sidebar-header .theme-toggle:hover { background: rgba(255,255,255,.05); }
        .sidebar-header .dropdown-tabs { position: relative; display: inline-block; }
        .sidebar-header .dropdown-tabs .dropbtn { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); color: white; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .sidebar-header .dropdown-tabs .dropbtn:hover { background: rgba(255,255,255,.15); }
        .sidebar-header .dropdown-tabs .dropdown-content { display: none; position: absolute; right: 0; top: 100%; background: rgba(13,28,41,.95); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; min-width: 140px; box-shadow: 0 15px 40px rgba(0,0,0,.4); z-index: 100; padding: 6px 0; margin-top: 6px; }
        .sidebar-header .dropdown-tabs .dropdown-content button { background: transparent; border: none; color: #bdd0df; padding: 10px 20px; width: 100%; text-align: left; font-size: 14px; font-weight: 500; cursor: pointer; transition: .2s; }
        .sidebar-header .dropdown-tabs .dropdown-content button:hover { background: rgba(255,255,255,.05); color: white; }
        .sidebar-header .dropdown-tabs .dropdown-content button.active { color: #00d4ff; background: rgba(0,212,255,.05); }
        .sidebar-header .dropdown-tabs.show .dropdown-content { display: block; }

        .sidebar-search { padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap; }
        .sidebar-search input { flex: 1; padding: 10px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color: white; font-size: 14px; outline: none; transition: .3s; min-width: 120px; }
        .sidebar-search input:focus { border-color: #00d4ff; }
        .sidebar-search input::placeholder { color: #9fb5c8; }
        .sidebar-search .create-group-btn { padding: 10px 16px; background: rgba(0,212,255,.15); border: 1px solid rgba(0,212,255,.3); border-radius: 12px; color: #00d4ff; cursor: pointer; font-weight: 600; transition: .2s; white-space: nowrap; }
        .sidebar-search .create-group-btn:hover { background: rgba(0,212,255,.25); }

        .dialogs-list, .news-feed { flex: 1; overflow-y: auto; padding: 8px 0; }
        .dialog-item { display: flex; align-items: center; padding: 12px 20px; cursor: pointer; transition: .2s; border-left: 3px solid transparent; gap: 12px; }
        .dialog-item:hover { background: rgba(255,255,255,.05); }
        .dialog-item.active { background: rgba(0,212,255,.08); border-left-color: #00d4ff; }
        .dialog-avatar { width: 44px; height: 44px; border-radius: 50%; background: rgba(0,212,255,.2); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; color: #00d4ff; flex-shrink: 0; position: relative; }
        .dialog-avatar.group { background: rgba(255,200,0,.2); color: #ffc800; }
        .dialog-avatar .online-dot { width: 10px; height: 10px; border-radius: 50%; background: #00ffa3; border: 2px solid #08131d; position: absolute; bottom: 0; right: 0; }
        .dialog-info { flex: 1; min-width: 0; }
        .dialog-info .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dialog-info .last-msg { font-size: 13px; color: #9fb5c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dialog-time { font-size: 11px; color: #6b7f94; flex-shrink: 0; }
        .unread-badge { background: #00d4ff; color: #08131d; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; min-width: 20px; text-align: center; }

        .news-item { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer; transition: .15s; }
        .news-item:hover { background: rgba(255,255,255,.03); }
        .news-item .title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        .news-item .summary { font-size: 14px; color: #bdd0df; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .news-item .meta { font-size: 12px; color: #9fb5c8; margin-top: 6px; display: flex; gap: 12px; }

        .messenger-chat { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,.1); }
        .chat-header { padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 14px; background: rgba(0,0,0,.15); min-height: 70px; flex-wrap: wrap; }
        .chat-header .back-btn { display: none; background: transparent; border: none; color: white; font-size: 20px; cursor: pointer; }
        .chat-header .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(0,212,255,.2); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: #00d4ff; }
        .chat-header .chat-name { font-weight: 700; font-size: 18px; }
        .chat-header .chat-status { font-size: 13px; color: #9fb5c8; }
        .chat-header .chat-actions { margin-left: auto; display: flex; gap: 6px; }
        .chat-header .chat-actions button { width: 34px; height: 34px; font-size: 15px; border-radius: 50%; background: transparent; border: 1px solid rgba(255,255,255,.15); color: #9fb5c8; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; justify-content: center; }
        .chat-header .chat-actions button:hover { background: rgba(255,255,255,.05); border-color: #00d4ff; color: white; }

        .chat-messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 75%; padding: 12px 18px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-wrap: break-word; position: relative; }
        .message.sent { align-self: flex-end; background: linear-gradient(135deg, #00d4ff, #008cff); color: white; border-bottom-right-radius: 6px; }
        .message.received { align-self: flex-start; background: rgba(255,255,255,.08); color: white; border-bottom-left-radius: 6px; }
        .message .msg-time { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 4px; text-align: right; }
        .message.received .msg-time { color: #9fb5c8; }
        .message .msg-username { font-size: 12px; font-weight: 600; color: #00d4ff; margin-bottom: 4px; }

        .chat-input-area { padding: 16px 24px; border-top: 1px solid rgba(255,255,255,.08); display: flex; gap: 10px; background: rgba(0,0,0,.1); align-items: center; flex-wrap: wrap; }
        .chat-input-area .input-group { flex: 1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 200px; }
        .chat-input-area .input-group input { flex: 1; padding: 12px 18px; border-radius: 24px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color: white; font-size: 15px; outline: none; transition: .3s; min-width: 120px; }
        .chat-input-area .input-group input:focus { border-color: #00d4ff; }
        .chat-input-area .input-group input::placeholder { color: #9fb5c8; }
        .chat-input-area .input-group .emoji-btn, .chat-input-area .input-group .file-btn { background: transparent; border: none; font-size: 22px; cursor: pointer; transition: .2s; padding: 4px 6px; color: #9fb5c8; }
        .chat-input-area .input-group .emoji-btn:hover, .chat-input-area .input-group .file-btn:hover { color: white; }
        .chat-input-area .call-buttons { display: flex; gap: 6px; }
        .chat-input-area .call-buttons button { width: 38px; height: 38px; font-size: 18px; border-radius: 50%; background: transparent; border: 1px solid rgba(255,255,255,.2); color: white; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; justify-content: center; }
        .chat-input-area .call-buttons button:hover { background: rgba(255,255,255,.1); border-color: #00d4ff; }
        .chat-input-area .send-btn { padding: 12px 24px; border: none; border-radius: 24px; background: linear-gradient(135deg, #00d4ff, #008cff); color: white; font-weight: 600; cursor: pointer; transition: .3s; }
        .chat-input-area .send-btn:hover { transform: scale(1.02); box-shadow: 0 10px 30px rgba(0,212,255,.3); }

        .emoji-picker { display: none; position: absolute; bottom: 70px; left: 20px; background: rgba(13,28,41,.95); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 16px; width: 280px; max-height: 200px; overflow-y: auto; backdrop-filter: blur(12px); z-index: 200; box-shadow: 0 15px 40px rgba(0,0,0,.4); }
        .emoji-picker.active { display: block; }
        .emoji-picker .emoji-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .emoji-picker .emoji-grid button { background: transparent; border: none; font-size: 24px; cursor: pointer; padding: 4px; transition: .15s; border-radius: 8px; }
        .emoji-picker .emoji-grid button:hover { background: rgba(255,255,255,.1); }

        /* ===== МОДАЛЬНОЕ ОКНО ЗВОНКА (CALL MODAL) ===== */
        .call-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 17, 29, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            justify-content: center;
            align-items: center;
            z-index: 2500;
            animation: fadeIn 0.3s ease;
        }
        .call-modal.active { display: flex; }
        .call-card {
            background: rgba(20, 32, 50, 0.85);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 32px;
            padding: 40px;
            width: 360px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 212, 255, 0.2);
            position: relative;
        }
        .call-avatar {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ffa3, #00d4ff);
            margin: 0 auto 20px;
            display: flex; justify-content: center; align-items: center;
            font-size: 42px; color: #06111d; font-weight: 800;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
            animation: avatarPulse 2s infinite;
        }
        @keyframes avatarPulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(0, 212, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0); }
        }
        .call-user-name { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .call-status-text { font-size: 14px; color: #00ffa3; margin-bottom: 25px; }
        .call-actions { display: flex; justify-content: center; gap: 18px; }
        .call-action-btn {
            width: 52px; height: 52px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: white; font-size: 20px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: 0.3s;
        }
        .call-action-btn:hover { background: rgba(255,255,255,0.2); }
        .end-call-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b) !important;
            border: none !important;
            width: 64px !important; height: 64px !important;
            font-size: 26px !important;
            box-shadow: 0 10px 25px rgba(255, 65, 108, 0.5);
        }
        .end-call-btn:hover { transform: scale(1.1); box-shadow: 0 15px 35px rgba(255, 65, 108, 0.8); }

        /* ===== МОДАЛЬНОЕ ОКНО ГРУППЫ ===== */
        .group-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); justify-content: center; align-items: center; z-index: 1000; animation: fadeIn 0.3s ease; }
        .group-modal.active { display: flex; }
        .group-modal .modal-box { background: rgba(20,30,45,0.92); backdrop-filter: blur(35px); border: 1px solid rgba(255,255,255,.18); border-radius: 24px; padding: 30px 35px; max-width: 420px; width: 95%; box-shadow: 0 30px 80px rgba(0,0,0,.6); position: relative; }
        .group-modal .modal-box h2 { font-size: 24px; font-weight: 700; margin-bottom: 20px; background: linear-gradient(to right, #fff, #b4d7ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .group-modal .modal-box .form-group { margin-bottom: 16px; }
        .group-modal .modal-box .form-group label { display: block; font-size: 14px; color: #dbe9ff; margin-bottom: 4px; }
        .group-modal .modal-box .form-group input, .group-modal .modal-box .form-group select { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.08); color: white; font-size: 15px; outline: none; transition: .3s; }
        .group-modal .modal-box .form-group select option { background: #0b2035; color: white; }
        .group-modal .modal-box .form-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 10px; }
        .group-modal .modal-box .form-actions button { padding: 12px 28px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: .3s; }
        .group-modal .modal-box .form-actions .btn-create { background: linear-gradient(135deg, #00d4ff, #008cff); color: white; }
        .group-modal .modal-box .form-actions .btn-cancel { background: transparent; border: 1px solid rgba(255,255,255,.2); color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .empty-chat { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #9fb5c8; text-align: center; padding: 40px; }
        .empty-chat .icon { font-size: 60px; margin-bottom: 20px; opacity: 0.5; }

        .toast { position: fixed; bottom: 30px; right: 30px; background: rgba(13,28,41,.9); backdrop-filter: blur(10px); border: 1px solid rgba(0,212,255,.3); border-radius: 16px; padding: 14px 24px; color: white; font-weight: 500; box-shadow: 0 20px 40px rgba(0,0,0,.4); z-index: 3000; animation: slideUp 0.3s ease; }
        .toast.success { border-left: 4px solid #00ffa3; }
        .toast.error { border-left: 4px solid #ff6b6b; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        header { background: rgba(255, 255, 255, 0.06) !important; backdrop-filter: blur(20px) !important; border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important; }
        .header-right .lang, .header-right .logout-btn, .header-right .btn-switch { background: rgba(255, 255, 255, 0.08) !important; border: 1px solid rgba(255, 255, 255, 0.15) !important; color: #fff !important; backdrop-filter: blur(4px) !important; transition: all 0.3s !important; }
        .header-right .lang:hover, .header-right .logout-btn:hover, .header-right .btn-switch:hover { background: rgba(255, 255, 255, 0.15) !important; border-color: #00d4ff !important; color: #00d4ff !important; }
        .logo-text p { display: none !important; }
    </style>
</head>
<body>
    <div id="particles"></div>

    <header>
        <div class="container">
            <a href="dashboard.html" class="logo">
                <div class="logo-icon">
                    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs><linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00ffa3"/><stop offset="50%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#1f6bff"/></linearGradient></defs>
                        <circle cx="50" cy="50" r="28" fill="url(#logoGrad)" opacity="0.15"/>
                        <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" stroke="url(#logoGrad)" stroke-width="3"/>
                        <circle cx="48" cy="48" r="3.5" fill="#ffffff"/>
                    </svg>
                </div>
                <div class="logo-text"><h2>SFERA</h2><p id="logoSubtitle" data-i18n="logo_subtitle">Milli Sanly Platforma</p></div>
            </a>
            <div class="header-right">
                <span class="user-info">👤 <strong id="username">User</strong></span>
                <button class="lang" id="langBtn">RU</button>
                <button class="logout-btn" id="logoutBtn" data-i18n="logout">🚪 Çykmak</button>
                <a href="dashboard.html" id="backLink" class="btn-switch" data-i18n="back">← Yza</a>
            </div>
        </div>
    </header>

    <section class="messenger-page">
        <div class="container" style="flex:1; display:flex; flex-direction:column;">
            <div class="messenger-container" id="messengerContainer">
                <div class="messenger-sidebar" id="sidebar">
                    <div class="sidebar-header">
                        <div class="left-group">
                            <h2 data-i18n="messenger_title">Söhbet</h2>
                            <button class="theme-toggle" id="themeToggle">🌙</button>
                        </div>
                        <div class="dropdown-tabs" id="tabsDropdown">
                            <button class="dropbtn" id="dropbtn">📋 <span id="currentTabLabel" data-i18n="tab_chats">Çatlar</span> ▾</button>
                            <div class="dropdown-content" id="dropdownContent">
                                <button class="active" data-tab="chats" data-i18n="tab_chats">Çatlar</button>
                                <button data-tab="news" data-i18n="tab_news">Habarlar</button>
                                <button data-tab="assistant" data-i18n="tab_assistant">Kömekçi</button>
                            </div>
                        </div>
                    </div>
                    <div class="sidebar-search">
                        <input type="text" id="searchInput" placeholder="Gözleg..." data-i18n-placeholder="search_placeholder" />
                        <button class="create-group-btn" id="createGroupBtn" data-i18n="create_group">➕ Topar</button>
                    </div>
                    <div class="dialogs-list" id="dialogsList"></div>
                    <div class="news-feed" id="newsFeed" style="display:none;"></div>
                </div>

                <div class="messenger-chat" id="chatWindow">
                    <div class="chat-header" id="chatHeader">
                        <button class="back-btn" id="backBtn">←</button>
                        <div class="chat-avatar" id="chatAvatar">👤</div>
                        <div>
                            <div class="chat-name" id="chatName" data-i18n="select_chat">Söhbet</div>
                            <div class="chat-status" id="chatStatus" data-i18n="online">onlaýn</div>
                        </div>
                        <div class="chat-actions">
                            <button id="searchInChatBtn" title="🔍">🔍</button>
                            <button id="exportChatBtn" title="📥">📥</button>
                        </div>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <div class="empty-chat">
                            <div class="icon">💬</div>
                            <h3 data-i18n="select_chat">Söhbeti saýlaň</h3>
                            <p data-i18n="select_chat_desc">Çatdaşlaryňyzdan birini saýlaň ýa-da täze söhbet başlaň.</p>
                        </div>
                    </div>
                    <div class="chat-input-area" id="chatInputArea">
                        <div class="input-group">
                            <button class="emoji-btn" id="emojiBtn">😊</button>
                            <button class="file-btn" id="fileBtn">📎</button>
                            <input type="file" id="fileInput" style="display:none;" multiple accept="image/*,.pdf,.doc,.docx,.txt" />
                            <input type="text" id="messageInput" placeholder="Habaryňyzy ýazyň..." data-i18n-placeholder="type_message" />
                        </div>
                        <div class="call-buttons">
                            <button id="audioCallBtn" title="📞">📞</button>
                            <button id="videoCallBtn" title="📹">📹</button>
                        </div>
                        <button class="send-btn" id="sendBtn" data-i18n="send">Iber</button>
                    </div>
                    <div class="emoji-picker" id="emojiPicker">
                        <div class="emoji-grid" id="emojiGrid"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- МОДАЛЬНОЕ ОКНО ЗВОНКА -->
    <div class="call-modal" id="callModal">
        <div class="call-card">
            <div class="call-avatar" id="callAvatar">👤</div>
            <div class="call-user-name" id="callUserName">Пользователь</div>
            <div class="call-status-text" id="callStatusText">Идет вызов...</div>
            <div class="call-actions">
                <button class="call-action-btn" id="toggleMicBtn" title="Микрофон">🎙️</button>
                <button class="call-action-btn end-call-btn" id="endCallBtn" title="Завершить звонок">📞</button>
                <button class="call-action-btn" id="toggleCamBtn" title="Камера">📹</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ГРУППЫ -->
    <div class="group-modal" id="groupModal">
        <div class="modal-box">
            <h2 data-i18n="create_group_title">Täze topar döret</h2>
            <form id="groupForm">
                <div class="form-group">
                    <label for="groupName" data-i18n="group_name">Toparyň ady</label>
                    <input type="text" id="groupName" placeholder="Mysal: Taslama topary" required />
                </div>
                <div class="form-group">
                    <label for="groupMembers" data-i18n="group_members">Agzalar</label>
                    <select id="groupMembers" multiple style="height:100px;"></select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="cancelGroupBtn" data-i18n="cancel">Ýatyr</button>
                    <button type="submit" class="btn-create" data-i18n="create">Döret</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // ЛОКАЛИЗАЦИЯ И ПЕРЕВОДЫ
        // ============================================================
        const translations = {
            ru: {
                logo_subtitle: "Национальная Цифровая Платформа", logout: "🚪 Выйти", back: "← Назад", messenger_title: "Мессенджер",
                tab_chats: "Чаты", tab_news: "Новости", tab_assistant: "Помощник", search_placeholder: "Поиск...",
                select_chat: "Выберите чат", select_chat_desc: "Выберите собеседника или начните новый чат.",
                type_message: "Введите сообщение...", send: "Отправить", online: "онлайн", offline: "офлайн",
                create_group: "➕ Группа", create_group_title: "Создать группу", group_name: "Название группы",
                group_members: "Участники", create: "Создать", cancel: "Отмена", calling: "Вызов...", call_connected: "Разговор..."
            },
            tm: {
                logo_subtitle: "Milli Sanly Platforma", logout: "🚪 Çykmak", back: "← Yza", messenger_title: "Söhbet",
                tab_chats: "Çatlar", tab_news: "Habarlar", tab_assistant: "Kömekçi", search_placeholder: "Gözleg...",
                select_chat: "Söhbeti saýlaň", select_chat_desc: "Çatdaşlaryňyzdan birini saýlaň.",
                type_message: "Habaryňyzy ýazyň...", send: "Iber", online: "onlaýn", offline: "offlaýn",
                create_group: "➕ Topar", create_group_title: "Täze topar döret", group_name: "Toparyň ady",
                group_members: "Agzalar", create: "Döret", cancel: "Ýatyr", calling: "Jaň edilýär...", call_connected: "Söhbetdeşlik..."
            },
            en: {
                logo_subtitle: "National Digital Platform", logout: "🚪 Logout", back: "← Back", messenger_title: "Messenger",
                tab_chats: "Chats", tab_news: "News", tab_assistant: "Assistant", search_placeholder: "Search...",
                select_chat: "Select a chat", select_chat_desc: "Select a contact or start a new chat.",
                type_message: "Type your message...", send: "Send", online: "online", offline: "offline",
                create_group: "➕ Group", create_group_title: "Create Group", group_name: "Group Name",
                group_members: "Members", create: "Create", cancel: "Cancel", calling: "Calling...", call_connected: "Connected..."
            }
        };

        let currentLang = localStorage.getItem('lang') || 'ru';
        let activeDialogId = null;
        let messagesData = {};
        let dialogsData = [];
        let socket = null;
        let callTimer = null;
        let secondsElapsed = 0;

        // Элементы управления
        const audioCallBtn = document.getElementById('audioCallBtn');
        const videoCallBtn = document.getElementById('videoCallBtn');
        const callModal = document.getElementById('callModal');
        const endCallBtn = document.getElementById('endCallBtn');
        const callUserName = document.getElementById('callUserName');
        const callStatusText = document.getElementById('callStatusText');
        const callAvatar = document.getElementById('callAvatar');

        // Подключение Socket.io
        try {
            socket = io();
            socket.on('connect', () => console.log('Socket connected!'));
            socket.on('receive_message', (data) => {
                if (!messagesData[data.dialogId]) messagesData[data.dialogId] = [];
                messagesData[data.dialogId].push(data);
                if (activeDialogId === data.dialogId) renderChat();
            });
        } catch (e) {
            console.log('Socket server running in local/standalone mode');
        }

        // Вызов и работа звонков
        function startCall(isVideo = false) {
            const dialog = dialogsData.find(d => d.id === activeDialogId);
            if (!dialog) {
                showToast('Выберите чат для звонка', 'error');
                return;
            }
            callUserName.textContent = dialog.name;
            callAvatar.textContent = dialog.isGroup ? '👥' : dialog.name.charAt(0);
            callStatusText.textContent = translations[currentLang].calling;
            callModal.classList.add('active');

            secondsElapsed = 0;
            setTimeout(() => {
                callStatusText.textContent = translations[currentLang].call_connected + ' (00:00)';
                callTimer = setInterval(() => {
                    secondsElapsed++;
                    const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                    const s = String(secondsElapsed % 60).padStart(2, '0');
                    callStatusText.textContent = `${translations[currentLang].call_connected} (${m}:${s})`;
                }, 1000);
            }, 2000);
        }

        function endCall() {
            clearInterval(callTimer);
            callModal.classList.remove('active');
            showToast('Звонок завершен', 'info');
        }

        audioCallBtn.addEventListener('click', () => startCall(false));
        videoCallBtn.addEventListener('click', () => startCall(true));
        endCallBtn.addEventListener('click', endCall);

        // Интеграция с Backend API
        async function fetchDialogs() {
            try {
                const res = await fetch('/api/messenger/dialogs');
                if (res.ok) {
                    dialogsData = await res.json();
                } else { throw new Error(); }
            } catch (e) {
                // Fallback / Моковые данные
                dialogsData = [
                    { id: '1', name: 'Сердар Аннаев', lastMsg: 'Привет, как успехи?', time: '10:42', unread: 2, online: true },
                    { id: '2', name: 'Мая Гараева', lastMsg: 'Документы отправлены', time: 'Вчера', unread: 0, online: false },
                    { id: '3', name: 'Разработчики Sfera', lastMsg: 'Обновление готово!', time: 'Пн', unread: 5, isGroup: true }
                ];
                messagesData = {
                    '1': [{ sender: 'Сердар Аннаев', text: 'Привет, как успехи?', time: '10:42', type: 'received' }],
                    '2': [{ sender: 'Мая Гараева', text: 'Документы отправлены', time: 'Вчера', type: 'received' }],
                    '3': [{ sender: 'Разработчики Sfera', text: 'Обновление готово!', time: 'Пн', type: 'received' }]
                };
            }
            renderDialogs();
        }

        function renderDialogs() {
            const list = document.getElementById('dialogsList');
            list.innerHTML = '';
            dialogsData.forEach(d => {
                const item = document.createElement('div');
                item.className = `dialog-item ${activeDialogId === d.id ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="dialog-avatar ${d.isGroup ? 'group' : ''}">
                        ${d.isGroup ? '👥' : d.name.charAt(0)}
                        ${d.online ? '<div class="online-dot"></div>' : ''}
                    </div>
                    <div class="dialog-info">
                        <div class="name">${d.name}</div>
                        <div class="last-msg">${d.lastMsg}</div>
                    </div>
                    <div class="dialog-time">${d.time}</div>
                    ${d.unread > 0 ? `<div class="unread-badge">${d.unread}</div>` : ''}
                `;
                item.addEventListener('click', () => selectDialog(d.id));
                list.appendChild(item);
            });
        }

        function selectDialog(id) {
            activeDialogId = id;
            const d = dialogsData.find(x => x.id === id);
            if (d) d.unread = 0;
            renderDialogs();
            renderChat();
        }

        function renderChat() {
            const dialog = dialogsData.find(d => d.id === activeDialogId);
            if (!dialog) return;

            document.getElementById('chatName').textContent = dialog.name;
            document.getElementById('chatAvatar').textContent = dialog.isGroup ? '👥' : dialog.name.charAt(0);
            document.getElementById('chatStatus').textContent = dialog.online ? translations[currentLang].online : translations[currentLang].offline;

            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            const msgs = messagesData[activeDialogId] || [];
            msgs.forEach(m => {
                const msgEl = document.createElement('div');
                msgEl.className = `message ${m.type}`;
                msgEl.innerHTML = `
                    ${m.type === 'received' && dialog.isGroup ? `<div class="msg-username">${m.sender}</div>` : ''}
                    <div>${m.text}</div>
                    <div class="msg-time">${m.time}</div>
                `;
                chatMessages.appendChild(msgEl);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage(text) {
            if (!activeDialogId || !text.trim()) return;
            const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const msgObj = { dialogId: activeDialogId, sender: 'Я', text: text, time: now, type: 'sent' };
            if (!messagesData[activeDialogId]) messagesData[activeDialogId] = [];
            messagesData[activeDialogId].push(msgObj);

            if (socket) socket.emit('send_message', msgObj);

            const d = dialogsData.find(x => x.id === activeDialogId);
            if (d) { d.lastMsg = text; d.time = now; }

            renderDialogs();
            renderChat();
            document.getElementById('messageInput').value = '';
        }

        document.getElementById('sendBtn').addEventListener('click', () => sendMessage(document.getElementById('messageInput').value));
        document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(e.target.value); });

        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchDialogs();
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('username').textContent = user.username || 'User';
        });
    </script>
</body>
</html>
