<!DOCTYPE html>
<html lang="tm">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="page_title">СФЕРА — TM Pay</title>

    <!-- Шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Общий CSS -->
    <link rel="stylesheet" href="/css/style.css" />

    <!-- Chart.js для графика -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        /* ==========================================================================
           1. ЦВЕТОВАЯ ПАЛИТРА И ДИЗАЙН-ТОКЕНЫ
           ========================================================================== */
        :root {
            --primary: #00d4ff;
            --secondary: #1f6bff;
            --accent: #00ffa3;
            --dark-bg: #03080e;
            --glass-bg: rgba(255, 255, 255, 0.035);
            --glass-border: rgba(0, 212, 255, 0.18);
            --glass-hover-bg: rgba(0, 212, 255, 0.08);
            --glass-hover-border: rgba(0, 212, 255, 0.45);
            --header-footer-bg: rgba(5, 14, 26, 0.75);
            --white: #ffffff;
            --text: #dbe9ff;
            --text-muted: #9bb3cc;
            --radius: 22px;
        }

        /* ==========================================================================
           2. СТИЛИЗАЦИЯ ПОЛЗУНКА ПРОКРУТКИ
           ========================================================================== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #03080e; border-left: 1px solid rgba(0, 212, 255, 0.1); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(0, 212, 255, 0.4), rgba(31, 107, 255, 0.5));
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #00d4ff, #00ffa3);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.8);
        }

        /* ==========================================================================
           3. ЭФФЕКТЫ СТЕКЛОВИДНОСТИ И ГРАДИЕНТЫ
           ========================================================================== */
        .full-glass-backdrop {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 212, 255, 0.16), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 163, 0.12), transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(31, 107, 255, 0.1), transparent 60%),
                rgba(3, 8, 14, 0.72);
            backdrop-filter: blur(65px) saturate(180%);
            -webkit-backdrop-filter: blur(65px) saturate(180%);
            pointer-events: none;
            z-index: 1;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
            opacity: 0.85;
        }

        #particles {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            overflow: hidden;
            z-index: 3;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(105vh) translateX(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.85; }
            80% { opacity: 0.85; }
            100% { transform: translateY(-10vh) translateX(15px) scale(1.1); opacity: 0; }
        }

        /* ==========================================================================
           4. БАЗОВЫЕ СТИЛИ
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 212, 255, 0.4) #03080e;
        }

        html { scroll-behavior: smooth; background-color: var(--dark-bg); }
        body { background-color: var(--dark-bg); color: var(--white); overflow-x: hidden; position: relative; min-height: 100vh; }
        .container { width: min(1400px, 92%); margin: auto; position: relative; z-index: 10; }

        /* ШАПКА */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 999;
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            background: var(--header-footer-bg);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
        }

        header .container { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; }

        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; transition: transform 0.3s ease; }
        .logo:hover { transform: translateY(-1px) scale(1.02); }
        .logo-icon { width: 54px; height: 54px; display: flex; justify-content: center; align-items: center; }
        .logo-svg { width: 100%; height: 100%; overflow: visible; }
        .logo-svg g { transform-origin: 50px 50px; animation: spinLogo 16s linear infinite; }
        @keyframes spinLogo { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .logo-text h2 {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            line-height: 1.1;
            background: linear-gradient(135deg, #ffffff 0%, #00d4ff 50%, #00ffa3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }
        .logo-text p { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; margin: 4px 0 0 0; color: #9fb5c8; text-transform: uppercase; }

        .header-right { display: flex; gap: 12px; align-items: center; }
        .user-info { font-size: 14px; font-weight: 600; color: var(--text); }

        .lang-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: white;
            backdrop-filter: blur(10px);
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.35s ease;
            user-select: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 54px;
        }
        .lang-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            transform: translateY(-1px);
        }

        .logout-btn {
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid rgba(255, 77, 77, 0.4);
            color: #ff6b6b;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .logout-btn:hover { background: rgba(255, 77, 77, 0.3); border-color: #ff6b6b; transform: translateY(-2px); }

        /* ===== СПЕЦИФИЧНЫЕ СТИЛИ ДЛЯ TM PAY ===== */
        .pay-page { padding: 140px 0 60px; min-height: 100vh; position: relative; z-index: 10; }
        .pay-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 30px; }
        .pay-header h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #b4d7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .pay-header .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #008cff); color: white; box-shadow: 0 10px 30px rgba(0,212,255,.25); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(0,212,255,.4); }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,.2); color: white; }
        .btn-outline:hover { background: rgba(255,255,255,.05); border-color: #00d4ff; }

        /* Балансовая карта */
        .balance-card {
            background: rgba(255,255,255,.035);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 30px 35px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .balance-card .balance-label { font-size: 16px; color: #bdd0df; }
        .balance-card .balance-amount {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #00ffa3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-card .balance-currency { font-size: 22px; color: #bdd0df; margin-left: 8px; }

        .chart-container {
            background: rgba(255,255,255,.035);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 30px;
            position: relative;
            height: 180px;
        }

        .wallet-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-top: 16px; }
        .wallet-item {
            background: rgba(255,255,255,.035);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--glass-border);
        }
        .wallet-item .currency { font-size: 14px; color: #9fb5c8; }
        .wallet-item .amount { font-size: 24px; font-weight: 700; color: white; }

        .pay-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,.05); padding-bottom: 4px; }
        .pay-tabs button {
            background: transparent;
            border: none;
            color: #9fb5c8;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: .3s;
            border-bottom: 3px solid transparent;
        }
        .pay-tabs button.active { color: #00d4ff; border-bottom-color: #00d4ff; }
        .pay-tabs button:hover { color: white; }

        .tab-content { display: none; animation: fadeUp .4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .transfer-form { max-width: 520px; margin: 0 auto; }
        .transfer-form .form-group { margin-bottom: 16px; }
        .transfer-form .form-group label { display: block; font-size: 14px; font-weight: 500; color: #dbe9ff; margin-bottom: 6px; }
        .transfer-form .form-group input,
        .transfer-form .form-group select,
        .transfer-form .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.05);
            color: white;
            font-size: 15px;
            transition: .3s;
            outline: none;
        }
        .transfer-form .form-group input:focus,
        .transfer-form .form-group select:focus,
        .transfer-form .form-group textarea:focus { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,.1); }
        .transfer-form .form-group textarea { resize: vertical; min-height: 60px; }
        .transfer-form .form-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 10px; }

        .empty-state { text-align: center; padding: 40px 20px; color: #bdd0df; }
        .empty-state .icon { font-size: 40px; margin-bottom: 10px; }

        .transactions-list { list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto; }
        .transactions-list li { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.05); display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .transactions-list .tx-type { display: inline-block; padding: 2px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-right: 8px; }
        .tx-type.credit { background: rgba(0,255,170,.15); color: #00ffa3; }
        .tx-type.debit { background: rgba(255,0,0,.15); color: #ff6b6b; }
        .tx-type.transfer { background: rgba(0,212,255,.15); color: #00d4ff; }
        .tx-type.international { background: rgba(255,193,7,.15); color: #ffc107; }
        .tx-amount.positive { color: #00ffa3; }
        .tx-amount.negative { color: #ff6b6b; }
        .tx-date { color: #9fb5c8; font-size: 12px; }
        .tx-description { flex: 1; margin: 0 12px; color: #bdd0df; }

        .filter-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .filter-bar select {
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.05);
            color: white;
            font-size: 14px;
            outline: none;
        }

        .qr-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: rgba(255,255,255,.04);
            border-radius: 18px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,.08);
            margin-top: 16px;
        }
        .qr-container img { border-radius: 12px; background: white; padding: 8px; }

        /* Тосты */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(13,28,41,.95);
            border: 1px solid rgba(0,212,255,.3);
            border-radius: 16px;
            padding: 16px 24px;
            color: white;
            font-weight: 500;
            box-shadow: 0 20px 40px rgba(0,0,0,.4);
            z-index: 2000;
            animation: slideUp 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .toast.success { border-left: 4px solid #00ffa3; }
        .toast.error { border-left: 4px solid #ff6b6b; }
        .toast.info { border-left: 4px solid #00d4ff; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .balance-card .balance-amount { font-size: 32px; }
            .pay-tabs button { padding: 10px 14px; font-size: 13px; }
            .chart-container { height: 140px; }
        }
    </style>
</head>
<body>
    <!-- ФОНОВЫЕ ЭФФЕКТЫ -->
    <div class="full-glass-backdrop"></div>
    <div class="bg-grid"></div>
    <canvas id="bgCanvas"></canvas>
    <div id="particles"></div>

    <!-- ШАПКА -->
    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00ffa3"/>
                                <stop offset="50%" stop-color="#00d4ff"/>
                                <stop offset="100%" stop-color="#1f6bff"/>
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="28" fill="url(#logoGrad)" opacity="0.15"/>
                        <g>
                            <circle cx="50" cy="50" r="40" stroke="url(#logoGrad)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.4"/>
                            <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" 
                                  stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
                            <circle cx="48" cy="48" r="3.5" fill="#ffffff"/>
                        </g>
                    </svg>
                </div>
                <div class="logo-text">
                    <h2>SFERA</h2>
                    <p id="logoSubtitle" data-i18n="logo_subtitle">Milli Sanly Platforma</p>
                </div>
            </a>

            <div class="header-right">
                <span class="user-info">👤 <strong id="username">User</strong></span>
                <button class="lang-btn" id="langBtn" type="button" aria-label="Переключение языка">TM</button>
                <button class="logout-btn" id="logoutBtn" data-i18n="logout">🚪 Çykmak</button>
                <!-- ПРЯМАЯ ССЫЛКА НА ДАШБОРД -->
                <a href="user-dashboard.html" id="backLink" class="btn-outline" style="padding:8px 16px; border-radius:12px; text-decoration:none;" data-i18n="back">← Yza</a>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <section class="pay-page">
        <div class="container">
            <div class="pay-header">
                <h1 data-i18n="page_title">💳 TM Pay</h1>
                <div class="actions">
                    <button class="btn btn-outline" id="refreshBtn" data-i18n="refresh">⟳ Täzele</button>
                </div>
            </div>

            <!-- График баланса -->
            <div class="chart-container">
                <canvas id="balanceChart"></canvas>
            </div>

            <!-- Баланс -->
            <div class="balance-card">
                <div>
                    <div class="balance-label" data-i18n="total_balance">Jemi balans</div>
                    <div>
                        <span class="balance-amount" id="totalBalance">0.00</span>
                        <span class="balance-currency">TMT</span>
                    </div>
                </div>
                <div style="text-align:right; font-size:14px; color:#bdd0df;">
                    <span data-i18n="wallet_id">Koşelge ID:</span> <span id="walletId">TM-1234-5678</span>
                </div>
            </div>

            <!-- Мультивалютный кошелёк -->
            <div class="wallet-grid" id="walletGrid"></div>

            <!-- Вкладки -->
            <div class="pay-tabs">
                <button class="active" data-tab="transfer" data-i18n="tab_transfer">Geçiriş</button>
                <button data-tab="international" data-i18n="tab_international">Daşarky</button>
                <button data-tab="history" data-i18n="tab_history">Taryh</button>
                <button data-tab="cards" data-i18n="tab_cards">Kartlar</button>
                <button data-tab="receive" data-i18n="tab_receive">Al</button>
            </div>

            <!-- Вкладка: внутренние переводы -->
            <div class="tab-content active" id="tab-transfer">
                <div class="transfer-form">
                    <form id="transferForm">
                        <div class="form-group">
                            <label for="transferCurrency" data-i18n="currency">Walýuta</label>
                            <select id="transferCurrency">
                                <option value="TMT">TMT</option>
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="RUB">RUB</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="recipientId" data-i18n="recipient">Alýan (email, telefon ýa-da ID)</label>
                            <input type="text" id="recipientId" placeholder="mysal@mail.com ýa-da +993 63 000000" required />
                        </div>
                        <div class="form-group">
                            <label for="transferAmount" data-i18n="amount">Mukdar</label>
                            <input type="number" id="transferAmount" step="0.01" min="0.01" required placeholder="100.00" />
                        </div>
                        <div class="form-group">
                            <label for="transferDesc" data-i18n="description">Düşündiriş</label>
                            <textarea id="transferDesc" placeholder="Geçiriş sebäbi..."></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="transferBtn" data-i18n="send">Iber</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Вкладка: международные переводы -->
            <div class="tab-content" id="tab-international">
                <div class="transfer-form">
                    <form id="internationalForm">
                        <div class="form-group">
                            <label for="intCurrency" data-i18n="currency">Walýuta</label>
                            <select id="intCurrency">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="GBP">GBP</option>
                                <option value="TMT">TMT</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="intCountry" data-i18n="country">Ýurt</label>
                            <input type="text" id="intCountry" placeholder="Türkiýe, ABŞ, Germaniýa..." required />
                        </div>
                        <div class="form-group">
                            <label for="intBank" data-i18n="bank">Bank</label>
                            <input type="text" id="intBank" placeholder="Bank ady" required />
                        </div>
                        <div class="form-group">
                            <label for="intAccount" data-i18n="account_number">Hasap belgisi (IBAN / SWIFT)</label>
                            <input type="text" id="intAccount" placeholder="IBAN ýa-da SWIFT kody" required />
                        </div>
                        <div class="form-group">
                            <label for="intAmount" data-i18n="amount">Mukdar</label>
                            <input type="number" id="intAmount" step="0.01" min="0.01" required placeholder="100.00" />
                        </div>
                        <div class="form-group">
                            <label for="intDesc" data-i18n="description">Düşündiriş</label>
                            <textarea id="intDesc" placeholder="Geçiriş sebäbi..."></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="intTransferBtn" data-i18n="send_international">Daşarky geçir</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Вкладка: история -->
            <div class="tab-content" id="tab-history">
                <div class="filter-bar">
                    <label for="txFilter" data-i18n="filter_type">Görnüşi:</label>
                    <select id="txFilter">
                        <option value="all" data-i18n="all">Ählisi</option>
                        <option value="credit" data-i18n="filter_credit">Gelen</option>
                        <option value="debit" data-i18n="filter_debit">Çykdajy</option>
                        <option value="transfer" data-i18n="filter_transfer">Geçiriş</option>
                        <option value="international" data-i18n="filter_international">Daşarky</option>
                    </select>
                </div>
                <ul class="transactions-list" id="transactionsList"></ul>
                <div class="empty-state" id="emptyTx" style="display:none;">
                    <div class="icon">📭</div>
                    <p data-i18n="no_transactions">Hiç hili amal ýok</p>
                </div>
            </div>

            <!-- Вкладка: карты -->
            <div class="tab-content" id="tab-cards">
                <div id="cardsContainer" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap:16px;"></div>
                <div style="margin-top:20px;">
                    <button class="btn btn-outline" id="addCardBtn" data-i18n="add_card">+ Täze kart</button>
                </div>
            </div>

            <!-- Вкладка: получение платежей (QR) -->
            <div class="tab-content" id="tab-receive">
                <div class="qr-container">
                    <div style="font-size:18px; font-weight:600; margin-bottom:12px;" data-i18n="receive_qr">Töleg almak üçin QR kody</div>
                    <img id="qrCodeImage" src="" alt="QR code" style="width:150px; height:150px;" />
                    <div style="margin-top:12px; color:#9fb5c8; word-break:break-all;" id="qrDataText">TM-1234-5678</div>
                    <button class="btn btn-outline" id="copyQrDataBtn" style="margin-top:8px;" data-i18n="copy_address">Kopiýa</button>
                </div>
            </div>

        </div>
    </section>

    <!-- СКРИПТ АВТОПЕРЕВОДА -->
    <script src="auto_translate_i18n.js"></script>

    <script>
        // ============================================================
        // ПЕРЕВОДЫ (с дефолтным туркменским языком)
        // ============================================================
        const translations = {
            tm: {
                logo_subtitle: "Milli Sanly Platforma",

                add_card: "+ Täze kart",

                card_cvv: "CVV",
                card_holder: "Eýesi",
                transfer_success: "Geçiriş üstünlikli tamamlandy!",
                transfer_error: "Geçiriş baş tutmady.",
                insufficient: "Balans ýeterlik däl.",
                invalid_recipient: "Alýanyň maglumatlary ýalňyş.",

                filter_type: "Görnüşi:",

                filter_debit: "Çykdajy",
                filter_transfer: "Geçiriş",
                filter_international: "Daşarky"
            },
            ru: {
                logo_subtitle: "Национальная Цифровая Платформа",
                logout: "🚪 Выйти",
                back: "← Назад",
                refresh: "⟳ Обновить",
                page_title: "💳 TM Pay",
                total_balance: "Общий баланс",
                wallet_id: "ID кошелька:",
                tab_transfer: "Перевод",

                transfer_success: "Перевод выполнен успешно!",
                transfer_error: "Ошибка перевода.",
                insufficient: "Недостаточно средств.",
                invalid_recipient: "Неверные данные получателя.",
                invalid_amount: "Некорректная сумма.",
                receive_qr: "QR-код для получения платежа",
                copy_address: "Копировать",
                filter_type: "Тип:",
                all: "Все",
                filter_credit: "Поступления",
                filter_debit: "Расходы",
                filter_transfer: "Переводы",

            },
            en: {
                logo_subtitle: "National Digital Platform",
                logout: "🚪 Logout",
                back: "← Back",
                refresh: "⟳ Refresh",
                page_title: "💳 TM Pay",
                total_balance: "Total balance",
                wallet_id: "Wallet ID:",
                tab_transfer: "Transfer",
                tab_international: "International",
                tab_history: "History",
                tab_cards: "Cards",
                tab_receive: "Receive",
                currency: "Currency",
                recipient: "Recipient",
                amount: "Amount",
                description: "Description",
                send: "Send",
                send_international: "Send international",
                country: "Country",
                bank: "Bank",
                account_number: "Account number",
                no_transactions: "No transactions",
                add_card: "+ Add card",
                card_number: "Card number",
                card_expiry: "Expiry date",
                card_cvv: "CVV",
                card_holder: "Card holder",
                transfer_success: "Transfer successful!",
                transfer_error: "Transfer failed.",
                insufficient: "Insufficient balance.",
                invalid_recipient: "Invalid recipient data.",
                invalid_amount: "Invalid amount.",
                receive_qr: "QR code for receiving payment",
                copy_address: "Copy",
                filter_type: "Type:",
                all: "All",
                filter_credit: "Income",
                filter_debit: "Expense",
                filter_transfer: "Transfers",
                filter_international: "International"
            }
        };

        // ============================================================
        // ЯЗЫК ПО УМОЛЧАНИЮ: TM
        // ============================================================
        let currentLang = localStorage.getItem('sphere_lang') || 'tm';
        if (!translations[currentLang]) currentLang = 'tm';

        function setLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    if (el.tagName === 'INPUT' && el.getAttribute('placeholder')) {
                        el.placeholder = translations[lang][key];
                    } else {
                        el.textContent = translations[lang][key];
                    }
                }
            });

            const langBtn = document.getElementById('langBtn');
            if (langBtn) {
                langBtn.textContent = lang === 'tm' ? 'TM' : lang.toUpperCase();
            }

            localStorage.setItem('sphere_lang', lang);
            updateUI();
        }

        function updateUI() {
            document.querySelectorAll('.pay-tabs button').forEach(btn => {
                const key = btn.dataset.i18n;
                if (translations[currentLang][key]) btn.textContent = translations[currentLang][key];
            });
            renderWallets();
            renderTransactions();
            renderCards();
            updateQR();
        }

        // КЛИК КНОПКИ ПЕРЕВОДА: TM -> RU -> EN -> TM
        document.getElementById('langBtn').addEventListener('click', function() {
            const cycle = ['tm', 'ru', 'en'];
            let idx = cycle.indexOf(currentLang);
            idx = (idx + 1) % cycle.length;
            setLanguage(cycle[idx]);
        });

        // ============================================================
        // АВТОРИЗАЦИЯ И НАВИГАЦИЯ
        // ============================================================
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        let user = {};
        try {
            user = JSON.parse(localStorage.getItem('user') || '{}');
        } catch(e) {
            user = {};
        }

        document.getElementById('username').textContent = user.username || 'User';

        // НАДЕЖНЫЙ ПЕРЕХОД ПО КНОПКЕ "НАЗАД"
        const backLink = document.getElementById('backLink');
        if (user && user.role === 'admin') {
            backLink.href = 'admin.html';
        } else {
            backLink.href = 'user-dashboard.html';
        }

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });

        // ============================================================
        // ДАННЫЕ (localStorage)
        // ============================================================
        let wallets = [];
        let transactions = [];
        let cards = [];
        let balanceHistory = [];
        let chart = null;

        const WALLETS_KEY = 'tm_pay_wallets';
        const TRANSACTIONS_KEY = 'tm_pay_transactions';
        const CARDS_KEY = 'tm_pay_cards';

        function loadData() {
            const storedWallets = localStorage.getItem(WALLETS_KEY);
            if (storedWallets) {
                try { wallets = JSON.parse(storedWallets); } catch(e) { wallets = []; }
            }
            if (!wallets || wallets.length === 0) {
                wallets = [
                    { currency: 'TMT', balance: 12500.75 },
                    { currency: 'USD', balance: 500.50 },
                    { currency: 'EUR', balance: 320.00 },
                    { currency: 'RUB', balance: 15000.00 }
                ];
                saveWallets();
            }

            const storedTx = localStorage.getItem(TRANSACTIONS_KEY);
            if (storedTx) {
                try { transactions = JSON.parse(storedTx); } catch(e) { transactions = []; }
            }
            if (!transactions || transactions.length === 0) {
                transactions = [
                    { id: 'tx1', type: 'transfer', from: 'TMT', to: 'USD', amount: 200, description: 'Aýlyk geçiriş', date: new Date(Date.now() - 3600000 * 2).toISOString(), status: 'completed' },
                    { id: 'tx2', type: 'debit', from: 'TMT', to: 'external', amount: 150, description: 'Haryt satyn almak', date: new Date(Date.now() - 3600000 * 5).toISOString(), status: 'completed' },
                    { id: 'tx3', type: 'credit', from: 'external', to: 'TMT', amount: 300, description: 'Aýlyk girdeji', date: new Date(Date.now() - 3600000 * 24).toISOString(), status: 'completed' }
                ];
                saveTransactions();
            }

            const storedCards = localStorage.getItem(CARDS_KEY);
            if (storedCards) {
                try { cards = JSON.parse(storedCards); } catch(e) { cards = []; }
            }
            if (!cards || cards.length === 0) {
                cards = [
                    { id: 'c1', type: 'Visa', number: '**** 1234', expiry: '12/28', holder: user.username || 'User' },
                    { id: 'c2', type: 'Mastercard', number: '**** 5678', expiry: '06/27', holder: user.username || 'User' }
                ];
                saveCards();
            }

            generateBalanceHistory();
        }

        function saveWallets() { localStorage.setItem(WALLETS_KEY, JSON.stringify(wallets)); }
        function saveTransactions() { localStorage.setItem(TRANSACTIONS_KEY, JSON.stringify(transactions)); }
        function saveCards() { localStorage.setItem(CARDS_KEY, JSON.stringify(cards)); }

        function generateBalanceHistory() {
            balanceHistory = [];
            const now = Date.now();
            let total = getTotalBalance();
            for (let i = 6; i >= 0; i--) {
                const date = new Date(now - i * 24 * 3600000);
                const variation = (Math.random() - 0.5) * 200;
                balanceHistory.push({ date: date.toISOString(), value: Math.max(0, total + variation) });
            }
        }

        function getTotalBalance() {
            const rates = { TMT: 1, USD: 3.5, EUR: 3.8, RUB: 0.04 };
            return wallets.reduce((sum, w) => sum + (w.balance * (rates[w.currency] || 1)), 0);
        }

        function updateTotalBalance() {
            const total = getTotalBalance();
            document.getElementById('totalBalance').textContent = total.toFixed(2);
            renderChart();
        }

        // ============================================================
        // ГРАФИК
        // ============================================================
        function renderChart() {
            const ctx = document.getElementById('balanceChart').getContext('2d');
            if (chart) chart.destroy();
            const labels = balanceHistory.map(d => new Date(d.date).toLocaleDateString());
            const data = balanceHistory.map(d => d.value);
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Balans (TMT)',
                        data: data,
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0,212,255,0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#bdd0df' } } },
                    scales: {
                        x: { ticks: { color: '#9fb5c8', maxTicksLimit: 7 } },
                        y: { ticks: { color: '#9fb5c8' } }
                    }
                }
            });
        }

        function renderWallets() {
            const container = document.getElementById('walletGrid');
            container.innerHTML = wallets.map(w => `
                <div class="wallet-item">
                    <div class="currency">${w.currency}</div>
                    <div class="amount">${w.balance.toFixed(2)}</div>
                </div>
            `).join('');
        }

        function renderTransactions() {
            const filter = document.getElementById('txFilter').value;
            let filtered = transactions;
            if (filter !== 'all') {
                filtered = transactions.filter(tx => tx.type === filter);
            }
            const list = document.getElementById('transactionsList');
            const empty = document.getElementById('emptyTx');
            if (!filtered.length) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            const sorted = [...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));
            list.innerHTML = sorted.map(tx => {
                const isCredit = tx.type === 'credit';
                const sign = isCredit ? '+' : '-';
                const amountClass = isCredit ? 'positive' : 'negative';
                return `
                    <li>
                        <span>
                            <span class="tx-type ${tx.type}">${tx.type}</span>
                            <span class="tx-description">${tx.description || ''}</span>
                        </span>
                        <span>
                            <span class="tx-amount ${amountClass}">${sign} ${Math.abs(tx.amount).toFixed(2)} ${tx.from}</span>
                            <span class="tx-date">${new Date(tx.date).toLocaleDateString()}</span>
                        </span>
                    </li>
                `;
            }).join('');
        }

        document.getElementById('txFilter').addEventListener('change', renderTransactions);

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            if (!cards.length) {
                container.innerHTML = '<div class="empty-state"><div class="icon">💳</div><p data-i18n="no_cards">Kartlar ýok</p></div>';
                return;
            }
            container.innerHTML = cards.map(c => `
                <div style="background:rgba(255,255,255,.035); border:1px solid var(--glass-border); border-radius:16px; padding:20px;">
                    <div style="font-size:12px; color:#00d4ff;">${c.type}</div>
                    <div style="font-size:20px; font-weight:600; margin:8px 0;">${c.number}</div>
                    <div style="font-size:14px; color:#bdd0df;">${c.holder}</div>
                    <div style="font-size:12px; color:#9fb5c8;">Işleýän çenli: ${c.expiry}</div>
                </div>
            `).join('');
        }

        function updateQR() {
            const walletId = document.getElementById('walletId').textContent;
            const qrData = `TM Pay:${walletId}`;
            document.getElementById('qrDataText').textContent = qrData;
            document.getElementById('qrCodeImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(qrData)}`;
        }

        document.getElementById('copyQrDataBtn').addEventListener('click', function() {
            navigator.clipboard.writeText(document.getElementById('qrDataText').textContent).then(() => {
                showToast('Kopiýalandy!', 'success');
            });
        });

        // ПЕРЕВОДЫ И ФОРМЫ
        document.getElementById('transferForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const currency = document.getElementById('transferCurrency').value;
            const recipient = document.getElementById('recipientId').value.trim();
            const amount = parseFloat(document.getElementById('transferAmount').value);
            const desc = document.getElementById('transferDesc').value.trim();

            const wallet = wallets.find(w => w.currency === currency);
            if (!wallet || wallet.balance < amount) {
                showToast(translations[currentLang].insufficient, 'error');
                return;
            }
            wallet.balance -= amount;
            saveWallets();

            transactions.push({
                id: 'tx' + Date.now(),
                type: 'transfer',
                from: currency,
                to: recipient,
                amount: amount,
                description: desc || 'Içki geçiriş',
                date: new Date().toISOString()
            });
            saveTransactions();

            updateTotalBalance();
            renderWallets();
            renderTransactions();
            showToast(translations[currentLang].transfer_success, 'success');
            this.reset();
        });

        document.getElementById('addCardBtn').addEventListener('click', function() {
            cards.push({
                id: 'c' + Date.now(),
                type: 'Visa',
                number: '**** ' + Math.floor(1000 + Math.random() * 9000),
                expiry: '12/' + (new Date().getFullYear() + 3).toString().slice(-2),
                holder: user.username || 'User'
            });
            saveCards();
            renderCards();
            showToast('Täze kart goşuldy!', 'success');
        });

        document.getElementById('refreshBtn').addEventListener('click', function() {
            renderWallets();
            renderTransactions();
            renderCards();
            updateTotalBalance();
            updateQR();
            showToast('Täzelendi!', 'success');
        });

        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // ВКЛАДКИ
        document.querySelectorAll('.pay-tabs button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.pay-tabs button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const tab = this.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.getElementById('tab-' + tab).classList.add('active');
                if (tab === 'history') renderTransactions();
                if (tab === 'cards') renderCards();
                if (tab === 'receive') updateQR();
            });
        });

        // ============================================================
        // ИНТЕРАКТИВНЫЕ ЧАСТИЦЫ И НЕЙРОСЕТЕВОЙ CANVAS
        // ============================================================
        const particlesContainer = document.getElementById("particles");
        if (particlesContainer) {
            particlesContainer.innerHTML = "";
            const colors = ['#00d4ff', '#00ffa3', '#1f6bff', '#ffffff'];
            for (let i = 0; i < 60; i++) {
                const particle = document.createElement("div");
                particle.className = "particle";
                const size = Math.random() * 2.2 + 1.0;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particle.style.width = size + "px";
                particle.style.height = size + "px";
                particle.style.backgroundColor = color;
                particle.style.boxShadow = `0 0 ${size * 3}px ${color}`;
                particle.style.left = (Math.random() * 92 + 4) + "%";
                particle.style.animationDuration = (10 + Math.random() * 12) + "s";
                particle.style.animationDelay = (Math.random() * -20) + "s";
                particlesContainer.appendChild(particle);
            }
        }

        const canvas = document.getElementById('bgCanvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            let w, h;
            function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
            resize();
            window.addEventListener('resize', resize);

            const points = Array.from({ length: 50 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.6,
                vy: (Math.random() - 0.5) * 0.6,
                radius: Math.random() * 1.2 + 0.8
            }));

            function drawCanvas() {
                ctx.clearRect(0, 0, w, h);
                for (let i = 0; i < points.length; i++) {
                    let p = points[i];
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;

                    for (let j = i + 1; j < points.length; j++) {
                        let p2 = points[j];
                        let dx = p.x - p2.x, dy = p.y - p2.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 180) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(0, 212, 255, ${0.18 * (1 - dist / 180)})`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0, 255, 163, 0.85)';
                    ctx.fill();
                }
                requestAnimationFrame(drawCanvas);
            }
            drawCanvas();
        }

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        loadData();
        setLanguage(currentLang);
        updateTotalBalance();
        renderWallets();
        renderTransactions();
        renderCards();
        updateQR();
    </script>
</body>
