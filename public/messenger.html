<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>СФЕРА — Messenger</title>

    <!-- Общий CSS -->
    <link rel="stylesheet" href="/css/style.css" />

    <style>
        /* ===== СПЕЦИФИЧНЫЕ СТИЛИ ДЛЯ МЕССЕНДЖЕРА (с улучшениями) ===== */
        .messenger-page {
            padding: 140px 0 60px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .messenger-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 200px);
            min-height: 500px;
            border-radius: 24px;
            overflow: hidden;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.08);
            backdrop-filter: blur(12px);
            transition: background 0.3s, border-color 0.3s;
        }
        /* Тёмная тема */
        .messenger-container.light-theme {
            background: rgba(255,255,255,.1);
            border-color: rgba(255,255,255,.2);
        }
        .messenger-container.light-theme .messenger-sidebar {
            background: rgba(255,255,255,.15);
        }
        .messenger-container.light-theme .dialog-item:hover {
            background: rgba(255,255,255,.2);
        }
        .messenger-container.light-theme .message.received {
            background: rgba(255,255,255,.15);
            color: #000;
        }
        .messenger-container.light-theme .message.sent {
            background: linear-gradient(135deg, #00aaff, #0066cc);
        }
        .messenger-container.light-theme .chat-header {
            background: rgba(255,255,255,.1);
        }
        .messenger-container.light-theme .chat-input-area {
            background: rgba(255,255,255,.05);
        }
        .messenger-container.light-theme .dialog-info .name,
        .messenger-container.light-theme .chat-name {
            color: #000;
        }
        .messenger-container.light-theme .dialog-info .last-msg,
        .messenger-container.light-theme .chat-status {
            color: #555;
        }

        /* Левая панель */
        .messenger-sidebar {
            width: 320px;
            min-width: 280px;
            background: rgba(0,0,0,.2);
            border-right: 1px solid rgba(255,255,255,.08);
            display: flex;
            flex-direction: column;
            transition: background 0.3s;
        }
        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sidebar-header .left-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header h2 {
            font-size: 18px;
            font-weight: 700;
        }
        .sidebar-header .theme-toggle {
            background: transparent;
            border: 1px solid rgba(255,255,255,.2);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: .2s;
        }
        .sidebar-header .theme-toggle:hover {
            background: rgba(255,255,255,.05);
        }
        .sidebar-header .dropdown-tabs {
            position: relative;
            display: inline-block;
        }
        .sidebar-header .dropdown-tabs .dropbtn {
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.15);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sidebar-header .dropdown-tabs .dropbtn:hover {
            background: rgba(255,255,255,.15);
        }
        .sidebar-header .dropdown-tabs .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: rgba(13,28,41,.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px;
            min-width: 140px;
            box-shadow: 0 15px 40px rgba(0,0,0,.4);
            z-index: 100;
            padding: 6px 0;
            margin-top: 6px;
        }
        .sidebar-header .dropdown-tabs .dropdown-content button {
            background: transparent;
            border: none;
            color: #bdd0df;
            padding: 10px 20px;
            width: 100%;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: .2s;
        }
        .sidebar-header .dropdown-tabs .dropdown-content button:hover {
            background: rgba(255,255,255,.05);
            color: white;
        }
        .sidebar-header .dropdown-tabs .dropdown-content button.active {
            color: #00d4ff;
            background: rgba(0,212,255,.05);
        }
        .sidebar-header .dropdown-tabs.show .dropdown-content {
            display: block;
        }

        .sidebar-search {
            padding: 12px 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .sidebar-search input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.05);
            color: white;
            font-size: 14px;
            outline: none;
            transition: .3s;
            min-width: 120px;
        }
        .sidebar-search input:focus {
            border-color: #00d4ff;
        }
        .sidebar-search input::placeholder {
            color: #9fb5c8;
        }
        .sidebar-search .create-group-btn {
            padding: 10px 16px;
            background: rgba(0,212,255,.15);
            border: 1px solid rgba(0,212,255,.3);
            border-radius: 12px;
            color: #00d4ff;
            cursor: pointer;
            font-weight: 600;
            transition: .2s;
            white-space: nowrap;
        }
        .sidebar-search .create-group-btn:hover {
            background: rgba(0,212,255,.25);
        }

        .dialogs-list,
        .news-feed {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .dialog-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            cursor: pointer;
            transition: .2s;
            border-left: 3px solid transparent;
            gap: 12px;
        }
        .dialog-item:hover {
            background: rgba(255,255,255,.05);
        }
        .dialog-item.active {
            background: rgba(0,212,255,.08);
            border-left-color: #00d4ff;
        }
        .dialog-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,212,255,.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: #00d4ff;
            flex-shrink: 0;
            position: relative;
        }
        .dialog-avatar.group {
            background: rgba(255,200,0,.2);
            color: #ffc800;
        }
        .dialog-avatar .online-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ffa3;
            border: 2px solid #08131d;
            position: absolute;
            bottom: 0;
            right: 0;
        }
        .dialog-info {
            flex: 1;
            min-width: 0;
        }
        .dialog-info .name {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dialog-info .last-msg {
            font-size: 13px;
            color: #9fb5c8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dialog-time {
            font-size: 11px;
            color: #6b7f94;
            flex-shrink: 0;
        }
        .unread-badge {
            background: #00d4ff;
            color: #08131d;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            min-width: 20px;
            text-align: center;
        }

        /* Новости */
        .news-item {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,.06);
            cursor: pointer;
            transition: .15s;
        }
        .news-item:hover {
            background: rgba(255,255,255,.03);
        }
        .news-item .title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .news-item .summary {
            font-size: 14px;
            color: #bdd0df;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .news-item .meta {
            font-size: 12px;
            color: #9fb5c8;
            margin-top: 6px;
            display: flex;
            gap: 12px;
        }
        .news-item .image-placeholder {
            margin-top: 8px;
            background: rgba(255,255,255,.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            font-size: 40px;
            color: #9fb5c8;
        }

        /* Правая панель (чат) */
        .messenger-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,.1);
        }
        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0,0,0,.15);
            min-height: 70px;
            flex-wrap: wrap;
        }
        .chat-header .back-btn {
            display: none;
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .chat-header .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,212,255,.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #00d4ff;
        }
        .chat-header .chat-name {
            font-weight: 700;
            font-size: 18px;
        }
        .chat-header .chat-status {
            font-size: 13px;
            color: #9fb5c8;
        }
        .chat-header .chat-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }
        .chat-header .chat-actions button {
            width: 34px !important;
            height: 34px !important;
            font-size: 15px !important;
            border-radius: 50% !important;
            background: transparent !important;
            border: 1px solid rgba(255,255,255,.15) !important;
            color: #9fb5c8 !important;
            cursor: pointer !important;
            transition: .2s !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
        }
        .chat-header .chat-actions button:hover {
            background: rgba(255,255,255,.05) !important;
            border-color: #00d4ff !important;
            color: white !important;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }
        .message.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff, #008cff);
            color: white;
            border-bottom-right-radius: 6px;
        }
        .message.received {
            align-self: flex-start;
            background: rgba(255,255,255,.08);
            color: white;
            border-bottom-left-radius: 6px;
        }
        .message .msg-time {
            font-size: 11px;
            color: rgba(255,255,255,.5);
            margin-top: 4px;
            text-align: right;
        }
        .message.received .msg-time {
            color: #9fb5c8;
        }
        .message .msg-username {
            font-size: 12px;
            font-weight: 600;
            color: #00d4ff;
            margin-bottom: 4px;
        }
        .message .file-attachment {
            display: inline-block;
            background: rgba(255,255,255,.1);
            padding: 6px 12px;
            border-radius: 8px;
            margin-top: 6px;
            font-size: 13px;
        }
        .message .file-attachment a {
            color: #00d4ff;
            text-decoration: none;
        }

        .typing-indicator {
            align-self: flex-start;
            font-size: 14px;
            color: #9fb5c8;
            padding: 8px 16px;
            background: rgba(255,255,255,.05);
            border-radius: 18px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .chat-input-area {
            padding: 16px 24px;
            border-top: 1px solid rgba(255,255,255,.08);
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,.1);
            align-items: center;
            flex-wrap: wrap;
        }
        .chat-input-area .input-group {
            flex: 1;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            min-width: 200px;
        }
        .chat-input-area .input-group input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.05);
            color: white;
            font-size: 15px;
            outline: none;
            transition: .3s;
            min-width: 120px;
        }
        .chat-input-area .input-group input:focus {
            border-color: #00d4ff;
        }
        .chat-input-area .input-group input::placeholder {
            color: #9fb5c8;
        }
        .chat-input-area .input-group .emoji-btn,
        .chat-input-area .input-group .file-btn {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            transition: .2s;
            padding: 4px 6px;
            color: #9fb5c8;
        }
        .chat-input-area .input-group .emoji-btn:hover,
        .chat-input-area .input-group .file-btn:hover {
            color: white;
        }
        .chat-input-area .call-buttons {
            display: flex;
            gap: 6px;
        }
        .chat-input-area .call-buttons button {
            width: 38px !important;
            height: 38px !important;
            font-size: 18px !important;
            border-radius: 50% !important;
            background: transparent !important;
            border: 1px solid rgba(255,255,255,.2) !important;
            color: white !important;
            cursor: pointer !important;
            transition: .2s !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
        }
        .chat-input-area .call-buttons button:hover {
            background: rgba(255,255,255,.1) !important;
            border-color: #00d4ff !important;
        }
        .chat-input-area .send-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(135deg, #00d4ff, #008cff);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }
        .chat-input-area .send-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0,212,255,.3);
        }
        .chat-input-area .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Emoji picker */
        .emoji-picker {
            display: none;
            position: absolute;
            bottom: 70px;
            left: 20px;
            background: rgba(13,28,41,.95);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 16px;
            padding: 16px;
            width: 280px;
            max-height: 200px;
            overflow-y: auto;
            backdrop-filter: blur(12px);
            z-index: 200;
            box-shadow: 0 15px 40px rgba(0,0,0,.4);
        }
        .emoji-picker.active {
            display: block;
        }
        .emoji-picker .emoji-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .emoji-picker .emoji-grid button {
            background: transparent;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            transition: .15s;
            border-radius: 8px;
        }
        .emoji-picker .emoji-grid button:hover {
            background: rgba(255,255,255,.1);
        }

        /* Модалка создания группы */
        .group-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,.6);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .group-modal.active {
            display: flex;
        }
        .group-modal .modal-box {
            background: rgba(13,28,41,.98);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 24px;
            padding: 30px 35px;
            max-width: 400px;
            width: 95%;
            box-shadow: 0 30px 80px rgba(0,0,0,.6);
        }
        .group-modal .modal-box h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        .group-modal .modal-box .form-group {
            margin-bottom: 16px;
        }
        .group-modal .modal-box .form-group label {
            display: block;
            font-size: 14px;
            color: #dbe9ff;
            margin-bottom: 4px;
        }
        .group-modal .modal-box .form-group input,
        .group-modal .modal-box .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.05);
            color: white;
            font-size: 15px;
            outline: none;
        }
        .group-modal .modal-box .form-group input:focus {
            border-color: #00d4ff;
        }
        .group-modal .modal-box .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .group-modal .modal-box .form-actions button {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }
        .group-modal .modal-box .form-actions .btn-create {
            background: linear-gradient(135deg, #00d4ff, #008cff);
            color: white;
        }
        .group-modal .modal-box .form-actions .btn-cancel {
            background: transparent;
            border: 1px solid rgba(255,255,255,.2);
            color: white;
        }

        .empty-chat {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #9fb5c8;
            text-align: center;
            padding: 40px;
        }
        .empty-chat .icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .empty-chat h3 {
            font-size: 22px;
            color: white;
            margin-bottom: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #9fb5c8;
        }
        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        /* Тосты (приводим к общему дизайну) */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(13,28,41,.9) !important;
            backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(0,212,255,.3) !important;
            border-radius: 16px !important;
            padding: 14px 24px !important;
            color: white !important;
            font-weight: 500 !important;
            box-shadow: 0 20px 40px rgba(0,0,0,.4) !important;
            z-index: 2000 !important;
            animation: slideUp 0.3s ease !important;
        }
        .toast.success { border-left: 4px solid #00ffa3; }
        .toast.error { border-left: 4px solid #ff6b6b; }
        .toast.info { border-left: 4px solid #00d4ff; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 992px) {
            .messenger-sidebar { width: 260px; min-width: 220px; }
        }
        @media (max-width: 768px) {
            .messenger-container { flex-direction: column; height: auto; min-height: 600px; }
            .messenger-sidebar {
                width: 100%;
                min-width: unset;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,.08);
                max-height: 300px;
            }
            .chat-header .back-btn { display: block; }
            .message { max-width: 90%; }
            .chat-input-area { flex-wrap: wrap; justify-content: center; }
            .chat-input-area .input-group input { min-width: 100%; }
            .emoji-picker { left: 10px; width: 250px; }
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <!-- ШАПКА (единая) -->
    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00ffa3"/>
                                <stop offset="50%" stop-color="#00d4ff"/>
                                <stop offset="100%" stop-color="#1f6bff"/>
                            </linearGradient>
                            <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
                                <feGaussianBlur stdDeviation="4" result="blur"/>
                                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                            </filter>
                        </defs>
                        <circle cx="50" cy="50" r="28" fill="url(#logoGrad)" opacity="0.15" filter="url(#logoGlow)"/>
                        <g filter="url(#logoGlow)">
                            <circle cx="50" cy="50" r="40" stroke="url(#logoGrad)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.4"/>
                            <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
                            <circle cx="48" cy="48" r="3.5" fill="#ffffff" filter="url(#logoGlow)"/>
                        </g>
                    </svg>
                </div>
                <div class="logo-text">
                    <h2>SFERA</h2>
                    <p id="logoSubtitle" data-i18n="logo_subtitle">Milli Sanly Platforma</p>
                </div>
            </a>

            <div class="header-right">
                <span class="user-info">👤 <strong id="username">User</strong></span>
                <button class="lang" id="langBtn">RU</button>
                <button class="logout-btn" id="logoutBtn" data-i18n="logout">🚪 Çykmak</button>

        // ============================================================
        // УСТАНОВКА ЯЗЫКА
        // ============================================================
        let currentLang = localStorage.getItem('lang') || 'ru';

        function setLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    if (el.tagName === 'INPUT' && el.getAttribute('placeholder')) {
                        el.placeholder = translations[lang][key];
                    } else {
                        el.textContent = translations[lang][key];
                    }
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });
            // Обновляем тултипы (после смены языка)
            updateTitles();
            document.getElementById('langBtn').textContent = lang.toUpperCase();
            localStorage.setItem('lang', lang);
            updateUI();
        }

        function updateUI() {
            // Обновляем выпадающее меню
            document.querySelectorAll('#dropdownContent button').forEach(btn => {
                const key = btn.dataset.i18n;
                if (translations[currentLang][key]) btn.textContent = translations[currentLang][key];
            });
            const tabKey = 'tab_' + currentTab;
            document.getElementById('currentTabLabel').textContent = translations[currentLang][tabKey] || currentTab;
            // Тема
            const themeLabel = currentTheme === 'light' ? '☀️' : '🌙';
            document.getElementById('themeToggle').textContent = themeLabel;
            // Обновить статус
            if (currentDialogId) {
                document.getElementById('chatStatus').textContent = translations[currentLang].online;
            }
            // Приветствие помощника
            const welcomeMsg = document.querySelector('.chat-messages .msg.bot:first-child');
            if (welcomeMsg) {
                welcomeMsg.textContent = translations[currentLang].assistant_hello;
            }
            renderNews();
            renderDialogs(dialogs);
        }

        function updateTitles() {
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                if (translations[currentLang] && translations[currentLang][key]) {
                    el.title = translations[currentLang][key];
                }
            });
        }

        document.getElementById('langBtn').addEventListener('click', function() {
            const cycle = ['ru', 'tm', 'en'];
            let idx = cycle.indexOf(currentLang);
            idx = (idx + 1) % cycle.length;
            setLanguage(cycle[idx]);
        });

        // ============================================================
        // АВТОРИЗАЦИЯ И НАВИГАЦИЯ
        // ============================================================
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        const user = JSON.parse(localStorage.getItem('user') || '{"username":"User","role":"user"}');
        document.getElementById('username').textContent = user.username || 'User';

        const backLink = document.getElementById('backLink');
        if (user.role === 'admin') {
            backLink.href = 'admin-dashboard.html';
        } else {
            backLink.href = 'user-dashboard.html';
        }

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });

        // ============================================================
        // ТЕМА
        // ============================================================
        let currentTheme = localStorage.getItem('messenger_theme') || 'dark';
        const container = document.getElementById('messengerContainer');

        function applyTheme(theme) {
            currentTheme = theme;
            container.classList.toggle('light-theme', theme === 'light');
            document.getElementById('themeToggle').textContent = theme === 'light' ? '☀️' : '🌙';
            localStorage.setItem('messenger_theme', theme);
        }

        document.getElementById('themeToggle').addEventListener('click', function() {
            applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });
        applyTheme(currentTheme);

        // ============================================================
        // DROPDOWN МЕНЮ
        // ============================================================
        document.getElementById('dropbtn').addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('tabsDropdown').classList.toggle('show');
        });
        document.addEventListener('click', function() {
            document.getElementById('tabsDropdown').classList.remove('show');
        });

        // ============================================================
        // ВКЛАДКИ
        // ============================================================
        let currentTab = 'chats';
        let currentDialogId = null;
        let dialogs = [];
        let messages = {};
        let searchQuery = '';

        function switchTab(tab, updateLabel = true) {
            currentTab = tab;
            const dialogsList = document.getElementById('dialogsList');
            const newsFeed = document.getElementById('newsFeed');
            const searchInput = document.getElementById('searchInput');

            dialogsList.style.display = 'none';
            newsFeed.style.display = 'none';

            if (tab === 'chats') {
                dialogsList.style.display = 'block';
                searchInput.placeholder = translations[currentLang].search_placeholder;
                loadDialogs();
            } else if (tab === 'news') {
                newsFeed.style.display = 'block';
                searchInput.placeholder = translations[currentLang].search_placeholder || 'Gözleg...';
                renderNews();
            } else if (tab === 'assistant') {
                dialogsList.style.display = 'block';
                searchInput.placeholder = translations[currentLang].search_placeholder;
                const assistantId = 'assistant';
                const assistantName = translations[currentLang].assistant_name;
                let existing = dialogs.find(d => d.id === assistantId);
                if (!existing) {
                    dialogs.unshift({
                        id: assistantId,
                        name: assistantName,
                        lastMessage: translations[currentLang].assistant_hello,
                        time: new Date().toISOString(),
                        unread: 1,
                        isGroup: false
                    });
                    saveDialogs();
                }
                renderDialogs(dialogs);
                openChat(assistantId, assistantName, 'assistant');
            }

            document.querySelectorAll('#dropdownContent button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            if (updateLabel) {
                const tabKey = 'tab_' + tab;
                document.getElementById('currentTabLabel').textContent = translations[currentLang][tabKey] || tab;
            }
        }

        document.querySelectorAll('#dropdownContent button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                document.getElementById('tabsDropdown').classList.remove('show');
                switchTab(this.dataset.tab);
            });
        });

        // ============================================================
        // РАБОТА С ДАННЫМИ (localStorage)
        // ============================================================
        function loadDialogs() {
            const stored = localStorage.getItem('messenger_dialogs');
            if (stored) {
                try { dialogs = JSON.parse(stored); } catch(e) { dialogs = []; }
            }
            if (dialogs.length === 0) {
                dialogs = [
                    { id: '1', name: 'Aýdar', lastMessage: 'Salam!', time: new Date().toISOString(), unread: 2, isGroup: false },
                    { id: '2', name: 'Meret', lastMessage: 'Nähili?', time: new Date(Date.now() - 3600000).toISOString(), unread: 0, isGroup: false },
                    { id: '3', name: 'Gülşat', lastMessage: 'Gepleşeliň!', time: new Date(Date.now() - 7200000).toISOString(), unread: 5, isGroup: false },
                    { id: '4', name: 'Saparmyrat', lastMessage: 'Habar bar', time: new Date(Date.now() - 86400000).toISOString(), unread: 0, isGroup: false }
                ];
                saveDialogs();
            }
            // Загружаем сообщения для каждого диалога
            dialogs.forEach(d => {
                const msgs = localStorage.getItem('messenger_messages_' + d.id);
                if (msgs) {
                    try { messages[d.id] = JSON.parse(msgs); } catch(e) { messages[d.id] = []; }
                } else {
                    messages[d.id] = [];
                }
            });
            // Обновим список участников для модалки группы
            populateGroupMembers();
            renderDialogs(dialogs);
        }

        function saveDialogs() {
            localStorage.setItem('messenger_dialogs', JSON.stringify(dialogs));
        }

        function saveMessages(dialogId) {
            if (messages[dialogId]) {
                localStorage.setItem('messenger_messages_' + dialogId, JSON.stringify(messages[dialogId]));
            }
        }

        function renderDialogs(dialogsList) {
            const listEl = document.getElementById('dialogsList');
            let filtered = dialogsList;
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = dialogsList.filter(d => d.name.toLowerCase().includes(q));
            }
            if (!filtered || filtered.length === 0) {
                listEl.innerHTML = `<div class="empty-state" style="padding:30px 20px; text-align:center; color:#9fb5c8;">📭 ${translations[currentLang].no_messages || 'Hiç hili söhbet ýok'}</div>`;
                return;
            }
            listEl.innerHTML = filtered.map(d => {
                const time = d.time ? new Date(d.time) : new Date();
                const timeStr = time.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                const isActive = currentDialogId === d.id;
                const avatarClass = d.isGroup ? 'dialog-avatar group' : 'dialog-avatar';
                const avatarText = d.isGroup ? '👥' : d.name.charAt(0).toUpperCase();
                return `
                    <div class="dialog-item ${isActive ? 'active' : ''}" data-id="${d.id}" data-name="${d.name}">
                        <div class="${avatarClass}">${avatarText}</div>
                        <div class="dialog-info">
                            <div class="name">${d.name}</div>
                            <div class="last-msg">${d.lastMessage || ''}</div>
                        </div>
                        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
                            <span class="dialog-time">${timeStr}</span>
                            ${d.unread > 0 ? `<span class="unread-badge">${d.unread}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            listEl.querySelectorAll('.dialog-item').forEach(el => {
                el.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const name = this.dataset.name;
                    openChat(id, name, 'chats');
                });
                // Долгий клик для удаления
                let timer;
                el.addEventListener('mousedown', function(e) {
                    timer = setTimeout(() => {
                        const id = this.dataset.id;
                        if (confirm(translations[currentLang].confirm_delete)) {
                            deleteDialog(id);
                        }
                    }, 800);
                });
                el.addEventListener('mouseup', () => clearTimeout(timer));
                el.addEventListener('mouseleave', () => clearTimeout(timer));
            });
        }

        function deleteDialog(id) {
            dialogs = dialogs.filter(d => d.id !== id);
            delete messages[id];
            localStorage.removeItem('messenger_messages_' + id);
            saveDialogs();
            if (currentDialogId === id) {
                currentDialogId = null;
                document.getElementById('chatMessages').innerHTML = `
                    <div class="empty-chat">
                        <div class="icon">💬</div>
                        <h3>${translations[currentLang].select_chat}</h3>
                        <p>${translations[currentLang].select_chat_desc}</p>
                    </div>
                `;
                document.getElementById('chatName').textContent = translations[currentLang].select_chat;
                document.getElementById('chatStatus').textContent = '';
            }
            renderDialogs(dialogs);
            showToast(translations[currentLang].dialog_deleted, 'info');
        }

        // ============================================================
        // ГРУППОВЫЕ ЧАТЫ
        // ============================================================
        function populateGroupMembers() {
            const select = document.getElementById('groupMembers');
            const contacts = dialogs.filter(d => !d.isGroup && d.id !== 'assistant');
            select.innerHTML = contacts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
        }

        document.getElementById('createGroupBtn').addEventListener('click', function() {
            document.getElementById('groupModal').classList.add('active');
            populateGroupMembers();
        });

        document.getElementById('cancelGroupBtn').addEventListener('click', function() {
            document.getElementById('groupModal').classList.remove('active');
        });

        document.getElementById('groupModal').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });

        document.getElementById('groupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('groupName').value.trim();
            const selected = Array.from(document.getElementById('groupMembers').selectedOptions).map(opt => opt.text);
            if (!name) {
                showToast('Toparyň ady hökmany', 'error');
                return;
            }
            const newGroup = {
                id: 'group_' + Date.now(),
                name: name,
                lastMessage: 'Topar döredildi!',
                time: new Date().toISOString(),
                unread: 0,
                isGroup: true,
                members: selected
            };
            dialogs.push(newGroup);
            messages[newGroup.id] = [];
            saveDialogs();
            renderDialogs(dialogs);
            document.getElementById('groupModal').classList.remove('active');
            showToast('Topar döredildi!', 'success');
        });

        // ============================================================
        // ОТКРЫТИЕ ЧАТА
        // ============================================================
        function openChat(id, name, type = 'chats') {
            currentDialogId = id;
            document.getElementById('chatName').textContent = name;
            const avatar = document.getElementById('chatAvatar');
            const dialog = dialogs.find(d => d.id === id);
            if (dialog && dialog.isGroup) {
                avatar.textContent = '👥';
            } else {
                avatar.textContent = name.charAt(0).toUpperCase();
            }
            document.getElementById('chatStatus').textContent = translations[currentLang].online;

            // Сбросить непрочитанные
            if (dialog) {
                dialog.unread = 0;
                saveDialogs();
            }

            // Загрузить сообщения
            if (!messages[id]) messages[id] = [];
            renderMessages(id);
            // Обновить список диалогов
            renderDialogs(dialogs);
        }

        function renderMessages(dialogId) {
            const container = document.getElementById('chatMessages');
            const msgs = messages[dialogId] || [];
            if (!msgs || msgs.length === 0) {
                container.innerHTML = `<div class="empty-chat"><div class="icon">💬</div><h3>${translations[currentLang].no_messages}</h3></div>`;
                return;
            }
            container.innerHTML = msgs.map(msg => {
                const isSent = msg.from === 'user';
                const senderName = isSent ? '' : `<div class="msg-username">${msg.from}</div>`;
                const time = new Date(msg.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                let fileHtml = '';
                if (msg.file) {
                    fileHtml = `<div class="file-attachment">📎 <a href="${msg.file}" target="_blank">${msg.fileName || 'Faýl'}</a></div>`;
                }
                return `
                    <div class="message ${isSent ? 'sent' : 'received'}">
                        ${senderName}
                        ${msg.text}
                        ${fileHtml}
                        <div class="msg-time">${time}</div>
                    </div>
                `;
            }).join('');
            container.scrollTop = container.scrollHeight;
        }

        // ============================================================
        // ОТПРАВКА СООБЩЕНИЯ (с поддержкой файлов и эмодзи)
        // ============================================================
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        // Emoji picker
        const emojis = ['😊', '😂', '❤️', '🔥', '👍', '👏', '🎉', '💪', '🤔', '😍', '🥳', '😎', '🙏', '💯', '✨', '🌟', '💬', '📌', '✅', '❌', '⚠️', '🔔', '📢', '💡', '🔑', '💰', '💎', '🚀', '⭐', '🌈'];
        const emojiGrid = document.getElementById('emojiGrid');
        emojis.forEach(e => {
            const btn = document.createElement('button');
            btn.textContent = e;
            btn.type = 'button';
            btn.addEventListener('click', function() {
                const input = document.getElementById('messageInput');
                input.value += e;
                input.focus();
                document.getElementById('emojiPicker').classList.remove('active');
            });
            emojiGrid.appendChild(btn);
        });

        document.getElementById('emojiBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('emojiPicker').classList.toggle('active');
        });
        document.addEventListener('click', function() {
            document.getElementById('emojiPicker').classList.remove('active');
        });

        // File attachment
        document.getElementById('fileBtn').addEventListener('click', function() {
            document.getElementById('fileInput').click();
        });
        let pendingFiles = [];

        document.getElementById('fileInput').addEventListener('change', function() {
            const files = Array.from(this.files);
            if (files.length) {
                pendingFiles = files;
                showToast(`${files.length} faýl goşuldy`, 'info');
            }
            this.value = '';
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text && pendingFiles.length === 0) return;
            if (!currentDialogId) {
                showToast('Ilki söhbeti saýlaň!', 'error');
                return;
            }

            // Создаём сообщение
            const msg = { from: 'user', text: text || '', time: new Date().toISOString() };
            if (pendingFiles.length > 0) {
                // Для демонстрации сохраняем имя файла (в реальности можно было бы сохранить base64, но для простоты оставляем так)
                const fileNames = pendingFiles.map(f => f.name).join(', ');
                msg.file = '#file-' + Date.now(); // псевдо-ссылка
                msg.fileName = fileNames;
                pendingFiles = [];
            }
            if (!messages[currentDialogId]) messages[currentDialogId] = [];
            messages[currentDialogId].push(msg);
            saveMessages(currentDialogId);

            // Обновить последнее сообщение в диалоге
            const dialog = dialogs.find(d => d.id === currentDialogId);
            if (dialog) {
                dialog.lastMessage = text || 'Faýl iberildi';
                dialog.time = new Date().toISOString();
                saveDialogs();
            }

            renderMessages(currentDialogId);
            input.value = '';
            renderDialogs(dialogs);

            // Имитация ответа (если не помощник)
            if (currentDialogId !== 'assistant') {
                showTyping();
                setTimeout(() => {
                    const reply = {
                        from: dialog ? dialog.name : 'Aýdar',
                        text: 'Gowy, men size kömek ederin. (' + new Date().toLocaleTimeString() + ')',
                        time: new Date().toISOString()
                    };
                    messages[currentDialogId].push(reply);
                    saveMessages(currentDialogId);
                    if (dialog) {
                        dialog.lastMessage = reply.text;
                        dialog.time = new Date().toISOString();
                        saveDialogs();
                    }
                    renderMessages(currentDialogId);
                    renderDialogs(dialogs);
                }, 1200 + Math.random() * 800);
            } else {
                // Ответ помощника
                setTimeout(() => {
                    const reply = {
                        from: translations[currentLang].assistant_name,
                        text: translations[currentLang].assistant_hello,
                        time: new Date().toISOString()
                    };
                    messages[currentDialogId].push(reply);
                    saveMessages(currentDialogId);
                    if (dialog) {
                        dialog.lastMessage = reply.text;
                        dialog.time = new Date().toISOString();
                        saveDialogs();
                    }
                    renderMessages(currentDialogId);
                    renderDialogs(dialogs);
                }, 600);
            }
        }

        // ============================================================
        // ИНДИКАТОР ПЕЧАТАНИЯ
        // ============================================================
        let typingTimeout = null;

        function showTyping() {
            const container = document.getElementById('chatMessages');
            const typingEl = document.createElement('div');
            typingEl.className = 'typing-indicator';
            typingEl.textContent = translations[currentLang].typing || 'печатает...';
            typingEl.id = 'typingIndicator';
            container.appendChild(typingEl);
            container.scrollTop = container.scrollHeight;
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                const el = document.getElementById('typingIndicator');
                if (el) el.remove();
            }, 2000);
        }

        // ============================================================
        // АУДИО / ВИДЕО ВЫЗОВЫ (имитация)
        // ============================================================
        document.getElementById('audioCallBtn').addEventListener('click', function() {
            // Звуковое оповещение (beep)
            playBeep();
            showToast('📞 ' + translations[currentLang].audio_call + ' (simulýasiýa)', 'info');
        });
        document.getElementById('videoCallBtn').addEventListener('click', function() {
            playBeep();
            showToast('📹 ' + translations[currentLang].video_call + ' (simulýasiýa)', 'info');
        });

        // ============================================================
        // ЗВУКОВОЕ ОПОВЕЩЕНИЕ (beep)
        // ============================================================
        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.value = 0.3;
                oscillator.start();
                setTimeout(() => {
                    oscillator.stop();
                    audioCtx.close();
                }, 200);
            } catch (e) {
                // Если AudioContext не поддерживается, просто игнорируем
            }
        }

        // ============================================================
        // ЛЕНТА НОВОСТЕЙ
        // ============================================================
        function renderNews() {
            const feed = document.getElementById('newsFeed');
            const newsItems = [
                { title: translations[currentLang].news_title_1, summary: translations[currentLang].news_summary_1, image: '📢' },
                { title: translations[currentLang].news_title_2, summary: translations[currentLang].news_summary_2, image: '📈' },
                { title: translations[currentLang].news_title_3, summary: translations[currentLang].news_summary_3, image: '🏦' },
                { title: translations[currentLang].news_title_4, summary: translations[currentLang].news_summary_4, image: '📹' }
            ];
            if (!newsItems.length) {
                feed.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>${translations[currentLang].news_no_items}</p></div>`;
                return;
            }
            feed.innerHTML = newsItems.map(item => `
                <div class="news-item">
                    <div class="title">${item.title}</div>
                    <div class="summary">${item.summary}</div>
                    <div class="image-placeholder">${item.image}</div>
                    <div class="meta"><span>⏱ ${new Date().toLocaleDateString()}</span><span>❤️ 12</span></div>
                </div>
            `).join('');
        }

        // ============================================================
        // ПОИСК ПО ДИАЛОГАМ
        // ============================================================
        document.getElementById('searchInput').addEventListener('input', function() {
            searchQuery = this.value.trim();
            if (currentTab === 'chats') {
                renderDialogs(dialogs);
            }
        });

        // ============================================================
        // ПОИСК ВНУТРИ ЧАТА
        // ============================================================
        let searchInChatActive = false;
        document.getElementById('searchInChatBtn').addEventListener('click', function() {
            if (!currentDialogId) {
                showToast('Ilki söhbeti saýlaň!', 'error');
                return;
            }
            const msgs = messages[currentDialogId] || [];
            if (msgs.length === 0) {
                showToast('Hiç hili habar ýok', 'info');
                return;
            }
            const keyword = prompt(translations[currentLang].search_chat + ':');
            if (!keyword) return;
            const results = msgs.filter(m => m.text.toLowerCase().includes(keyword.toLowerCase()));
            if (results.length === 0) {
                showToast('Hiç zat tapylmady', 'info');
            } else {
                showToast(`${results.length} habar tapyldy`, 'success');
                // Подсветка сообщений (простая)
                const container = document.getElementById('chatMessages');
                container.innerHTML = msgs.map(msg => {
                    const isSent = msg.from === 'user';
                    const highlight = msg.text.toLowerCase().includes(keyword.toLowerCase()) ? 'style="border:2px solid #00d4ff; padding:10px;"' : '';
                    return `
                        <div class="message ${isSent ? 'sent' : 'received'}" ${highlight}>
                            ${isSent ? '' : `<div class="msg-username">${msg.from}</div>`}
                            ${msg.text}
                            <div class="msg-time">${new Date(msg.time).toLocaleTimeString()}</div>
                        </div>
                    `;
                }).join('');
                container.scrollTop = 0;
                // Восстановить через 5 секунд
                setTimeout(() => renderMessages(currentDialogId), 5000);
            }
        });

        // ============================================================
        // ЭКСПОРТ ИСТОРИИ ЧАТА
        // ============================================================
        document.getElementById('exportChatBtn').addEventListener('click', function() {
            if (!currentDialogId) {
                showToast('Ilki söhbeti saýlaň!', 'error');
                return;
            }
            const msgs = messages[currentDialogId] || [];
            if (msgs.length === 0) {
                showToast(translations[currentLang].no_export, 'error');
                return;
            }
            const dialog = dialogs.find(d => d.id === currentDialogId);
            let content = `Söhbet: ${dialog ? dialog.name : '???'}\n`;
            content += `Eksport edilen: ${new Date().toLocaleString()}\n`;
            content += '='.repeat(40) + '\n\n';
            msgs.forEach(m => {
                const time = new Date(m.time).toLocaleString();
                content += `[${time}] ${m.from}: ${m.text}\n`;
                if (m.fileName) content += `  (Faýl: ${m.fileName})\n`;
            });
            // Скачиваем как .txt
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat_${dialog ? dialog.name : 'export'}_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(translations[currentLang].export_success, 'success');
        });

        // ============================================================
        // УВЕДОМЛЕНИЯ (TOAST)
        // ============================================================
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // ============================================================
        // АВТООБНОВЛЕНИЕ (имитация новых сообщений)
        // ============================================================
        let autoUpdateInterval = null;

        function startAutoUpdate() {
            if (autoUpdateInterval) clearInterval(autoUpdateInterval);
            autoUpdateInterval = setInterval(() => {
                // Имитация нового сообщения от случайного контакта (кроме ассистента)
                const contacts = dialogs.filter(d => !d.isGroup && d.id !== 'assistant');
                if (contacts.length === 0) return;
                const randomContact = contacts[Math.floor(Math.random() * contacts.length)];
                const newMsg = {
                    from: randomContact.name,
                    text: 'Täze habar! (' + new Date().toLocaleTimeString() + ')',
                    time: new Date().toISOString()
                };
                if (!messages[randomContact.id]) messages[randomContact.id] = [];
                messages[randomContact.id].push(newMsg);
                saveMessages(randomContact.id);
                // Обновить последнее сообщение
                const dialog = dialogs.find(d => d.id === randomContact.id);
                if (dialog) {
                    dialog.lastMessage = newMsg.text;
                    dialog.time = new Date().toISOString();
                    dialog.unread = (dialog.unread || 0) + 1;
                    saveDialogs();
                }
                // Если этот диалог открыт, обновить сообщения
                if (currentDialogId === randomContact.id) {
                    renderMessages(currentDialogId);
                }
                renderDialogs(dialogs);
                // Звуковое оповещение
                playBeep();
                showToast(`📩 ${translations[currentLang].online}: ${newMsg.text}`, 'info');
            }, 30000); // каждые 30 секунд
        }

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        // Сначала загружаем данные
        loadDialogs();
        // Затем устанавливаем язык
        setLanguage(currentLang);
        // Переключаем на вкладку чатов
        switchTab('chats', true);
        // Запускаем автообновление
        startAutoUpdate();
        // Применяем тему
        applyTheme(currentTheme);
        // Обновляем тултипы
        updateTitles();
        console.log('✅ Messenger with full improvements loaded');
    </script>
</body>
</html>
