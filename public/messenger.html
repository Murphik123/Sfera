<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>СФЕРА — Messenger</title>

    <!-- Единый скрипт проверки авторизации -->
    <script src="js/auth-check.js"></script>

    <link rel="stylesheet" href="/css/style.css" />
    <!-- Socket.io клиент -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
        /* ===== АНИМИРОВАННЫЕ СВЕТЯЩИЕСЯ ЧАСТИЦЫ ===== */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,212,255,0.8) 0%, rgba(0,212,255,0) 70%);
            animation: floatParticle 15s infinite linear;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* ===== ОСНОВНОЙ СТЕКЛЯННЫЙ ИНТЕРФЕЙС ===== */
        .messenger-page { padding: 120px 0 40px; min-height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 1; }
        .messenger-container { display: flex; flex: 1; height: calc(100vh - 160px); min-height: 550px; border-radius: 24px; overflow: hidden; background: rgba(13, 28, 41, 0.55); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .messenger-container.light-theme { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.3); }

        .messenger-sidebar { width: 340px; min-width: 300px; background: rgba(0,0,0,.25); border-right: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .sidebar-header h2 { font-size: 18px; font-weight: 700; color: #fff; }

        /* Выпадающее меню вкладок */
        .dropdown-tabs { position: relative; display: inline-block; }
        .dropdown-tabs .dropbtn { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); color: white; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: .2s; }
        .dropdown-tabs .dropbtn:hover { background: rgba(0,212,255,.2); border-color: #00d4ff; }
        .dropdown-tabs .dropdown-content { display: none; position: absolute; right: 0; top: 110%; background: rgba(10, 22, 34, 0.95); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,.15); border-radius: 14px; min-width: 150px; box-shadow: 0 15px 35px rgba(0,0,0,.6); z-index: 100; overflow: hidden; }
        .dropdown-tabs.show .dropdown-content { display: block; }
        .dropdown-tabs .dropdown-content button { background: transparent; border: none; color: #bdd0df; padding: 12px 18px; width: 100%; text-align: left; font-size: 14px; font-weight: 500; cursor: pointer; transition: .2s; }
        .dropdown-tabs .dropdown-content button:hover { background: rgba(0,212,255,.15); color: #fff; }
        .dropdown-tabs .dropdown-content button.active { color: #00d4ff; background: rgba(0,212,255,.1); font-weight: 700; }

        /* Поиск и создание групп */
        .sidebar-search { padding: 14px 16px; display: flex; gap: 8px; border-bottom: 1px solid rgba(255,255,255,.05); }
        .sidebar-search input { flex: 1; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: white; font-size: 14px; outline: none; transition: .3s; }
        .sidebar-search input:focus { border-color: #00d4ff; box-shadow: 0 0 10px rgba(0,212,255,0.3); }
        .sidebar-search input::placeholder { color: #8a9fb4; }
        .sidebar-search .create-group-btn { padding: 10px 14px; background: rgba(0,212,255,.15); border: 1px solid rgba(0,212,255,.4); border-radius: 12px; color: #00d4ff; cursor: pointer; font-weight: 600; transition: .2s; white-space: nowrap; }
        .sidebar-search .create-group-btn:hover { background: #00d4ff; color: #000; }

        /* Списки чатов и пользователей */
        .dialogs-list, .users-list, .news-feed { flex: 1; overflow-y: auto; padding: 8px 0; }
        .dialog-item { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; transition: .2s; border-left: 3px solid transparent; gap: 12px; }
        .dialog-item:hover { background: rgba(255,255,255,.06); }
        .dialog-item.active { background: rgba(0,212,255,.12); border-left-color: #00d4ff; }
        .dialog-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, rgba(0,212,255,0.3), rgba(0,140,255,0.3)); border: 1px solid rgba(0,212,255,0.5); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #00d4ff; flex-shrink: 0; position: relative; }
        .dialog-avatar.group { background: linear-gradient(135deg, rgba(255,200,0,0.3), rgba(255,120,0,0.3)); border-color: #ffc800; color: #ffc800; }
        .dialog-avatar .online-dot { width: 10px; height: 10px; border-radius: 50%; background: #00ffa3; border: 2px solid #08131d; position: absolute; bottom: 0; right: 0; box-shadow: 0 0 8px #00ffa3; }
        .dialog-info { flex: 1; min-width: 0; }
        .dialog-info .name { font-weight: 600; font-size: 15px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dialog-info .last-msg { font-size: 13px; color: #8a9fb4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .dialog-time { font-size: 11px; color: #5a7086; flex-shrink: 0; }

        /* Окно чата */
        .messenger-chat { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,.15); position: relative; }
        .chat-header { padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,.2); min-height: 68px; }
        .chat-header .chat-avatar { width: 42px; height: 42px; border-radius: 50%; background: rgba(0,212,255,.2); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #00d4ff; border: 1px solid rgba(0,212,255,0.4); }
        .chat-header .chat-name { font-weight: 700; font-size: 17px; color: #fff; }
        .chat-header .chat-status { font-size: 12px; color: #00ffa3; }
        .chat-header .chat-actions { margin-left: auto; display: flex; gap: 8px; }
        .chat-header .chat-actions button { width: 36px; height: 36px; font-size: 16px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,.15); color: #dbe9ff; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; justify-content: center; }
        .chat-header .chat-actions button:hover { background: rgba(0,212,255,.2); border-color: #00d4ff; color: #fff; }

        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 70%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-wrap: break-word; position: relative; }
        .message.sent { align-self: flex-end; background: linear-gradient(135deg, #00d4ff, #0072ff); color: white; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(0,212,255,0.25); }
        .message.received { align-self: flex-start; background: rgba(255,255,255,.09); color: white; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.08); }
        .message .msg-time { font-size: 10px; color: rgba(255,255,255,.6); margin-top: 4px; text-align: right; }

        .chat-input-area { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,.08); display: flex; gap: 10px; background: rgba(0,0,0,.2); align-items: center; }
        .chat-input-area .input-group { flex: 1; display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 24px; padding: 4px 14px; }
        .chat-input-area .input-group input { flex: 1; padding: 8px 0; border: none; background: transparent; color: white; font-size: 14px; outline: none; }
        .chat-input-area .input-group input::placeholder { color: #8a9fb4; }
        .chat-input-area .input-group .action-btn { background: transparent; border: none; font-size: 20px; cursor: pointer; color: #8a9fb4; transition: .2s; }
        .chat-input-area .input-group .action-btn:hover { color: #00d4ff; }
        .chat-input-area .send-btn { padding: 10px 22px; border: none; border-radius: 20px; background: linear-gradient(135deg, #00d4ff, #0072ff); color: white; font-weight: 600; cursor: pointer; transition: .2s; box-shadow: 0 4px 15px rgba(0,212,255,0.3); }
        .chat-input-area .send-btn:hover { transform: scale(1.03); }

        /* Модальные окна */
        .call-modal, .group-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(6, 17, 29, 0.85); backdrop-filter: blur(20px); justify-content: center; align-items: center; z-index: 2500; }
        .call-modal.active, .group-modal.active { display: flex; }
        .call-card, .group-modal .modal-box { background: rgba(20, 32, 50, 0.9); border: 1px solid rgba(0, 212, 255, 0.3); border-radius: 28px; padding: 32px; width: 380px; text-align: center; color: #fff; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }

        /* Локация Шекл/Шапка */
        header { background: rgba(255, 255, 255, 0.05) !important; backdrop-filter: blur(20px) !important; border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important; }
        .header-right .lang, .header-right .logout-btn, .header-right .btn-switch { background: rgba(255, 255, 255, 0.08) !important; border: 1px solid rgba(255, 255, 255, 0.15) !important; color: #fff !important; cursor: pointer; border-radius: 20px; padding: 6px 14px; font-weight: 600; }
        .header-right .lang:hover, .header-right .logout-btn:hover { border-color: #00d4ff !important; color: #00d4ff !important; }
        .logo-text p { display: none !important; }
    </style>
</head>
<body>
    <!-- ФОНОВЫЕ СВЕТЯЩИЕСЯ ЧАСТИЦЫ -->
    <div id="particles"></div>

    <header>
        <div class="container" style="display:flex; justify-content:space-between; align-items:center; padding: 12px 20px;">
            <a href="dashboard.html" class="logo" style="display:flex; align-items:center; gap:12px; text-decoration:none;">
                <div class="logo-icon" style="width:40px; height:40px;">
                    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs><linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00ffa3"/><stop offset="50%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#1f6bff"/></linearGradient></defs>
                        <circle cx="50" cy="50" r="28" fill="url(#logoGrad)" opacity="0.15"/>
                        <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" stroke="url(#logoGrad)" stroke-width="3"/>
                        <circle cx="48" cy="48" r="3.5" fill="#ffffff"/>
                    </svg>
                </div>
                <div class="logo-text"><h2 style="color:#fff; margin:0; font-size:20px;">SFERA</h2></div>
            </a>
            <div class="header-right" style="display:flex; align-items:center; gap:12px;">
                <span class="user-info" style="color:#fff;">👤 <strong id="username">Пользователь</strong></span>
                <button class="lang" id="langBtn">RU</button>
                <button class="logout-btn" id="logoutBtn" data-i18n="logout">🚪 Выйти</button>
                <a href="dashboard.html" id="backLink" class="btn-switch" style="text-decoration:none;" data-i18n="back">← Назад</a>
            </div>
        </div>
    </header>

    <section class="messenger-page">
        <div class="container" style="flex:1; display:flex; flex-direction:column; max-width:1200px; margin:0 auto; width:100%;">
            <div class="messenger-container" id="messengerContainer">
                
                <!-- БОКОВАЯ ПАНЕЛЬ -->
                <div class="messenger-sidebar">
                    <div class="sidebar-header">
                        <h2 data-i18n="messenger_title">Сообщения</h2>
                        
                        <!-- Выпадающая кнопка вкладок -->
                        <div class="dropdown-tabs" id="tabsDropdown">
                            <button class="dropbtn" id="dropbtn">💬 <span id="currentTabLabel" data-i18n="tab_chats">Чаты</span> ▾</button>
                            <div class="dropdown-content" id="dropdownContent">
                                <button class="active" data-tab="chats" data-i18n="tab_chats">Чаты</button>
                                <button data-tab="users" data-i18n="tab_users">Пользователи</button>
                                <button data-tab="news" data-i18n="tab_news">Новости</button>
                                <button data-tab="assistant" data-i18n="tab_assistant">Помощник</button>
                            </div>
                        </div>
                    </div>

                    <!-- Поиск и создание группы -->
                    <div class="sidebar-search">
                        <input type="text" id="searchInput" placeholder="Поиск..." data-i18n-placeholder="search_placeholder" />
                        <button class="create-group-btn" id="createGroupBtn" data-i18n="create_group">➕ Группа</button>
                    </div>

                    <!-- Динамические списки -->
                    <div class="dialogs-list" id="dialogsList"></div>
                    <div class="users-list" id="usersList" style="display:none;"></div>
                    <div class="news-feed" id="newsFeed" style="display:none; padding:15px; color:#a0b0c0; text-align:center;" data-i18n="no_news">
                        Нет свежих новостей
                    </div>
                </div>

                <!-- ОКНО ЧАТА -->
                <div class="messenger-chat" id="chatWindow">
                    <div class="chat-header">
                        <div class="chat-avatar" id="chatAvatar">💬</div>
                        <div>
                            <div class="chat-name" id="chatName" data-i18n="select_chat">Выберите чат</div>
                            <div class="chat-status" id="chatStatus">--</div>
                        </div>
                        <div class="chat-actions">
                            <button id="audioCallBtn" title="Голосовой вызов">📞</button>
                            <button id="videoCallBtn" title="Видеовызов">📹</button>
                        </div>
                    </div>

                    <div class="chat-messages" id="chatMessages">
                        <div style="margin:auto; text-align:center; color:#8a9fb4;">
                            <div style="font-size:48px; margin-bottom:10px;">💬</div>
                            <h3 data-i18n="select_chat">Выберите чат</h3>
                            <p data-i18n="select_chat_desc" style="font-size:13px; margin-top:4px;">Выберите собеседника из списка слева, чтобы начать общение.</p>
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <div class="input-group">
                            <button class="action-btn" id="emojiBtn">😊</button>
                            <input type="text" id="messageInput" placeholder="Введите сообщение..." data-i18n-placeholder="type_message" />
                            <button class="action-btn" id="fileBtn">📎</button>
                            <input type="file" id="fileInput" style="display:none;" />
                        </div>
                        <button class="send-btn" id="sendBtn" data-i18n="send">Отправить</button>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- МОДАЛЬНОЕ ОКНО ЗВОНКА -->
    <div class="call-modal" id="callModal">
        <div class="call-card">
            <div style="width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg, #00d4ff, #0072ff); margin:0 auto 15px; display:flex; align-items:center; justify-content:center; font-size:32px;" id="callAvatar">👤</div>
            <h3 id="callUserName" style="margin-bottom:6px;">Пользователь</h3>
            <p id="callStatusText" style="color:#00ffa3; font-size:14px; margin-bottom:20px;">Звонок...</p>
            <button id="endCallBtn" style="background:#ff4757; border:none; color:white; padding:12px 28px; border-radius:20px; font-weight:600; cursor:pointer;">Завершить</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО СОЗДАНИЯ ГРУППЫ -->
    <div class="group-modal" id="groupModal">
        <div class="modal-box">
            <h3 style="margin-bottom:15px;" data-i18n="create_group_title">Создать группу</h3>
            <input type="text" id="groupNameInput" placeholder="Название группы..." style="width:100%; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); color:white; margin-bottom:15px;" />
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button id="cancelGroupBtn" style="background:transparent; border:1px solid rgba(255,255,255,0.2); color:white; padding:8px 16px; border-radius:10px; cursor:pointer;" data-i18n="cancel">Отмена</button>
                <button id="confirmGroupBtn" style="background:#00d4ff; border:none; color:black; font-weight:600; padding:8px 16px; border-radius:10px; cursor:pointer;" data-i18n="create">Создать</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. ГЕНЕРАЦИЯ ДИНАМИЧЕСКИХ СВЕТЯЩИХСЯ ЧАСТИЦ
        // ============================================================
        function createParticles() {
            const container = document.getElementById('particles');
            container.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 6 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDuration = `${Math.random() * 10 + 8}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(particle);
            }
        }
        createParticles();

        // ============================================================
        // 2. СИСТЕМА ЛОКАЛИЗАЦИИ И ПЕРЕВОДОВ
        // ============================================================
        const translations = {
            ru: {
                logout: "🚪 Выйти", back: "← Назад", messenger_title: "Сообщения",
                tab_chats: "Чаты", tab_users: "Пользователи", tab_news: "Новости", tab_assistant: "Помощник",
                search_placeholder: "Поиск пользователей или чатов...", create_group: "➕ Группа",
                select_chat: "Выберите чат", select_chat_desc: "Выберите собеседника из списка слева, чтобы начать общение.",
                type_message: "Введите сообщение...", send: "Отправить", online: "онлайн", offline: "офлайн",
                create_group_title: "Создать группу", cancel: "Отмена", create: "Создать", no_news: "Нет свежих новостей"
            },
            tm: {
                logout: "🚪 Çykmak", back: "← Yza", messenger_title: "Söhbet",
                tab_chats: "Çatlar", tab_users: "Ulanyjylar", tab_news: "Habarlar", tab_assistant: "Kömekçi",
                search_placeholder: "Gözleg...", create_group: "➕ Topar",
                select_chat: "Söhbeti saýlaň", select_chat_desc: "Söhbetleşmek üçin çep tarapdaky sanawdan birini saýlaň.",
                type_message: "Habaryňyzy ýazyň...", send: "Iber", online: "onlaýn", offline: "offlaýn",
                create_group_title: "Täze topar döret", cancel: "Ýatyr", create: "Döret", no_news: "Täze habar ýok"
            },
            en: {
                logout: "🚪 Logout", back: "← Back", messenger_title: "Messages",
                tab_chats: "Chats", tab_users: "Users", tab_news: "News", tab_assistant: "Assistant",
                search_placeholder: "Search...", create_group: "➕ Group",
                select_chat: "Select a chat", select_chat_desc: "Select a contact from the left list to start messaging.",
                type_message: "Type a message...", send: "Send", online: "online", offline: "offline",
                create_group_title: "Create Group", cancel: "Cancel", create: "Create", no_news: "No fresh news"
            }
        };

        let currentLang = localStorage.getItem('lang') || localStorage.getItem('sfera_lang') || 'ru';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            localStorage.setItem('sfera_lang', lang);
            document.getElementById('langBtn').textContent = lang.toUpperCase();

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });
        }

        const langBtn = document.getElementById('langBtn');
        const langCycle = ['ru', 'tm', 'en'];
        langBtn.addEventListener('click', () => {
            let nextIdx = (langCycle.indexOf(currentLang) + 1) % langCycle.length;
            setLanguage(langCycle[nextIdx]);
        });

        // ============================================================
        // 3. ВЫПАДАЮЩЕЕ МЕНЮ ВКЛАДОК (ЧАТЫ, ПОЛЬЗОВАТЕЛИ, НОВОСТИ)
        // ============================================================
        const tabsDropdown = document.getElementById('tabsDropdown');
        const dropbtn = document.getElementById('dropbtn');
        const dropdownContent = document.getElementById('dropdownContent');
        const currentTabLabel = document.getElementById('currentTabLabel');

        dropbtn.addEventListener('click', (e) => {
            e.stopPropagation();
            tabsDropdown.classList.toggle('show');
        });

        document.addEventListener('click', () => tabsDropdown.classList.remove('show'));

        dropdownContent.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                dropdownContent.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const tab = btn.getAttribute('data-tab');
                currentTabLabel.textContent = btn.textContent;
                tabsDropdown.classList.remove('show');
                
                switchTab(tab);
            });
        });

        function switchTab(tab) {
            document.getElementById('dialogsList').style.display = tab === 'chats' ? 'block' : 'none';
            document.getElementById('usersList').style.display = tab === 'users' ? 'block' : 'none';
            document.getElementById('newsFeed').style.display = tab === 'news' || tab === 'assistant' ? 'block' : 'none';

            if (tab === 'users') fetchRegisteredUsers();
        }

        // ============================================================
        // 4. ДАННЫЕ И ЧАТЫ
        // ============================================================
        let activeDialogId = null;
        let dialogsData = [
            { id: '1', name: 'Сердар Аннаев', lastMsg: 'Привет, проект готов?', time: '10:42', online: true },
            { id: '2', name: 'Техподдержка Sfera', lastMsg: 'Чем можем помочь?', time: 'Вчера', online: true, isGroup: true }
        ];
        let messagesData = {
            '1': [{ sender: 'Сердар Аннаев', text: 'Привет, проект готов?', time: '10:42', type: 'received' }],
            '2': [{ sender: 'Техподдержка Sfera', text: 'Чем можем помочь?', time: 'Вчера', type: 'received' }]
        };

        function renderDialogs() {
            const list = document.getElementById('dialogsList');
            list.innerHTML = '';
            dialogsData.forEach(d => {
                const item = document.createElement('div');
                item.className = `dialog-item ${activeDialogId === d.id ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="dialog-avatar ${d.isGroup ? 'group' : ''}">
                        ${d.isGroup ? '👥' : d.name.charAt(0)}
                        ${d.online ? '<div class="online-dot"></div>' : ''}
                    </div>
                    <div class="dialog-info">
                        <div class="name">${d.name}</div>
                        <div class="last-msg">${d.lastMsg}</div>
                    </div>
                    <div class="dialog-time">${d.time}</div>
                `;
                item.addEventListener('click', () => selectDialog(d.id));
                list.appendChild(item);
            });
        }

        // Получение пользователей с бэкенда
        async function fetchRegisteredUsers() {
            const list = document.getElementById('usersList');
            list.innerHTML = '<div style="padding:15px; color:#8a9fb4; text-align:center;">Загрузка пользователей...</div>';
            
            try {
                const res = await fetch('/api/user');
                if (!res.ok) throw new Error();
                const users = await res.json();
                
                list.innerHTML = '';
                users.forEach(u => {
                    const item = document.createElement('div');
                    item.className = 'dialog-item';
                    item.innerHTML = `
                        <div class="dialog-avatar">${(u.username || u.email || 'U').charAt(0).toUpperCase()}</div>
                        <div class="dialog-info">
                            <div class="name">${u.username || u.email}</div>
                            <div class="last-msg">${u.role || 'Пользователь'}</div>
                        </div>
                    `;
                    item.addEventListener('click', () => createOrOpenDialog(u));
                    list.appendChild(item);
                });
            } catch (e) {
                list.innerHTML = '<div style="padding:15px; color:#ff6b6b; text-align:center;">Не удалось загрузить пользователей</div>';
            }
        }

        function createOrOpenDialog(user) {
            const name = user.username || user.email;
            let existing = dialogsData.find(d => d.name === name);
            if (!existing) {
                existing = { id: Date.now().toString(), name: name, lastMsg: 'Чат создан', time: 'Только что', online: true };
                dialogsData.unshift(existing);
                messagesData[existing.id] = [];
            }
            switchTab('chats');
            selectDialog(existing.id);
        }

        function selectDialog(id) {
            activeDialogId = id;
            renderDialogs();
            renderChat();
        }

        function renderChat() {
            const dialog = dialogsData.find(d => d.id === activeDialogId);
            if (!dialog) return;

            document.getElementById('chatName').textContent = dialog.name;
            document.getElementById('chatAvatar').textContent = dialog.isGroup ? '👥' : dialog.name.charAt(0);
            document.getElementById('chatStatus').textContent = dialog.online ? translations[currentLang].online : translations[currentLang].offline;

            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            const msgs = messagesData[activeDialogId] || [];
            
            msgs.forEach(m => {
                const msgEl = document.createElement('div');
                msgEl.className = `message ${m.type}`;
                msgEl.innerHTML = `
                    <div>${m.text}</div>
                    <div class="msg-time">${m.time}</div>
                `;
                chatMessages.appendChild(msgEl);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Отправка сообщений
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!activeDialogId || !text) return;

            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            if (!messagesData[activeDialogId]) messagesData[activeDialogId] = [];
            
            messagesData[activeDialogId].push({ sender: 'Я', text: text, time: time, type: 'sent' });
            
            const dialog = dialogsData.find(d => d.id === activeDialogId);
            if (dialog) { dialog.lastMsg = text; dialog.time = time; }

            input.value = '';
            renderDialogs();
            renderChat();
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        // Модальное окно создания групп
        const createGroupBtn = document.getElementById('createGroupBtn');
        const groupModal = document.getElementById('groupModal');
        createGroupBtn.addEventListener('click', () => groupModal.classList.add('active'));
        document.getElementById('cancelGroupBtn').addEventListener('click', () => groupModal.classList.remove('active'));
        document.getElementById('confirmGroupBtn').addEventListener('click', () => {
            const val = document.getElementById('groupNameInput').value.trim();
            if (val) {
                const newGrp = { id: Date.now().toString(), name: val, lastMsg: 'Группа создана', time: 'Только что', isGroup: true, online: true };
                dialogsData.unshift(newGrp);
                messagesData[newGrp.id] = [];
                groupModal.classList.remove('active');
                selectDialog(newGrp.id);
            }
        });

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            setLanguage(currentLang);
            renderDialogs();
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('username').textContent = user.username || user.email || 'Пользователь';
        });
    </script>
</body>
</html>
