<!DOCTYPE html>
<html lang="tm">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>СФЕРА — Registrasiya</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/css/style.css" />

    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px;
            background: linear-gradient(135deg, #06111d, #0b2035, #102b45);
        }

        .login-box {
            background: rgba(255,255,255,.06);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0,0,0,.35);
            animation: fadeUp 0.8s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #b4d7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-box .subtitle {
            text-align: center;
            color: #9fb5c8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #dbe9ff;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.05);
            color: white;
            font-size: 16px;
            transition: .3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0,212,255,.2);
            background: rgba(255,255,255,.08);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #00ffa3, #00d4ff);
            color: #06111d;
            transition: .35s;
            box-shadow: 0 15px 35px rgba(0,255,163,.3);
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 50px rgba(0,255,163,.5);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #9fb5c8;
            font-size: 14px;
        }

        .register-link a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 500;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.error {
            display: block;
            background: rgba(255,0,0,.15);
            border: 1px solid rgba(255,0,0,.3);
            color: #ff6b6b;
        }

        .message.success {
            display: block;
            background: rgba(0,255,170,.1);
            border: 1px solid rgba(0,255,170,.3);
            color: #00ffa3;
        }

        .logo-icon-small {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-icon-small svg {
            width: 60px;
            height: 60px;
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00ffa3" />
                                <stop offset="50%" stop-color="#00d4ff" />
                                <stop offset="100%" stop-color="#1f6bff" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="28" fill="url(#logoGrad)" opacity="0.15" />
                        <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" stroke="url(#logoGrad)" stroke-width="3" />
                    </svg>
                </div>
                <div class="logo-text">
                    <h2 data-i18n="logo_title">SFERA</h2>
                    <p data-i18n="logo_subtitle">Milli Sanly Platforma</p>
                </div>
            </a>

            <div class="header-buttons">
                <button class="lang" id="langBtn">TM</button>
            </div>
        </div>
    </header>

    <section class="login-page">
        <div class="login-box">
            <div class="logo-icon-small">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="smallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00ffa3" />
                            <stop offset="50%" stop-color="#00d4ff" />
                            <stop offset="100%" stop-color="#1f6bff" />
                        </linearGradient>
                    </defs>
                    <circle cx="50" cy="50" r="30" fill="url(#smallGrad)" opacity="0.15" />
                    <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" stroke="url(#smallGrad)" stroke-width="3.5" />
                </svg>
            </div>

            <h2 data-i18n="reg_title">Registrasiya</h2>
            <p class="subtitle" data-i18n="reg_subtitle">Täze hasap dörediň</p>

            <div id="message" class="message"></div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="username" data-i18n="reg_username_label">Ulanyjy ady</label>
                    <input type="text" id="username" name="username" placeholder="Ulanyjy adyňyz" required />
                </div>

                <div class="form-group">
                    <label for="email" data-i18n="reg_email_label">Email</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" required />
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="reg_password_label">Parol</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required />
                </div>

                <button type="submit" class="login-btn" id="regBtn" data-i18n="reg_button">Döretmek</button>
            </form>

            <div class="register-link">
                <span data-i18n="reg_has_account">Hasabyňyz barmy?</span>
                <a href="login.html" data-i18n="reg_login_link">Giriş</a>
            </div>
        </div>
    </section>

    <script>
        const translations = {
            tm: {
                logo_title: "SFERA", logo_subtitle: "Milli Sanly Platforma",
                reg_title: "Registrasiya", reg_subtitle: "Täze hasap dörediň",
                reg_username_label: "Ulanyjy ady", reg_email_label: "Email", reg_password_label: "Parol",
                reg_button: "Döretmek", reg_has_account: "Hasabyňyz barmy?", reg_login_link: "Giriş",
                reg_success: "Hasap döredildi! Giriş edilýär...", reg_loading: "Döredilýär..."
            },
            ru: {
                logo_title: "СФЕРА", logo_subtitle: "Национальная Цифровая Платформа",
                reg_title: "Регистрация", reg_subtitle: "Создайте новый аккаунт",
                reg_username_label: "Имя пользователя", reg_email_label: "Email", reg_password_label: "Пароль",
                reg_button: "Создать аккаунт", reg_has_account: "Уже есть аккаунт?", reg_login_link: "Войти",
                reg_success: "Аккаунт создан! Переход на вход...", reg_loading: "Создание..."
            },
            en: {
                logo_title: "SFERA", logo_subtitle: "National Digital Platform",
                reg_title: "Register", reg_subtitle: "Create a new account",
                reg_username_label: "Username", reg_email_label: "Email", reg_password_label: "Password",
                reg_button: "Sign Up", reg_has_account: "Already have an account?", reg_login_link: "Login",
                reg_success: "Account created! Redirecting...", reg_loading: "Creating..."
            }
        };

        let currentLang = localStorage.getItem('lang') || 'tm';

        function setLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });
            document.getElementById('langBtn').textContent = lang.toUpperCase();
            localStorage.setItem('lang', lang);
        }

        const langBtn = document.getElementById('langBtn');
        const langCycle = ['tm', 'ru', 'en'];
        langBtn.addEventListener('click', () => {
            let idx = (langCycle.indexOf(currentLang) + 1) % langCycle.length;
            setLanguage(langCycle[idx]);
        });

        const form = document.getElementById('registerForm');
        const messageEl = document.getElementById('message');
        const regBtn = document.getElementById('regBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !email || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }

            regBtn.disabled = true;
            regBtn.textContent = translations[currentLang].reg_loading;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(translations[currentLang].reg_success, 'success');
                    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                } else {
                    showMessage(data.message || 'Ошибка регистрации', 'error');
                    regBtn.disabled = false;
                    regBtn.textContent = translations[currentLang].reg_button;
                }
            } catch (err) {
                showMessage(' Ошибка сети', 'error');
                regBtn.disabled = false;
                regBtn.textContent = translations[currentLang].reg_button;
            }
        });

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            messageEl.style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', () => setLanguage(currentLang));
    </script>
</body>
</html>
