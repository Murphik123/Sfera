<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Sfera</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <!-- Фоновые визуальные эффекты и неоновые частицы -->
    <div class="background-glow"></div>
    <div id="particles-container"></div>

    <!-- Основной контейнер авторизации (Glassmorphism) -->
    <main class="auth-container">
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <div class="logo">
                    <span class="logo-text">SFERA</span>
                </div>
                <h2>Создать аккаунт</h2>
                <p class="auth-subtitle">Присоединяйтесь к экосистеме Sfera</p>
            </div>

            <!-- Блок вывода ошибок -->
            <div id="auth-error" class="auth-error-message" style="display: none;"></div>

            <!-- Форма регистрации -->
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" placeholder="Введите имя пользователя" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Электронная почта</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="example@sfera.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="btn-primary auth-submit-btn">
                    <span>Зарегистрироваться</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Уже есть аккаунт? <a href="/login.html" class="auth-link">Войти</a></p>
            </div>
        </div>
    </main>

    <!-- Подключение API-клиента и контроллера авторизации -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
