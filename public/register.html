
<!DOCTYPE html>
<html lang="tm">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SFERA — Registrasiya</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">
    <!-- Эффекты (как на главной) -->
    <div class="hero-grid"></div>
    <div class="hero-glow glow-left"></div>
    <div class="hero-glow glow-right"></div>
    <div id="particles"></div>

    <div class="auth-container">
        <div class="auth-card glass-panel">
            <!-- Логотип -->
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00ffa3" />
                                <stop offset="50%" stop-color="#00d4ff" />
                                <stop offset="100%" stop-color="#1f6bff" />
                            </linearGradient>
                            <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
                                <feGaussianBlur stdDeviation="4" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>
                        <circle cx="50" cy="50" r="28" fill="url(#logoGrad)" opacity="0.15" filter="url(#logoGlow)" />
                        <g filter="url(#logoGlow)">
                            <circle cx="50" cy="50" r="40" stroke="url(#logoGrad)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.4" />
                            <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6" />
                            <circle cx="48" cy="48" r="3.5" fill="#ffffff" filter="url(#logoGlow)" />
                        </g>
                    </svg>
                </div>
                <div class="logo-text">
                    <h2>SFERA</h2>
                    <p>Milli Sanly Platforma</p>
                </div>
            </a>

            <!-- Заголовок -->
            <h2 class="auth-title" data-i18n="register_title">Ýazylmak / Registrasiya</h2>

            <!-- ФОРМА РЕГИСТРАЦИИ (теперь точно видна) -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label data-i18n="register_name_label">Atyňyz / Имя</label>
                    <input type="text" id="regName" required placeholder="Имя" />
                </div>

                <div class="form-group">
                    <label data-i18n="register_email_label">E-mail</label>
                    <input type="email" id="regEmail" required placeholder="example@sfera.tm" />
                </div>

                <div class="form-group">
                    <label data-i18n="register_password_label">Aşakdaky syr / Пароль</label>
                    <input type="password" id="regPassword" required placeholder="••••••••" />
                </div>

                <div class="form-group">
                    <label data-i18n="register_role_label">Roly / Роль</label>
                    <select id="regRole" class="form-select">
                        <option value="user" data-i18n="role_user">Ulanyjy / Пользователь</option>
                        <option value="admin" data-i18n="role_admin">Administrator / Админ</option>
                    </select>
                </div>

                <button type="submit" class="primary-btn auth-btn" data-i18n="register_button">Ýazylmak / Зарегистрироваться</button>
            </form>

            <!-- Ссылка на вход -->
            <div class="auth-footer">
                <p data-i18n="register_have_account">Eýýäm akkountyňyz barmy? <a href="login.html" data-i18n="register_login_link">Girmek</a></p>
            </div>

            <!-- Кнопка переключения языка -->
            <div style="text-align:center; margin-top:15px;">
                <button class="lang-btn" id="langBtn">TM</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // ПЕРЕВОДЫ (tm, ru, en)
        // ============================================================
        const translations = {
            tm: {
                register_title: "Ýazylmak",
                register_name_label: "Atyňyz",
                register_email_label: "E-mail",
                register_password_label: "Aşakdaky syr",
                register_role_label: "Roly",
                role_user: "Ulanyjy",
                role_admin: "Administrator",
                register_button: "Ýazylmak",
                register_have_account: "Eýýäm akkountyňyz barmy?",
                register_login_link: "Girmek",
                register_success: "Registrasiya tamamlandy! Indi giriş ediň.",
                register_error: "Registrasiya ýalňyşlyk",
                register_network_error: "Serwer bilen baglanyşyk ýalňyşlygy"
            },
            ru: {
                register_title: "Регистрация",
                register_name_label: "Имя",
                register_email_label: "E-mail",
                register_password_label: "Пароль",
                register_role_label: "Роль",
                role_user: "Пользователь",
                role_admin: "Администратор",
                register_button: "Зарегистрироваться",
                register_have_account: "Уже есть аккаунт?",
                register_login_link: "Войти",
                register_success: "Регистрация завершена! Теперь войдите.",
                register_error: "Ошибка регистрации",
                register_network_error: "Ошибка связи с сервером"
            },
            en: {
                register_title: "Register",
                register_name_label: "Name",
                register_email_label: "E-mail",
                register_password_label: "Password",
                register_role_label: "Role",
                role_user: "User",
                role_admin: "Administrator",
                register_button: "Register",
                register_have_account: "Already have an account?",
                register_login_link: "Login",
                register_success: "Registration successful! Now login.",
                register_error: "Registration error",
                register_network_error: "Network error"
            }
        };

        let currentLang = localStorage.getItem('lang') || 'tm';

        function setLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    if (el.tagName === 'INPUT') {
                        el.placeholder = translations[lang][key];
                    } else if (el.tagName === 'SELECT') {
                        el.querySelectorAll('option').forEach(opt => {
                            const optKey = opt.getAttribute('data-i18n');
                            if (optKey && translations[lang][optKey]) {
                                opt.textContent = translations[lang][optKey];
                            }
                        });
                    } else {
                        el.textContent = translations[lang][key];
                    }
                }
            });
            document.getElementById('langBtn').textContent = lang.toUpperCase();
            localStorage.setItem('lang', lang);
        }

        document.getElementById('langBtn').addEventListener('click', function() {
            const cycle = ['tm', 'ru', 'en'];
            let idx = cycle.indexOf(currentLang);
            idx = (idx + 1) % cycle.length;
            setLanguage(cycle[idx]);
        });

        // ============================================================
        // ОБРАБОТКА ФОРМЫ РЕГИСТРАЦИИ
        // ============================================================
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const role = document.getElementById('regRole').value;

            if (!name || !email || !password) {
                alert(translations[currentLang].register_error + ': Doldurmaly ýerler boş');
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: name, email, password, role })
                });

                const contentType = response.headers.get('content-type');
                let data;
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    console.error('Server response (not JSON):', text);
                    alert('Serwerden nädogry jogap / Неверный ответ сервера. Подробности в консоли.');
                    return;
                }

                if (response.ok) {
                    alert(translations[currentLang].register_success);
                    window.location.href = 'login.html';
                } else {
                    alert(data.message || translations[currentLang].register_error);
                }
            } catch (err) {
                console.error('Registration error:', err);
                alert(translations[currentLang].register_network_error);
            }
        });

        // ============================================================
        // ЧАСТИЦЫ (эффекты)
        // ============================================================
        const particles = document.getElementById('particles');
        if (particles && particles.children.length === 0) {
            for (let i = 0; i < 60; i++) {
                const p = document.createElement('span');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDuration = (6 + Math.random() * 12) + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                particles.appendChild(p);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            setLanguage(currentLang);
        });
    </script>
</body>
</html>
