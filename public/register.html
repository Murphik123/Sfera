<!DOCTYPE html>
<html lang="tm">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SFERA — Hasap döret</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />

    <style>
        .toggle-password {
            position: absolute;
            right: var(--space-3);
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            opacity: 0.6;
            transition: opacity var(--transition);
            font-size: 1.2rem;
            user-select: none;
        }
        .toggle-password:hover {
            opacity: 1;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap .input {
            padding-right: 44px;
        }
    </style>
</head>
<body class="auth-page">
    <div id="particles"></div>

    <div class="lang-switch-top">
        <button class="lang-btn" id="langBtn">TM</button>
    </div>

    <div class="auth-container">
        <div class="auth-header">
            <a href="/" class="logo-sfera" style="justify-content:center;">
                <div class="logo-icon">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00ffa3"/>
                                <stop offset="50%" stop-color="#00d4ff"/>
                                <stop offset="100%" stop-color="#1f6bff"/>
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="28" fill="url(#logoGrad)" opacity="0.15"/>
                        <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" stroke="url(#logoGrad)" stroke-width="3"/>
                        <circle cx="48" cy="48" r="3.5" fill="#fff"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <h2>SFERA</h2>
                    <p style="display:none;">Milli Platforma</p>
                </div>
            </a>
            <h1 class="auth-title" data-i18n="register_title">Hasap döret</h1>
            <p class="auth-subtitle" data-i18n="register_subtitle">Platformada hasap açmak üçin maglumatlaryňyzy giriziň</p>
        </div>

        <div id="message" class="message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label data-i18n="register_username_label">Ulanyjy ady</label>
                <div class="input-wrap">
                    <input type="text" id="username" class="input" placeholder="mysal: myrat" required />
                </div>
            </div>
            <div class="form-group">
                <label data-i18n="register_email_label">Email adres</label>
                <div class="input-wrap">
                    <input type="email" id="email" class="input" placeholder="mysal@email.tm" required />
                </div>
            </div>
            <div class="form-group">
                <label data-i18n="register_password_label">Parol</label>
                <div class="input-wrap">
                    <input type="password" id="password" class="input" placeholder="Azyndan 6 simwol" required />
                    <span class="toggle-password" id="togglePassword1">👁️</span>
                </div>
            </div>
            <div class="form-group">
                <label data-i18n="register_confirm_label">Paroly tassyklamak</label>
                <div class="input-wrap">
                    <input type="password" id="confirmPassword" class="input" placeholder="Paroly gaýtadan ýazyň" required />
                    <span class="toggle-password" id="togglePassword2">👁️</span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" id="registerBtn" data-i18n="register_button" style="width:100%;">Hasap döret</button>
        </form>

        <div class="auth-footer">
            <span data-i18n="register_have_account">Eýýäm hasabyňyz barmy?</span>
            <a href="/login.html" data-i18n="register_login_link">Giriş</a>
        </div>
    </div>

    <script src="/js/particles.js"></script>
    <script type="module">
        import { authApi } from '/js/api.js';
        import { initI18n, cycleLanguage } from '/js/i18n.js';

        await initI18n();
        document.getElementById('langBtn')?.addEventListener('click', cycleLanguage);

        const form = document.getElementById('registerForm');
        const messageEl = document.getElementById('message');
        const registerBtn = document.getElementById('registerBtn');

        // Переключение видимости пароля
        document.getElementById('togglePassword1').addEventListener('click', function() {
            const p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
            this.textContent = p.type === 'password' ? '👁️' : '🙈';
        });
        document.getElementById('togglePassword2').addEventListener('click', function() {
            const p = document.getElementById('confirmPassword');
            p.type = p.type === 'password' ? 'text' : 'password';
            this.textContent = p.type === 'password' ? '👁️' : '🙈';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (!username || !email || !password || !confirm) {
                showMessage('Näsazlyk ýüze çykdy, ýene synanyşyň', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('Parol azyndan 6 simwol bolmaly', 'error');
                return;
            }
            if (password !== confirm) {
                showMessage('Parollar gabat gelmeýär', 'error');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = 'Döredilýär...';

            try {
                const data = await authApi.register({ username, email, password });
                // Если регистрация успешна, обычно возвращается { success: true, user }
                showMessage('Hasap üstünlikli döredildi!', 'success');
                registerBtn.disabled = false;
                registerBtn.textContent = 'Hasap döret';
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 1500);
            } catch (error) {
                // Если бекенд ещё не реализовал регистрацию, используем localStorage как fallback
                if (error.message.includes('404') || error.message.includes('Not Found')) {
                    // Временное решение – сохраняем в localStorage
                    let users = JSON.parse(localStorage.getItem('users') || '[]');
                    if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                        showMessage('Bu email eýýäm hasapda bar', 'error');
                        registerBtn.disabled = false;
                        registerBtn.textContent = 'Hasap döret';
                        return;
                    }
                    const newUser = {
                        id: 'user-' + Date.now(),
                        username,
                        email,
                        password,
                        role: 'user',
                        userType: 'private',
                        createdAt: new Date().toISOString()
                    };
                    users.push(newUser);
                    localStorage.setItem('users', JSON.stringify(users));
                    showMessage('Hasap üstünlikli döredildi! (lokal wersiýa)', 'success');
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Hasap döret';
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1500);
                } else {
                    showMessage(error.message || 'Registrasiýa baş tutmady', 'error');
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Hasap döret';
                }
            }
        });

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            messageEl.style.display = 'block';
            setTimeout(() => { messageEl.style.display = 'none'; }, 4000);
        }
    </script>
</body>
</html>
