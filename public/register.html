<!DOCTYPE html>
<html lang="tm">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SFERA — Registrasiya</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Подключаем CSS из папки public/css/ -->
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">
    <div id="particles"></div>

    <div class="auth-container">
        <div class="auth-card glass-panel">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00ffa3" />
                                <stop offset="50%" stop-color="#00d4ff" />
                                <stop offset="100%" stop-color="#1f6bff" />
                            </linearGradient>
                            <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
                                <feGaussianBlur stdDeviation="4" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>
                        <circle cx="50" cy="50" r="28" fill="url(#logoGrad)" opacity="0.15" filter="url(#logoGlow)" />
                        <g filter="url(#logoGlow)">
                            <circle cx="50" cy="50" r="40" stroke="url(#logoGrad)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.4" />
                            <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6" />
                            <circle cx="48" cy="48" r="3.5" fill="#ffffff" filter="url(#logoGlow)" />
                        </g>
                    </svg>
                </div>
                <div class="logo-text">
                    <h2>SFERA</h2>
                    <p>Milli Sanly Platforma</p>
                </div>
            </a>

            <h2 class="auth-title">Ýazylmak / Registrasiya</h2>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regName">Atyňyz / Имя</label>
                    <input type="text" id="regName" required placeholder="Имя" />
                </div>

                <div class="form-group">
                    <label for="regEmail">E-mail</label>
                    <input type="email" id="regEmail" required placeholder="example@sfera.tm" />
                </div>

                <div class="form-group">
                    <label for="regPassword">Aşakdaky syr / Пароль</label>
                    <input type="password" id="regPassword" required placeholder="••••••••" />
                </div>

                <div class="form-group">
                    <label for="regRole">Roly / Роль</label>
                    <select id="regRole" class="form-select">
                        <option value="user">Ulanyjy / Пользователь</option>
                        <option value="admin">Administrator / Админ</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="targetModule">Giriş moduly / Модуль для входа</label>
                    <select id="targetModule" class="form-select">
                        <option value="marketplace">Marketpleýs (Маркетплейс)</option>
                        <option value="dashboard">Dashboard (Панель)</option>
                        <option value="tmpay">TM Pay</option>
                        <option value="tmcoin">TM Coin</option>
                        <option value="bank">TM Bank</option>
                        <option value="ai">AI Analitika</option>
                        <option value="docs">Resmiýetler</option>
                        <option value="messenger">Messenger</option>
                        <option value="mail">Mail TM</option>
                    </select>
                </div>

                <button type="submit" class="primary-btn auth-btn">Ýazylmak / Зарегистрироваться</button>
            </form>

            <div class="auth-footer">
                <p>Eýýäm akkountyňyz barmy? <a href="login.html">Girmek</a></p>
            </div>
        </div>
    </div>

    <!-- Скрипты -->
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            const targetModule = document.getElementById('targetModule').value;

            try {
                // Запрос к Express API (authRoutes.js)
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });

                const data = await response.json();

                if (response.ok) {
                    onAuthSuccess(data.user, data.token, targetModule);
                } else {
                    alert(data.message || 'Ошибка регистрации');
                }
            } catch (err) {
                console.error('Ошибка связи с бэкендом:', err);
                // Фолбэк для автономной работы фронтенда
                onAuthSuccess({ name, email, role }, 'fallback-token', targetModule);
            }
        });
    </script>
</body>
</html>
